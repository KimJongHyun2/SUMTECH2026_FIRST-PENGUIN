<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사진 수동 각도</title>
</head>
<body>
  <h1>사진 수동 각도 측정 (T2 정답 비교)</h1>

  <div class="row">
    <input type="file" id="files" accept="image/*" multiple />
    <span class="status" id="progress"></span>
  </div>

  <p class="hint">사진에서 <b>귀(빨강)</b>를 먼저, <b>어깨(파랑)</b>를 다음에 클릭하세요.</p>

  <div class="row">
    <span class="big" id="angle">-</span>
    <span class="status" id="app"></span>
  </div>

  <div class="row">
    <button id="reset">다시 찍기</button>
    <button class="primary" id="save" disabled>저장하고 다음</button>
    <button id="download">비교 CSV 저장</button>
    <span class="status" id="count">0장</span>
  </div>

  <canvas id="photo" width="640" height="480"></canvas>

  <script type="module" src="/src/angle.js"></script>
</body>
</html>
