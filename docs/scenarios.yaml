# 제출 사용자 흐름 설계 — 구현·E2E 실행 전. ID별 재현 제약은 validation-plan.md에 기록한다.
platform: desktop
platformReason: 주 작업·경고·리포트 화면은 노트북/PC 브라우저다. 휴대폰은 딥 모드의 측면 촬영 보조 기기이며 desktop이라는 값이 휴대폰 동시 실행을 보장하지 않는다. 주최 측 카메라·다중 기기 재현 지원은 확인 대기이다. 모든 흐름은 빈 로컬 기록에서 독립적으로 준비한다.
scenarios:
  - id: S1
    title: 기준 등록과 저장 유지 확인
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - "'카메라 켜기'를 누른다"
      - 브라우저에서 카메라 권한을 허용한다
      - 안내에 맞춰 얼굴·어깨가 보이도록 앉아 '기준 자세 등록'을 누르고 안정 입력 5초를 유지한다
      - 기준 등록 완료 문구를 확인한다
      - 브라우저를 새로고침한다
    expected: 기준 자세가 등록됐어요 문구가 보인다. 새로고침 후 저장된 기준 정보와 준비 상태가 표시되고 카메라는 자동으로 켜지지 않는다. 기준의 존재와 현재 배치 유효성은 구분한다.
  - id: S2
    title: 지속 경고·복귀·종료 리포트 확인
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - "'카메라 켜기'를 누른다"
      - 브라우저에서 카메라 권한을 허용한다
      - 안내에 맞춰 얼굴·어깨가 보이도록 앉아 '기준 자세 등록'을 누르고 안정 입력 5초를 유지한다
      - "'탐지 시작'을 누른다"
      - 기준 대비 이탈 자세를 유효 입력에서 10초 유지한다
      - 화면의 공통 경고를 확인한다
      - 기준 범위로 돌아와 유효 입력에서 3초 유지한다
      - "'세션 종료'를 누른다"
      - "'리포트 보기'를 누른다"
    expected: 공통 경고가 1회 표시되고 복귀 뒤 해제된다. 리포트는 이탈 1회·최초 경고 1회·재경고 0회·정상 복귀 1회를 표시한다. 준비·인식 불가 시간은 유효 시간에서 제외한다. 60초 재경고 전에 복귀하는 입력으로 검증한다.
  - id: S3
    title: 유효 30분 자동 리포트와 계속 기록
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - "'카메라 켜기'를 누른다"
      - 브라우저에서 카메라 권한을 허용한다
      - 안내에 맞춰 얼굴·어깨가 보이도록 앉아 '기준 자세 등록'을 누르고 안정 입력 5초를 유지한다
      - "'탐지 시작'을 누른다"
      - 기준 범위에서 유효 감지 시간이 30:00이 될 때까지 작업한다
      - "'리포트 보기'를 누른다"
      - 리포트를 닫고 유효 감지를 5초 더 유지한다
      - "'세션 종료'를 누른다"
      - "'리포트 보기'를 누른다"
    expected: 첫 유효 1800초에 자동 리포트 1개가 생성되고 세션은 계속된다. 종료하면 후속 5초 이상의 실제 남은 유효 구간만 별도 부분 리포트로 보인다. 실제 30분 시험이 필요하며 1분 목표 공식 실행과의 양립 방법은 미확정이다. 짧은 종료 리포트를 자동 주기 시험으로 대체하지 않는다.
  - id: S4
    title: 일시 정지·재개와 카메라 종료
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - "'카메라 켜기'를 누른다"
      - 브라우저에서 카메라 권한을 허용한다
      - 안내에 맞춰 얼굴·어깨가 보이도록 앉아 '기준 자세 등록'을 누르고 안정 입력 5초를 유지한다
      - "'탐지 시작'을 누른다"
      - "'일시 정지'를 누른다"
      - 5초 동안 정지 상태를 유지한다
      - "'재개'를 누른다"
      - 안내에 따라 현재 기준과 배치를 확인한다
      - "'세션 종료'를 누른다"
      - "'리포트 보기'를 누른다"
    expected: 정지 중 촬영·추론·경고·유효 시간 누적이 중단된다. 배치 확인 후 진행으로 돌아오고 정지·준비 시간은 리포트에서 제외된다. 종료 시 촬영 상태와 저장 완료/실패가 별도로 표시된다.
  - id: S5
    title: 휴대폰 측면 연결부터 통합 경고·종료까지
    steps:
      - PC 첫 화면에서 '딥 모드 사용하기'를 누른다
      - 휴대폰으로 표시된 QR을 스캔한다
      - 휴대폰에서 '연결 요청'을 누른다
      - PC에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 눌러 권한을 허용한다
      - 휴대폰에서 '카메라 켜기'를 눌러 권한을 허용한다
      - 휴대폰을 측면 가이드에 맞춰 고정한다
      - PC에서 '기준 자세 등록'을 누르고 양쪽 안정 입력 5초를 유지한다
      - PC에서 '딥 모드 탐지 시작'을 누른다
      - 검증 대상 이탈을 유효 입력에서 10초 유지한다
      - 기준 범위로 돌아와 3초 유지한다
      - "'세션 종료'를 누른다"
    expected: 승인된 휴대폰의 실제 특징이 통합 판정에 쓰이고 같은 이탈의 경고는 중복되지 않는다. 복귀와 종료가 기록된다. 양쪽 카메라 종료 요청과 실제 확인 상태가 구분된다. 두 기기·HTTPS·영상 재현은 운영진 지원 확인 및 실기기 시험 대기다.
  - id: S6
    title: 딥 모드 끊김 후 기본 모드 계속
    steps:
      - PC 첫 화면에서 '딥 모드 사용하기'를 누른다
      - 휴대폰으로 QR을 스캔한다
      - 휴대폰에서 '연결 요청'을 누른다
      - PC에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 눌러 권한을 허용한다
      - 휴대폰에서 '카메라 켜기'를 눌러 권한을 허용한다
      - 휴대폰을 측면 가이드에 맞춰 고정한다
      - PC에서 '기준 자세 등록'을 누르고 양쪽 안정 입력 5초를 유지한다
      - PC에서 '딥 모드 탐지 시작'을 누른다
      - 휴대폰 연결을 실제로 끊고 PC 복구 대기 표시를 확인한다
      - PC에서 '기본 모드로 계속'을 누른다
      - "'세션 종료'를 누른다"
    expected: 6초간 연결 신호가 없으면 딥 판정·유효 시간이 중단된다. 정면 기준이 유효하면 기본 구간으로 전환되고 장애를 정상 복귀로 집계하지 않는다. 종료 화면에서 모드 구간·중단 사유와 폰 종료 확인 여부가 보인다. 앞 흐름의 연결·기록을 재사용하지 않는다.
  - id: S7
    title: 같은 흐름에서 만든 기록 조회·삭제
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - "'카메라 켜기'를 누른다"
      - 브라우저에서 카메라 권한을 허용한다
      - 안내에 맞춰 얼굴·어깨가 보이도록 앉아 '기준 자세 등록'을 누르고 안정 입력 5초를 유지한다
      - "'탐지 시작'을 누른다"
      - 기준 범위에서 유효 감지를 5초 유지한다
      - "'세션 종료'를 누른다"
      - "'내 기록'을 누른다"
      - 방금 종료한 세션을 선택한다
      - "'기록 삭제'를 누른다"
      - "'삭제 확인'을 누른다"
    expected: 실제 저장한 세션이 조회되고 삭제 성공 후 세션 원장·리포트·파생 집계에서 함께 제거된다. 빈 기록 화면이 표시된다. 앞 시나리오나 다른 브라우저의 기록을 전제로 하지 않는다.
  - id: S8
    title: 설정 변경·재등록·비교 조건 확인
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - "'카메라 켜기'를 누른다"
      - 브라우저에서 카메라 권한을 허용한다
      - 안내에 맞춰 얼굴·어깨가 보이도록 앉아 '기준 자세 등록'을 누르고 안정 입력 5초를 유지한다
      - "'탐지 시작'을 누른다"
      - "'설정'을 연다"
      - 경고 시간을 12초로 변경한다
      - "'적용'을 누른다"
      - "'기준 다시 등록'을 누른다"
      - "'기준 자세 등록'을 누르고 안정 입력 5초를 유지한다"
      - "'탐지 재개'를 누른다"
      - "'세션 종료'를 누른다"
    expected: 설정 변경 시각과 12초 설정 버전, 새 기준 버전이 남는다. 등록 준비 중 판정하지 않으며 탐지 재개 전 자동 재개하지 않는다. 종료 결과에서 설정·기준 변경 전후 구간을 구분하고 다른 조건을 정량 개선으로 비교하지 않는다.
