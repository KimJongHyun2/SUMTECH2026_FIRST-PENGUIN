# 패스트거북이 — 주최측 scenarios.example.yaml 구조의 독립 사용자 흐름이다.
# 각 흐름은 기록·기준·설정이 없는 별도 브라우저 context의 첫 화면(/)에서 시작한다.
# 앞 흐름의 세션·QR·기준·storageState를 재사용하지 않는다. 실제 사용자 기록 삭제를 요구하는 정책은 아니다.
# 로그인 없는 서비스이므로 account는 생략한다. 기본 경고 10초·재경고 60초를 사용한다.
# 실행 환경은 실제 카메라 입력·촬영 배치·권한을 준비한다. 권한 사전 허용이 없으면 '카메라 켜기' 직후 브라우저 권한창의 '허용'을 처리한다.
# 등록 클릭 뒤 연속 안정 유효 입력 5초는 해당 동작의 처리 완료 조건이다.
# expected의 중간 임계점도 같은 유지 동작 안에서 관찰한다. 화면·API로 상태를 강제 생성하지 않는다.
# S3의 30분/1분 실행 충돌과 S5/S6의 다중 기기 재현 제약은 validation-plan.md에 명시하며 통과를 주장하지 않는다.
platform: desktop
platformReason: 대상 대학생은 노트북으로 과제·공부하는 동안 같은 PC 브라우저에서 경고를 확인하고 기록·리포트를 조회한다. 휴대폰은 선택형 딥 모드의 측면 입력 보조 기기이다. 따라서 주 사용 플랫폼은 desktop이며, 이 값이 다중 기기·카메라 자동 입력 지원을 보장하지는 않는다.
scenarios:
  - id: S1
    title: 대학생이 기준 자세를 등록하고 같은 브라우저에서 저장 상태를 확인한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 브라우저를 새로고침한다
    expected: 같은 브라우저에 기준 ID 1개와 등록 시각이 유지되고 상태는 '준비'이다. 카메라는 꺼져 있고 세션은 0개이다. 로그인 화면으로 이동하지 않으며 저장 기준과 현재 배치 확인 필요 여부를 구분해 표시한다. 기준 등록 완료는 연속 안정 유효 입력 5초에만 발생한다.
  - id: S2
    title: 대학생이 10초 기준 이탈 경고를 받고 3초 복귀 후 종료 리포트를 확인한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 이탈 자세를 연속 유효 10초 동안 유지한다
      - 기준 범위의 자세를 연속 유효 3초 동안 유지한다
      - 감지 화면에서 '세션 종료'를 누른다
      - 종료 화면에서 '리포트 보기'를 누른다
    expected: 종료 리포트에 확정 이탈 1회·최초 경고 1회·재경고 0회·정상 복귀 1회가 표시된다. 자동 리포트 0개·종료 리포트 1개이며 등록 5초는 유효 감지 시간에서 제외된다. 세션은 '종료', 카메라는 꺼짐, 기록은 '저장 완료'이다. 유지 동작 중 이탈 9초 경고 0회·10초 최초 경고 1회, 복귀 2초 경고 유지·3초 해제를 확인한다.
  - id: S3
    title: 대학생이 유효 30분 자동 리포트를 보고 같은 세션의 작업을 계속한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 범위의 자세를 유효 감지 시간 30:00까지 유지한다
      - 감지 화면에서 '리포트 보기'를 누른다
      - 리포트 화면에서 '닫기'를 누른다
    expected: 자동 리포트 1개에 첫 구간 유효 1800초·이탈 0초·이탈 비율 0%, 확정 이탈·최초 경고·재경고·정상 복귀 각각 0회가 표시된다. 종료 리포트는 0개이다. 닫은 뒤 같은 세션 ID의 '진행' 상태와 증가하는 유효 시간이 보인다. 29:59까지 자동 리포트 0개, 30:00에 '리포트가 준비됐어요'와 자동 리포트 1개를 확인한다.
  - id: S4
    title: 대학생이 자리 비움 뒤 새 연속 이탈로 판정받고 일시 정지·재개한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 이탈 자세를 연속 유효 6초 동안 유지한다
      - 촬영 범위를 벗어나 자리 비움 상태를 5초 동안 유지한다
      - 같은 배치로 돌아와 기준 이탈 자세를 새로 연속 유효 10초 동안 유지한다
      - 기준 범위의 자세를 연속 유효 3초 동안 유지한다
      - 감지 화면에서 '일시 정지'를 누른다
      - 정지 상태에서 '재개'를 누른다
      - 기준·배치 확인 후 감지 화면에서 '세션 종료'를 누른다
      - 종료 화면에서 '리포트 보기'를 누른다
    expected: 종료 리포트에 확정 이탈 1회·최초 경고 1회·재경고 0회·정상 복귀 1회와 자리 비움 보류 사유가 표시된다. 자리 비움 5초·정지·준비 시간은 유효 시간에서 제외되고 같은 세션 ID를 유지한다. 자리 비움 중 '자리 비움 · 판정 보류'와 멈춘 유효 시간, 돌아온 뒤 이탈 4초까지 경고 0회·새 연속 10초에 최초 경고 1회를 확인한다. 정지 중 촬영은 꺼진다.
  - id: S5
    title: 대학생이 휴대폰을 승인 연결해 딥 모드 경고·복귀·종료 결과를 확인한다
    steps:
      - PC 첫 화면에서 '딥 모드 사용하기'를 누른다
      - 휴대폰으로 PC 화면의 QR을 스캔한다
      - 휴대폰 연결 화면에서 '연결 요청'을 누른다
      - PC 연결 화면에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 누른다
      - 측면 배치가 준비된 휴대폰에서 '카메라 켜기'를 누른다
      - PC에서 '기준 자세 등록'을 누른다
      - 양쪽 기준 등록 완료 후 PC에서 '딥 모드 탐지 시작'을 누른다
      - 양쪽 유효 입력에서 기준 이탈 자세를 연속 10초 동안 유지한다
      - 양쪽 유효 입력에서 기준 범위의 자세를 연속 3초 동안 유지한다
      - PC 감지 화면에서 '세션 종료'를 누른다
      - PC 종료 화면에서 '리포트 보기'를 누른다
    expected: 승인된 휴대폰 1대와 정면·측면 기준이 연결된 딥 모드 종료 리포트가 PC에 저장된다. 확정 이탈 1회·최초 경고 1회·재경고 0회·정상 복귀 1회이며 두 입력을 별도 이탈로 중복 집계하지 않는다. 양쪽 카메라는 '종료 확인', PC 기록은 '저장 완료'이다. 휴대폰에는 기록을 보관하지 않는다. 양쪽 기준은 함께 연속 안정 유효 입력 5초를 충족해야 등록된다.
  - id: S6
    title: 대학생이 독립적으로 시작한 딥 모드의 연결 장애 후 기본 모드로 계속한다
    steps:
      - PC 첫 화면에서 '딥 모드 사용하기'를 누른다
      - 휴대폰으로 PC 화면의 QR을 스캔한다
      - 휴대폰 연결 화면에서 '연결 요청'을 누른다
      - PC 연결 화면에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 누른다
      - 측면 배치가 준비된 휴대폰에서 '카메라 켜기'를 누른다
      - PC에서 '기준 자세 등록'을 누른다
      - 양쪽 기준 등록 완료 후 PC에서 '딥 모드 탐지 시작'을 누른다
      - 기준 범위 입력을 유지한 채 휴대폰 네트워크 연결을 끊는다
      - 복구 대기 표시 후 PC에서 '기본 모드로 계속'을 누른다
      - 유효 정면 입력을 확인한 뒤 PC에서 '세션 종료'를 누른다
      - PC 종료 화면에서 '리포트 보기'를 누른다
    expected: 연결 끊김 감지 후 '복구 대기'에서 딥 판정·유효 시간 누적이 멈춘다. 종료 리포트에는 같은 세션 ID의 딥·기본 모드 구간과 연결 장애·모드 변경 사유가 표시된다. 확정 이탈·최초 경고·재경고·정상 복귀는 각각 0회이다. 휴대폰 응답이 없으면 '종료 요청 · 확인 안 됨'으로 표시하며 종료 성공을 단정하지 않는다.
  - id: S7
    title: 대학생이 직접 만든 로컬 세션을 조회하고 삭제한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 범위의 자세를 연속 유효 5초 동안 유지한다
      - 감지 화면에서 '세션 종료'를 누른다
      - 저장 완료 후 종료 화면에서 '내 기록'을 누른다
      - 기록 목록에서 방금 종료한 세션을 선택한다
      - 세션 상세에서 '기록 삭제'를 누른다
      - 삭제 확인 화면에서 '삭제 확인'을 누른다
    expected: 이 흐름에서 생성한 종료 세션 1개·종료 리포트 1개가 같은 PC 브라우저에서 조회되며 이탈·경고·정상 복귀는 0회이다. 삭제 후 세션·리포트는 각각 0개이고 '저장된 기록이 없어요'가 표시된다. 해당 원장·파생 집계도 조회에서 사라지며 현재 등록 기준은 유지된다. 로그인이나 이전 시나리오 기록을 요구하지 않는다.
  - id: S8
    title: 대학생이 잘못된 경고 시간을 거부받고 기준을 재등록해 탐지를 재개한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 감지 화면에서 '설정'을 누른다
      - 경고 시간 입력란에 0을 입력한다
      - 설정 화면에서 '적용'을 누른다
      - 경고 시간 입력란에 10을 입력한다
      - 설정 화면에서 '적용'을 누른다
      - 감지 화면에서 '기준 다시 등록'을 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 새 기준 등록 완료 후 '탐지 재개'를 누른다
    expected: 0초 적용은 '양의 정수를 입력해 주세요'로 거부되고 기존 저장값 경고 10초·재경고 60초와 설정 버전을 유지한다. 무효 설정 버전은 생성하지 않는다. 10초 적용 후 오류가 해제된다. 재등록 중 판정·유효 시간 누적은 보류되고 연속 안정 5초 뒤 새 기준 ID가 저장된다. '탐지 재개' 후 같은 세션은 '진행'이며 새 기준 구간을 사용한다. 서로 다른 기준 구간을 정량 개선으로 비교하지 않는다.
