# 사용자 흐름이다. 평가용 입력 설계·시간 경계·허용 미확인은 prd.md 7절을 따른다.
# 각 흐름은 빈 context에서 자체 준비한다. 아래 흐름은 구현·주최 측 실행 통과 전이다.
platform: desktop
platformReason: 대상 대학생은 노트북으로 과제·공부하는 동안 같은 PC 브라우저에서 경고를 확인하고 기록·리포트를 조회한다. 휴대폰은 선택형 딥 모드의 측면 입력 보조 기기이다.
scenarios:
  - id: S1
    title: 대학생이 기준 자세를 등록하고 같은 브라우저에서 저장 상태를 확인한다
    steps:
      - 평가 전용 빌드의 첫 화면(/?mode=eval)에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 브라우저를 새로고침한다
    expected: 등록된 기준 ID 1개와 등록 시각이 새로고침 후에도 유지된다. 상태는 '준비', 카메라는 꺼짐, 세션·리포트는 각각 0개이다. 로그인 없이 저장되며 '분석 가능한 기록이 없습니다'를 표시한다. 이탈 비율을 0%로 채우지 않는다.
  - id: S2
    title: 대학생이 10초 기준 이탈 경고를 받고 3초 복귀 후 종료 리포트를 확인한다
    steps:
      - 평가 전용 빌드의 첫 화면(/?mode=eval)에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 감지 화면에서 '테스트 도구'를 누른다
      - "'[테스트용] 정면 이탈·복귀 재생'을 눌러 녹화 입력의 이탈 10초와 복귀 3초 연속 재생 완료를 기다린다"
      - 감지 화면에서 '세션 종료'를 누른다
      - 종료 화면에서 '리포트 보기'를 누른다
    expected: 종료 리포트 1개·자동 리포트 0개, 확정 이탈·최초 경고·정상 복귀 각 1회·재경고 0회이다. 리포트의 비율은 실제 D/V*100(%)와 일치한다. 세션 종료·카메라 꺼짐·저장 완료가 표시된다. 입력의 명목 D는 13초이며 영상 측정의 수용 오차는 PRD 7절을 따른다.
  - id: S3
    title: 대학생이 테스트에서 3초로 가속된 자동 리포트를 보고 같은 세션의 작업을 계속한다
    steps:
      - 평가 전용 빌드의 첫 화면(/?mode=eval)에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '테스트 도구'를 누른다
      - 테스트 도구에서 '[테스트용] 리포트 3초 가속'을 누른다
      - 감지 준비 화면에서 '탐지 시작'을 누르고 기준 범위 입력으로 유효 3초 처리 완료를 기다린다
      - 감지 화면에서 '리포트 보기'를 누른다
      - 리포트 화면에서 '닫기'를 누른다
    expected: >-
      '리포트가 준비됐어요'와 자동 리포트 1개가 표시된다. 첫 구간은 실제 V=3초·D=0초·비율 0%, 이탈·경고·복귀·종료 리포트는 각각 0개이다. 테스트 표시가 남고 첫 주기 가속은 해제된다. 상세를 닫으면 같은 세션이 계속되며 다음 자동 주기는 1800초이다.
  - id: S4
    title: 대학생이 자리 비움으로 시간 연속성이 끊긴 뒤 새 이탈 경고를 확인한다
    steps:
      - 평가 전용 빌드의 첫 화면(/?mode=eval)에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 감지 화면에서 '테스트 도구'를 누른다
      - "'[테스트용] 자리 비움·재이탈 재생'을 눌러 이탈 6초→자리 비움 5초→새 이탈 10초→복귀 3초의 녹화 입력 연속 재생 완료를 기다린다"
      - 감지 화면에서 '일시 정지'를 누른다
      - 정지 상태에서 '재개'를 누른다
      - 기준·배치 확인 후 감지 화면에서 '세션 종료'를 누른다
      - 종료 화면에서 '리포트 보기'를 누른다
    expected: 종료 리포트 1개에 확정 이탈·최초 경고·정상 복귀 각 1회·재경고 0회와 자리 비움 보류 사유가 남는다. 첫 후보 6초는 V에만 포함하고 자리 비움 5초·정지·준비는 V에서 제외한다. 비율은 실제 D/V*100(%)이다. 정지·재개 전후 같은 세션 ID를 유지하며 카메라 꺼짐·저장 완료가 표시된다.
  - id: S5
    title: 대학생이 딥 모드에서 경고와 복귀 후 종료 리포트를 확인한다
    steps:
      - 평가 전용 빌드의 PC 첫 화면(/?mode=eval)에서 '딥 모드 사용하기'를 누른다
      - PC 연결 화면에서 '테스트 도구'를 누른다
      - 테스트 도구에서 '[테스트용] 측면 데이터 주입'을 눌러 휴대폰 연결 요청과 유효 측면 입력을 시뮬레이션한다
      - PC 연결 화면에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 누른다
      - PC에서 '기준 자세 등록'을 누른다
      - 양쪽 기준 등록 완료 후 PC에서 '딥 모드 탐지 시작'을 누른다
      - 테스트 도구에서 '[테스트용] 양쪽 이탈·복귀 재생'을 누르고 이탈 10초의 최초 경고와 이어지는 복귀 3초의 경고 해제를 기다린다
      - PC 감지 화면에서 '세션 종료'를 누른다
      - PC 종료 화면에서 '리포트 보기'를 누른다
    expected: PC 승인 후 양쪽 기준이 등록되고 테스트 표시가 있는 딥 종료 리포트 1개가 PC에 저장된다. 확정 이탈·최초 경고·정상 복귀 각 1회, 재경고·자동 리포트 각 0개이다. 비율은 중복 없는 실제 딥 D/V*100(%)이다. PC 카메라 꺼짐·측면 모의 종료 응답·PC 저장 완료를 표시한다. 실제 QR·휴대폰 촬영 종료 검증을 뜻하지 않는다.
  - id: S6
    title: 대학생이 딥 모드 장애 시 판정 보류 후 기본 모드로 안전 전환한다
    steps:
      - 평가 전용 빌드의 PC 첫 화면(/?mode=eval)에서 '딥 모드 사용하기'를 누른다
      - PC 연결 화면에서 '테스트 도구'를 누른다
      - 테스트 도구에서 '[테스트용] 측면 데이터 주입'을 눌러 휴대폰 연결 요청과 유효 측면 입력을 시뮬레이션한다
      - PC 연결 화면에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 누른다
      - PC에서 '기준 자세 등록'을 누른다
      - 양쪽 기준 등록 완료 후 PC에서 '딥 모드 탐지 시작'을 누른다
      - 딥 유효 입력 1초 이상을 확인한 뒤 '[테스트용] 측면 연결 끊기'를 눌러 측면 입력 중단·연결 끊김·종료 무응답을 주입한다
      - 복구 대기 표시 후 PC에서 '기본 모드로 계속'을 누른다
      - 기본 모드 유효 정면 입력 1초 이상을 확인한 뒤 PC에서 '세션 종료'를 누른다
      - PC 종료 화면에서 '리포트 보기'를 누른다
    expected: 연결 끊김 뒤 '기본 모드로 계속' 선택으로 같은 세션의 기본 구간이 생긴다. 종료 리포트에 테스트 표시·딥/기본 구간·장애/모드 변경 사유가 남는다. 이탈·경고·복귀·자동 리포트 각 0개, D=0초, 각 모드 V>=1초·비율 0%이다. PC 카메라 꺼짐·저장 완료와 측면 '종료 요청·확인 안 됨'을 표시한다.
  - id: S7
    title: 대학생이 직접 만든 로컬 세션을 조회하고 삭제한다
    steps:
      - 평가 전용 빌드의 첫 화면(/?mode=eval)에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 범위의 자세를 연속 유효 5초 동안 유지한다
      - 감지 화면에서 '세션 종료'를 누른다
      - 저장 완료 후 종료 화면에서 '내 기록'을 누른다
      - 기록 목록에서 방금 종료한 세션을 선택한다
      - 세션 상세에서 '기록 삭제'를 누른다
      - 삭제 확인 화면에서 '삭제 확인'을 누른다
    expected: 자체 생성한 종료 세션·종료 리포트 각 1개가 조회되며 실제 V>=5초·D=0초·비율 0%, 이탈·경고·복귀 각 0회이다. 삭제 확인 뒤 세션·리포트·원장·파생 집계가 제거되고 '저장된 기록이 없어요'를 표시한다. 현재 등록 기준은 유지된다.
  - id: S8
    title: 대학생이 잘못된 경고 시간을 거부받고 기준을 재등록해 탐지를 재개한다
    steps:
      - 평가 전용 빌드의 첫 화면(/?mode=eval)에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 감지 화면에서 '설정'을 누른다
      - 경고 시간 입력란에 0을 입력한다
      - 설정 화면에서 '적용'을 누른다
      - 경고 시간 입력란에 10을 입력한다
      - 설정 화면에서 '적용'을 누른다
      - 감지 화면에서 '기준 다시 등록'을 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 새 기준 등록 완료 후 '탐지 재개'를 누른다
    expected: 0초 적용 시 '양의 정수를 입력해 주세요'를 표시한다. 기존과 같은 10초 적용 뒤 오류가 해제되고 기존 경고 10초·재경고 60초·설정 버전·측정 구간을 유지한다. 재등록으로 새 기준 ID를 저장하고 '탐지 재개' 뒤 같은 세션의 새 기준 구간에서 진행한다. 이탈·경고·복귀 각 0회이며 이전 기록을 새 기준으로 덮어쓰지 않는다.
