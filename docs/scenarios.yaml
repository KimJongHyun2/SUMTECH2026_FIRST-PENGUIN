# 주최측 scenarios.example.yaml 양식: 3~8개, 흐름당 1~12단계, expected 1~500자이다.
# 로그인 없는 서비스이므로 모든 흐름에서 account를 생략한다.
# 독립성: 각 흐름은 저장 기록·기준·설정이 없는 별도 브라우저 context의 첫 화면(/)에서 시작한다.
# 브라우저 context는 기록 격리를 위한 실행 환경이며 다른 흐름의 storageState·기록 ID·계정을 재사용하지 않는다.
# 실제 사용에서는 기존 기록을 지우지 않는다. 빈 기록은 시험 환경의 전제이며 사용자 데이터 삭제 단계가 아니다.
# 환경: 기본 경고 10초·재경고 60초, 실제 카메라 입력·촬영 배치·권한이 준비되어 있다.
# 권한을 미리 허용하지 못한 환경은 '카메라 켜기' 직후 브라우저 권한창의 '허용'을 처리한다.
# 등록 버튼 뒤 안정 5초 대기는 한 동작의 처리 조건이다. 가짜 입력·시간 조작으로 대신하지 않는다.
# 카메라·자리 비움·휴대폰 입력은 물리적 조건이다. 주최측 자동 재현 지원 여부는 validation-plan.md에서 별도로 추적한다.
platform: desktop
platformReason: |-
  대상 대학생은 노트북으로 과제·공부하는 동안 같은 PC 브라우저에서 경고를 확인하고 기록·리포트를 조회한다.
  따라서 주 화면은 desktop이다. 휴대폰은 딥 모드의 측면 입력 보조 기기이며 mobile 독립 서비스가 아니다.
  desktop 설정만으로 두 기기·카메라가 제공되는 것은 아니다. 다중 기기 재현 지원은 확인 대기이다.
scenarios:
  - id: S1
    title: 대학생이 기준 자세를 등록하고 같은 브라우저에서 저장 상태를 확인한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 브라우저를 새로고침한다
    expected: |-
      연속 안정 입력 5초 후 '기준 자세가 등록됐어요'가 표시된다. 새로고침 후 같은 브라우저에 기준 ID 1개와 등록 시각이 유지된다. 상태는 '준비'이며 카메라는 꺼져 있고 세션은 시작되지 않는다. 저장 기준의 존재와 현재 배치 확인 필요 여부를 구분해 표시하며 로그인 화면으로 이동하지 않는다.
  - id: S2
    title: 대학생이 10초 기준 이탈 경고를 받고 3초 복귀 후 종료 리포트를 확인한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 이탈 자세를 연속 유효 10초 동안 유지한다
      - 기준 범위의 자세를 연속 유효 3초 동안 유지한다
      - 감지 화면에서 '세션 종료'를 누른다
      - 종료 화면에서 '리포트 보기'를 누른다
    expected: |-
      연속 이탈 9초까지 경고 0회, 10초에 공통 경고 1회가 표시된다. 기준 범위 복귀 2초까지 경고를 유지하고 3초에 해제한다. 종료 리포트는 확정 이탈 1회·최초 경고 1회·재경고 0회·정상 복귀 1회·자동 리포트 0개를 표시한다. 등록 5초는 유효 감지 시간에 포함하지 않는다. 세션은 '종료', 카메라는 꺼짐, 기록은 '저장 완료'로 표시된다.
  - id: S3
    title: 대학생이 유효 30분 자동 리포트를 보고 같은 세션의 작업을 계속한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 범위의 자세를 유효 감지 시간 30:00까지 유지한다
      - 감지 화면에서 '리포트 보기'를 누른다
      - 리포트 화면에서 '닫기'를 누른다
    expected: |-
      유효 29:59까지 자동 리포트 0개, 30:00에 '리포트가 준비됐어요'와 자동 리포트 1개가 표시된다. 첫 구간 유효 시간은 1800초, 이탈 시간 0초·비율 0%, 확정 이탈·최초 경고·재경고·정상 복귀는 각각 0회이다. 닫은 후 같은 세션 ID의 '진행' 상태와 증가하는 유효 시간이 보인다. 종료 리포트는 아직 없다. 실제 30분 시험이 필요하며 짧은 주최측 자동 재현 방식은 미확정이다.
  - id: S4
    title: 대학생이 자리 비움 뒤 새 연속 이탈로 판정받고 일시 정지·재개한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 이탈 자세를 연속 유효 6초 동안 유지한다
      - 촬영 범위를 벗어나 자리 비움 상태를 5초 동안 유지한다
      - 같은 배치로 돌아와 기준 이탈 자세를 새로 연속 유효 10초 동안 유지한다
      - 기준 범위의 자세를 연속 유효 3초 동안 유지한다
      - 감지 화면에서 '일시 정지'를 누른다
      - 정지 상태에서 '재개'를 누른다
      - 기준·배치 확인 후 감지 화면에서 '세션 종료'를 누른다
      - 종료 화면에서 '리포트 보기'를 누른다
    expected: |-
      자리 비움 동안 '자리 비움 · 판정 보류'와 멈춘 유효 시간이 보이며 경고는 0회이다. 복귀 후 이탈 4초에는 경고 0회로 이전 6초와 합산하지 않고, 새 연속 10초에 최초 경고 1회가 표시된다. 종료 리포트는 확정 이탈 1회·최초 경고 1회·재경고 0회·정상 복귀 1회와 자리 비움 중단 사유를 표시한다. 자리 비움 5초·정지·준비 시간은 유효 시간에서 제외한다. 정지 중 카메라는 꺼지고 재개 후 같은 세션 ID를 유지한다.
  - id: S5
    title: 대학생이 휴대폰을 승인 연결해 딥 모드 경고·복귀·종료 결과를 확인한다
    steps:
      - PC 첫 화면에서 '딥 모드 사용하기'를 누른다
      - 휴대폰으로 PC 화면의 QR을 스캔한다
      - 휴대폰 연결 화면에서 '연결 요청'을 누른다
      - PC 연결 화면에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 누른다
      - 측면 배치가 준비된 휴대폰에서 '카메라 켜기'를 누른다
      - PC에서 '기준 자세 등록'을 누른다
      - 양쪽 기준 등록 완료 후 PC에서 '딥 모드 탐지 시작'을 누른다
      - 양쪽 유효 입력에서 기준 이탈 자세를 연속 10초 동안 유지한다
      - 양쪽 유효 입력에서 기준 범위의 자세를 연속 3초 동안 유지한다
      - PC 감지 화면에서 '세션 종료'를 누른다
      - PC 종료 화면에서 '리포트 보기'를 누른다
    expected: |-
      승인된 휴대폰 1대만 연결되고 양쪽 연속 안정 5초 후 정면·측면 기준이 등록된다. 딥 구간의 확정 이탈 1회·최초 경고 1회·재경고 0회·정상 복귀 1회가 PC 종료 리포트에 표시되며 두 입력을 별도 이탈로 중복 집계하지 않는다. 성공 경로에서 양쪽 카메라 '종료 확인'과 PC '저장 완료'가 표시된다. 휴대폰에는 기록을 보관하지 않는다. 다중 기기·실제 통합 입력의 공식 재현 지원은 미확인이다.
  - id: S6
    title: 대학생이 독립적으로 시작한 딥 모드의 연결 장애 후 기본 모드로 계속한다
    steps:
      - PC 첫 화면에서 '딥 모드 사용하기'를 누른다
      - 휴대폰으로 PC 화면의 QR을 스캔한다
      - 휴대폰 연결 화면에서 '연결 요청'을 누른다
      - PC 연결 화면에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 누른다
      - 측면 배치가 준비된 휴대폰에서 '카메라 켜기'를 누른다
      - PC에서 '기준 자세 등록'을 누른다
      - 양쪽 기준 등록 완료 후 PC에서 '딥 모드 탐지 시작'을 누른다
      - 기준 범위 입력을 유지한 채 휴대폰 네트워크 연결을 끊는다
      - 복구 대기 표시 후 PC에서 '기본 모드로 계속'을 누른다
      - 유효 정면 입력을 확인한 뒤 PC에서 '세션 종료'를 누른다
      - PC 종료 화면에서 '리포트 보기'를 누른다
    expected: |-
      연결 신호가 6초간 없으면 PC에 '복구 대기'가 표시되고 딥 판정·유효 시간 누적이 멈춘다. 전환 후 같은 세션 ID에 딥·기본 모드 구간이 분리된다. 리포트의 확정 이탈·최초 경고·재경고·정상 복귀는 각각 0회이며 연결 장애·모드 변경 사유가 보인다. 휴대폰 응답이 없으면 '종료 요청 · 확인 안 됨'으로 표시하며 종료 성공으로 단정하지 않는다. 앞 시나리오의 QR·연결·기준을 사용하지 않는다.
  - id: S7
    title: 대학생이 직접 만든 로컬 세션을 조회하고 삭제한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 범위의 자세를 연속 유효 5초 동안 유지한다
      - 감지 화면에서 '세션 종료'를 누른다
      - 저장 완료 후 종료 화면에서 '내 기록'을 누른다
      - 기록 목록에서 방금 종료한 세션을 선택한다
      - 세션 상세에서 '기록 삭제'를 누른다
      - 삭제 확인 화면에서 '삭제 확인'을 누른다
    expected: |-
      이 흐름에서 만든 종료 세션 1개와 종료 리포트 1개가 같은 PC 브라우저에서 조회되고 이탈·경고·정상 복귀는 0회이다. 삭제 성공 후 세션 수와 리포트 수는 각각 0개이며 '저장된 기록이 없어요'가 표시된다. 삭제한 세션은 원장·리포트·파생 집계 조회에서 함께 사라진다. 현재 등록 기준은 세션 삭제만으로 제거하지 않는다. 로그인이나 앞 시나리오의 저장 기록을 요구하지 않는다.
  - id: S8
    title: 대학생이 잘못된 경고 시간을 거부받고 기준을 재등록해 탐지를 재개한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 감지 화면에서 '설정'을 누른다
      - 경고 시간 입력란에 0을 입력한다
      - 설정 화면에서 '적용'을 누른다
      - 경고 시간 입력란에 10을 입력한다
      - 설정 화면에서 '적용'을 누른다
      - 감지 화면에서 '기준 다시 등록'을 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 새 기준 등록 완료 후 '탐지 재개'를 누른다
    expected: |-
      0초 적용 시 '허용 범위의 정수를 입력해 주세요'가 표시되고 저장값은 경고 10초·재경고 60초로 유지되며 무효 설정 버전은 생성되지 않는다. 10초 적용 후 오류가 해제된다. 재등록 중 판정·유효 시간 누적은 보류되고 연속 안정 5초 후 이전과 다른 기준 ID가 저장된다. '탐지 재개' 후 같은 세션은 '진행'이며 새 기준 구간을 사용한다. 이전 기준 구간과 정량 개선으로 비교하지 않는다.
