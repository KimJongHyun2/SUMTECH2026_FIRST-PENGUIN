# 핵심 사용자 흐름 (docs/scenarios.yaml)
# steps의 버튼·메뉴 이름은 실제 화면과 똑같아야 해요. 화면 이름을 바꾸면 이 파일과 e2e spec도 같은 commit에서 고쳐요.
# 로그인 없는 서비스라 account를 쓰지 않아요. 흐름마다 새 브라우저(빈 localStorage)에서 시작해요.
# 예시 지갑(카드 A·B·C)은 data/example-wallet.json으로 고정돼 있어 결과가 항상 같아요(problem.yaml F2 참고).

platform: mobile
platformReason: |-
  문제가 일어나는 순간이 계산대 앞에서 결제하기 직전이라, 그 자리에서 꺼내는 휴대폰 화면이 주 사용 환경이다.
  한 달 플랜(F6)도 휴대폰에서 보지만, 발표 시연에서 노트북으로 열어도 깨지지 않게 만든다.

scenarios:
  - id: S1
    title: 예시 지갑으로 결제 순간 카드 추천 받기
    steps:
      - 첫 화면에서 "예시 지갑으로 체험하기" 버튼을 누른다
      - 분야에서 "카페"를 고른다
      - 결제 금액에 6000을 입력한다
      - '"어떤 카드로 낼까?" 버튼을 누른다'
    expected: 1위에 카드 B의 이름과 "내세요"가 보이고, 0원보다 큰 할인액이 "원 할인"으로 보이며, 지갑의 카드 3장이 모두 순위에 보인다

  - id: S2
    title: 가게 이름으로 분야를 AI가 찾아 주기
    steps:
      - 첫 화면에서 "예시 지갑으로 체험하기" 버튼을 누른다
      - '"가게 이름으로 찾기" 칸에 "메가커피 강남역점"을 입력한다'
      - '"분야 찾기" 버튼을 누른다'
    expected: 응답이 오면 분야 선택이 "카페"로 바뀌어 있다

  - id: S3
    title: 내 지갑에 카드를 직접 담기
    steps:
      - 첫 화면에서 "내 지갑 만들기" 버튼을 누른다
      - '"카드 추가" 버튼을 누른다'
      - 검색 칸에 "체크"를 입력한다
      - 검색 결과의 첫 번째 카드를 누른다
      - 지난달 사용액에 1000000을 입력한다
      - '"지갑에 담기" 버튼을 누른다'
    expected: 내 지갑에 카드 1장이 보이고, 그 카드에 "이번 달 혜택 ON"이 보인다

  - id: S4
    title: 결제를 기록하면 실적 게이지가 늘기
    steps:
      - 첫 화면에서 "예시 지갑으로 체험하기" 버튼을 누른다
      - 분야에서 "카페"를 고른다
      - 결제 금액에 6000을 입력한다
      - '"어떤 카드로 낼까?" 버튼을 누른다'
      - 1위 카드의 "이 카드로 결제했어요" 버튼을 누른다
      - 아래 탭에서 "지갑"을 누른다
    expected: '"이번 달 기록"에 카페 6,000원 기록이 1건 보이고, 카드 B의 "다음 달 혜택까지 남은 금액"이 6,000원 줄어 있다'

  - id: S5
    title: 이 결제로 다음 달 혜택을 확보하는 카드 알려 주기
    steps:
      - 첫 화면에서 "예시 지갑으로 체험하기" 버튼을 누른다
      - 분야에서 "편의점"을 고른다
      - 결제 금액에 10000을 입력한다
      - '"어떤 카드로 낼까?" 버튼을 누른다'
    expected: 카드 C에 "이 결제로 다음 달 혜택 확보"가 보인다

  - id: S6
    title: 한 달 카드 플랜으로 더 받는 금액 확인하기
    steps:
      - 첫 화면에서 "예시 지갑으로 체험하기" 버튼을 누른다
      - 아래 탭에서 "플랜"을 누른다
      - '"예시 지출 넣기" 버튼을 누른다'
      - '"플랜 만들기" 버튼을 누른다'
    expected: '"지금보다 월"과 0원 이상의 금액이 보이고, 분야별 배정 표에 9개 분야가 모두 카드 이름과 함께 보인다'

  - id: S7
    title: 결제 금액 없이 추천을 누르면 막히기
    steps:
      - 첫 화면에서 "예시 지갑으로 체험하기" 버튼을 누른다
      - 분야에서 "편의점"을 고른다
      - '"어떤 카드로 낼까?" 버튼을 누른다'
    expected: 화면에 "결제 금액을 입력해 주세요"가 보이고 카드 순위가 나오지 않는다
