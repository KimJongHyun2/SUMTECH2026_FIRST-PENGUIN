# 핵심 사용자 흐름 (docs/scenarios.yaml)
# steps의 버튼·메뉴 이름은 실제 화면과 똑같아야 해요. 화면 이름을 바꾸면 이 파일과 e2e spec도 같은 commit에서 고쳐요.
# 로그인 없는 서비스라 account를 쓰지 않아요.

platform: mobile
platformReason: |-
  카드는 친구와 이야기하다 혹은 카드 광고를 보다가 그 자리에서 휴대폰으로 찾아보는 경우가 많다고 팀이 판단했다.
  (초안: 팀원 실제 경험으로 확인 필요. 데스크톱도 쓰인다면 both로 바꾸고 E2E를 두 화면에서 모두 통과시켜야 함)

scenarios:
  - id: S1
    title: 내 정보와 지출을 넣고 카드 추천 받기
    steps:
      - 첫 화면에서 "내 카드 찾기" 버튼을 누른다
      - 신분에서 "대학생"을 고른다
      - 나이에 22를 입력한다
      - 카드 종류에서 "체크카드"를 고른다
      - 연회비 상한에 10000을 입력한다
      - 식비·카페에 300000, 대중교통에 60000, 구독서비스에 13000을 입력한다
      - '"추천 받기" 버튼을 누른다'
    expected: 추천 결과에 카드 3장이 1위부터 순서대로 보이고, 카드마다 "예상 월 혜택"과 "연간 순혜택" 금액이 원 단위로 보인다

  - id: S2
    title: 문장으로 쓴 소비를 AI로 지출 칸에 채우기
    steps:
      - 첫 화면에서 "내 카드 찾기" 버튼을 누른다
      - '"문장으로 입력" 칸에 "배달음식에 한 달 20만 원, 지하철 6만 원 써요"를 입력한다'
      - '"AI로 채우기" 버튼을 누른다'
    expected: 응답이 오면 식비·카페 칸과 대중교통 칸에 0보다 큰 금액이 채워진다

  - id: S3
    title: 신분에 맞지 않는 카드는 추천에서 빠지기
    steps:
      - 첫 화면에서 "내 카드 찾기" 버튼을 누른다
      - 신분에서 "직장인"을 고른다
      - 나이에 27을 입력한다
      - 카드 종류에서 "상관없음"을 고른다
      - 연회비 상한에 50000을 입력한다
      - 식비·카페에 400000, 온라인쇼핑에 200000을 입력한다
      - '"추천 받기" 버튼을 누른다'
    expected: 추천 결과에 가입 대상이 "대학생 전용" 또는 "군인 전용"인 카드가 하나도 없다

  - id: S4
    title: 지출을 넣지 않으면 추천이 막히기
    steps:
      - 첫 화면에서 "내 카드 찾기" 버튼을 누른다
      - 신분에서 "대학생"을 고른다
      - 나이에 22를 입력한다
      - '"추천 받기" 버튼을 누른다'
    expected: 화면에 "지출 금액을 하나 이상 입력해 주세요"가 보이고 추천 결과로 넘어가지 않는다

  - id: S5
    title: 추천 카드의 상세 정보와 출처 확인하기
    steps:
      - 첫 화면에서 "내 카드 찾기" 버튼을 누른다
      - 신분에서 "대학생"을 고른다
      - 나이에 22를 입력한다
      - 식비·카페에 300000을 입력한다
      - '"추천 받기" 버튼을 누른다'
      - 1위 카드의 이름을 누른다
    expected: 카드 상세 화면에 혜택 목록, 전월실적, 연회비, "출처" 링크와 "기준" 날짜가 보인다

  - id: S6
    title: 추천 카드 두 장 비교하기
    steps:
      - 첫 화면에서 "내 카드 찾기" 버튼을 누른다
      - 신분에서 "대학생"을 고른다
      - 나이에 22를 입력한다
      - 식비·카페에 300000, 대중교통에 60000을 입력한다
      - '"추천 받기" 버튼을 누른다'
      - 1위 카드의 "비교 담기" 버튼을 누른다
      - 2위 카드의 "비교 담기" 버튼을 누른다
      - '"비교하기" 버튼을 누른다'
    expected: 비교 표에 두 카드가 나란히 보이고 두 카드의 "연간 순혜택" 금액이 각각 보인다

  - id: S7
    title: 전체 카드 목록을 군인 카드로 거르기
    steps:
      - 첫 화면에서 "전체 카드 보기" 버튼을 누른다
      - 가입 대상 필터에서 "군인"을 고른다
    expected: 목록에 보이는 모든 카드의 가입 대상이 "군인 전용"이다

  - id: S8
    title: 지금 쓰는 카드와 비교해 바꾸면 얼마 더 받는지 보기
    steps:
      - 첫 화면에서 "내 카드 찾기" 버튼을 누른다
      - 신분에서 "대학생"을 고른다
      - 나이에 22를 입력한다
      - 식비·카페에 300000, 대중교통에 60000을 입력한다
      - '"지금 쓰는 카드" 칸에 시드 카드 이름 일부를 입력하고 첫 번째 검색 결과를 고른다'
      - '"추천 받기" 버튼을 누른다'
    expected: 추천 결과 맨 위에 "지금 카드"의 연간 순혜택과 "1위 카드로 바꾸면 연" 금액(또는 "지금 카드가 가장 잘 맞아요")이 보이고, 추천 카드마다 "지금보다 연" 차이 금액이 보인다
