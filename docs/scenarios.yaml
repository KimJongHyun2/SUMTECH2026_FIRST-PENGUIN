# 패스트거북이 사용자 핵심 흐름. 대시보드와 주최 측 실행이 main의 docs/scenarios.yaml을 직접 읽는다.
# 버튼·메뉴 이름은 docs/prd.md 5~6장과 같다. 화면 글자를 바꾸면 PRD·이 파일·e2e spec을 같은 commit에서 고친다.
# 로그인 없음 → account 생략. 기준 자세는 브라우저에 저장되므로 각 흐름이 스스로 기준을 등록한다.
# 경고 시간 기본값 30초, 복귀 확인 5초 (prd.md 7장, 가정값).
platform: desktop
platformReason: |
  대상은 노트북으로 공부·작업하며 오래 앉아 있는 대학생과 개발자다. 거북목 자세는 노트북 화면에
  집중할 때 생기고, 그 노트북에 달린 정면 웹캠이 자세를 본다. 감지하는 동안 사용자는 같은 컴퓨터의
  다른 창에서 일하므로 경고도 PC 화면·브라우저 알림으로 받아야 한다. 휴대폰은 보류한 딥 모드(측면 카메라)에서만 쓴다.
scenarios:
  - id: S1
    title: 처음 온 사용자가 바른 자세를 기준으로 등록한다
    steps:
      - 첫 화면에서 '시작하기'를 누른다
      - 기준 등록 화면에서 '카메라 켜기'를 누르고 카메라를 허용한다
      - 안내에 따라 바른 자세로 앉아 얼굴과 양쪽 어깨가 인식 '안정'이 될 때까지 기다린다
      - 기준 등록 버튼 '기준 등록'을 누른다
    expected: 기준 자세가 등록됐어요 문구가 보인 뒤 감지 화면으로 이동하고, 상태가 '준비 중'으로 표시된다. 새로고침해도 감지 화면에 기준이 남아 있다
  - id: S2
    title: 사용자가 세션을 시작하고 거북이 자세가 30초 이어지면 경고를 받는다
    steps:
      - 첫 화면에서 '시작하기'를 누른다
      - 기준 등록 화면에서 '카메라 켜기'를 누르고 카메라를 허용한다
      - 바른 자세로 앉아 '기준 등록'을 누른다
      - 감지 화면에서 '세션 시작'을 누른다
      - 바른 자세를 유지해 상태가 '감지 중 · 바른 자세'인지 확인한다
      - 목을 앞으로 내밀어 상태가 '주의'로 바뀌고 이탈 시간이 올라가는 것을 확인한다
      - 그 자세를 30초 이상 유지한다
    expected: 화면에 거북이가 되었습니다 경고 배너가 보이고 소리가 난다. 자세를 바르게 고쳐 5초가 지나면 배너가 사라지고 이탈 시간이 0:00으로 돌아간다
  - id: S3
    title: 사용자가 세션을 끝내고 리포트에서 경고 기록을 본다
    steps:
      - 첫 화면에서 '시작하기'를 누른다
      - 기준 등록 화면에서 '카메라 켜기'를 누르고 카메라를 허용한다
      - 바른 자세로 앉아 '기준 등록'을 누른다
      - 감지 화면에서 '세션 시작'을 누른다
      - 목을 앞으로 내민 자세를 30초 이상 유지해 경고를 1번 받는다
      - 바른 자세로 돌아와 경고가 해제될 때까지 기다린다
      - 감지 화면에서 '세션 종료'를 누른다
    expected: 리포트 화면에 전체 세션 시간, 유효 감지 시간, 이탈 횟수 1회, 이탈 누적 시간, 이탈 비율, 경고 횟수 1회(최초 1·재경고 0)와 경고 시점이 보인다
  - id: S4
    title: 자리가 바뀐 사용자가 기준 자세를 다시 등록한다
    steps:
      - 첫 화면에서 '시작하기'를 누른다
      - 기준 등록 화면에서 '카메라 켜기'를 누르고 카메라를 허용한다
      - 바른 자세로 앉아 '기준 등록'을 누른다
      - 감지 화면에서 '세션 시작'을 누른다
      - 감지 화면에서 '기준 다시 등록'을 누른다
      - 기준 등록 화면에서 자세를 다시 잡고 '기준 등록'을 누른다
    expected: 세션이 '일시 정지'로 바뀐 뒤 기준 등록 화면으로 가고, 다시 등록하면 기준 자세가 등록됐어요 문구와 함께 감지 화면으로 돌아와 새 기준으로 '바른 자세'가 표시된다
  - id: S5
    title: 카메라를 거부한 사용자가 이유와 재시도 방법을 본다
    steps:
      - 첫 화면에서 '시작하기'를 누른다
      - 기준 등록 화면에서 '카메라 켜기'를 누르고 카메라를 거부한다
    expected: 카메라를 쓸 수 없어요 문구와 주소창의 카메라 아이콘에서 허락한 뒤 '다시 시도'를 누르라는 안내가 보이고, '기준 등록' 버튼은 비활성이다
  - id: S6
    title: 자리를 비운 사용자의 시간은 이탈·유효 감지 시간에 들어가지 않는다
    steps:
      - 첫 화면에서 '시작하기'를 누른다
      - 기준 등록 화면에서 '카메라 켜기'를 누르고 카메라를 허용한다
      - 바른 자세로 앉아 '기준 등록'을 누른다
      - 감지 화면에서 '세션 시작'을 누른다
      - 목을 앞으로 내밀어 상태가 '주의'로 바뀐 것을 확인한다
      - 화면 밖으로 나가 상태가 '자리 비움'으로 바뀌는 것을 확인한다
      - 자리로 돌아와 바른 자세로 앉는다
      - 감지 화면에서 '세션 종료'를 누른다
    expected: 자리 비움 동안 이탈 시간과 유효 감지 시간이 멈추고 경고가 오지 않는다. 돌아오면 상태가 '감지 중'으로 재개되고, 리포트의 유효 감지 시간은 자리 비운 시간을 뺀 값이며 경고 횟수는 0회다
