# 패스트거북이 — 주최측 scenarios.example.yaml 구조의 독립 사용자 흐름이다.
# 각 흐름은 기록·기준·설정이 없는 별도 브라우저 context의 첫 화면(/)에서 시작한다.
# 앞 흐름의 세션·QR·기준·storageState를 재사용하지 않는다. 실제 사용자 기록 삭제를 요구하는 정책은 아니다.
# 로그인 없는 서비스이므로 account는 생략한다. 기본 경고 10초·재경고 60초를 사용한다.
# 운영·실기기 시험은 실제 카메라 입력·촬영 배치·권한을 준비한다. 권한 사전 허용이 없으면 '카메라 켜기' 직후 브라우저 권한창의 '허용'을 처리한다.
# E2E는 NODE_ENV=test 및 명시적 테스트 도구 활성화 조건에서 실행한다. 운영에서는 테스트 UI·입력 경로를 제공하지 않는다.
# 테스트에서는 '카메라 켜기' 뒤 정면 기준 범위의 결정적 입력을 공급한다. 테스트 도구는 테스트에서 펼치면 클릭 가능하게 표시한다.
# S3만 리포트 스케줄러에 테스트용 시계·주기를 주입해 첫 자동 주기를 유효 3초로 대체한다. 등록/경고/복귀/재경고와 다른 흐름의 1800초 주기는 유지한다.
# S5·S6은 '[테스트용] 측면 데이터 주입'으로 QR 스캔·휴대폰 요청을 대체하며 승인·등록·판정·집계·저장은 공통 경로를 사용한다.
# 등록 클릭 뒤 연속 안정 유효 입력 5초는 해당 동작의 처리 완료 조건이다.
# 인지 보고·건강 효과는 expected에서 추론하지 않는다. 성공 지표는 확정 이탈 시간 D / 전체 세션 유효 시간 V * 100(%)이다.
# 모든 비율은 V=0이면 계산 불가이며 모드·기준·설정이 다르면 개선 비교를 하지 않는다.
# 자세 유지 외의 UI 조작 중에는 기준 범위 입력을 유지한다. 시간은 앱의 유효 입력 시각으로 검증하고 UI 조작 시간을 고정하지 않는다.
# expected의 중간 임계점도 같은 유지 동작 안에서 관찰한다. 테스트 버튼은 입력만 주입하며 리포트·집계·최종 상태를 직접 생성하지 않는다.
# 아래 테스트 도구·시간 가속은 구현할 계약이다. 문서 검사 통과를 앱/E2E 통과나 주최측의 mock 허용 확인으로 간주하지 않는다.
platform: desktop
platformReason: 대상 대학생은 노트북으로 과제·공부하는 동안 같은 PC 브라우저에서 경고를 확인하고 기록·리포트를 조회한다. 휴대폰은 선택형 딥 모드의 측면 입력 보조 기기이다. 단일 PC E2E는 테스트 전용 정면 입력·측면 데이터 주입으로 재현하며 실제 QR·다중 기기 검증은 별도로 수행한다.
scenarios:
  - id: S1
    title: 대학생이 기준 자세를 등록하고 같은 브라우저에서 저장 상태를 확인한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 브라우저를 새로고침한다
    expected: 연속 안정 5초 뒤 등록된 기준 ID 1개와 등록 시각이 같은 브라우저에 유지된다. 새로고침 후 상태는 '준비', 카메라는 꺼짐, 세션·리포트는 각각 0개이다. 로그인은 요구하지 않는다. 유효 감지 기록이 없으므로 이탈 비율은 0%가 아닌 계산 불가이며 '분석 가능한 기록이 없습니다'를 표시한다. 현재 배치 확인 필요 여부는 저장 성공과 구분한다.
  - id: S2
    title: 대학생이 10초 기준 이탈 경고를 받고 3초 복귀 후 종료 리포트를 확인한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 이탈 자세를 연속 유효 10초 동안 유지한다
      - 기준 범위의 자세를 연속 유효 3초 동안 유지한다
      - 감지 화면에서 '세션 종료'를 누른다
      - 종료 화면에서 '리포트 보기'를 누른다
    expected: 종료 리포트 1개·자동 리포트 0개, 확정 이탈 1회·최초 경고 1회·재경고 0회·정상 복귀 1회이다. 이탈 9초에는 경고 0회, 10초에 최초 경고, 복귀 2초에는 유지·3초에 해제된다. 이탈 시간 D는 시작부터 복귀 확인까지 13초이고 비율은 13 / 실제 유효 시간 V * 100(%)이다. 등록 5초는 V에서 제외하며 조작 중 유효 시간은 포함한다. 세션 종료·카메라 꺼짐·저장 완료가 표시된다.
  - id: S3
    title: 대학생이 테스트에서 3초로 가속된 자동 리포트를 보고 같은 세션의 작업을 계속한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '테스트 도구'를 누른다
      - 테스트 도구에서 '[테스트용] 리포트 3초 가속'을 누른다
      - 감지 준비 화면에서 '탐지 시작'을 누르고 기준 범위 입력으로 유효 3초 처리 완료를 기다린다
      - 감지 화면에서 '리포트 보기'를 누른다
      - 리포트 화면에서 '닫기'를 누른다
    expected: 테스트 환경에서 가속된 3초 후 리포트가 정상 팝업됨을 확인한다. 유효 3초 직전 자동 리포트 0개, 3초에 '리포트가 준비됐어요'와 자동 리포트 1개를 표시한다. 첫 구간은 실제 V=3초·D=0초·비율 0%이고 이탈·최초 경고·재경고·정상 복귀는 각각 0회, 종료 리포트는 0개이다. 테스트 표시를 남기고 첫 생성 후 가속을 해제한다. 닫으면 같은 세션이 계속되며 다음 주기는 1800초이다. 운영 자동 주기는 30분이며 등록·경고·복귀 시간은 바꾸지 않는다.
  - id: S4
    title: 대학생이 자리 비움으로 시간 연속성이 끊긴 뒤 새 이탈 경고를 확인한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 이탈 자세를 연속 유효 6초 동안 유지한다
      - 촬영 범위를 벗어나 자리 비움 상태를 5초 동안 유지한다
      - 같은 배치로 돌아와 기준 이탈 자세를 새로 연속 유효 10초 동안 유지한다
      - 기준 범위의 자세를 연속 유효 3초 동안 유지한다
      - 감지 화면에서 '일시 정지'를 누른다
      - 정지 상태에서 '재개'를 누른다
      - 기준·배치 확인 후 감지 화면에서 '세션 종료'를 누른다
      - 종료 화면에서 '리포트 보기'를 누른다
    expected: 자리 비움 중 판정 보류·유효 시간 중단이며 타이머는 초기화된다. 이탈 6초와 복귀 후 4초를 합산하지 않아 경고 0회, 복귀 후 새 연속 10초에 최초 경고 1회이다. 종료 리포트 1개에 확정 이탈 1회·최초 경고 1회·재경고 0회·정상 복귀 1회, 보류 사유가 표시된다. 첫 후보 6초는 D에서 제외하고 V에는 포함한다. D=13초, 비율은 13/V*100(%)이며 자리 비움 5초·정지·준비는 V에서 제외한다. 정지 중 촬영 꺼짐, 같은 세션 ID를 유지한다.
  - id: S5
    title: 대학생이 단일 PC에서 측면 데이터를 주입해 딥 모드 경고·복귀·종료를 검증한다
    steps:
      - PC 첫 화면에서 '딥 모드 사용하기'를 누른다
      - PC 연결 화면에서 '테스트 도구'를 누른다
      - 테스트 도구에서 '[테스트용] 측면 데이터 주입'을 눌러 휴대폰 연결 요청과 유효 측면 입력을 시뮬레이션한다
      - PC 연결 화면에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 누른다
      - PC에서 '기준 자세 등록'을 누른다
      - 양쪽 기준 등록 완료 후 PC에서 '딥 모드 탐지 시작'을 누른다
      - 테스트 도구에서 '[테스트용] 양쪽 이탈·복귀 재생'을 누르고 이탈 10초의 최초 경고와 이어지는 복귀 3초의 경고 해제를 기다린다
      - PC 감지 화면에서 '세션 종료'를 누른다
      - PC 종료 화면에서 '리포트 보기'를 누른다
    expected: 실제 QR 스캔 없이 테스트 휴대폰 1대의 요청→PC 승인→연결됨을 확인한다. 연속 안정 5초로 정면·측면 기준이 등록되고 딥 종료 리포트 1개가 PC에 저장된다. 확정 이탈·최초 경고·정상 복귀 각 1회, 재경고·자동 리포트 각 0개이다. 중복 집계 없이 D=13초, 비율은 13/실제 딥 유효 시간 V*100(%)이다. PC 카메라 꺼짐·측면 모의 종료 응답·PC 저장 완료와 테스트 기록 표시를 확인한다. 실제 휴대폰 종료 검증과 구분한다.
  - id: S6
    title: 대학생이 딥 모드 장애 시 판정 보류 후 기본 모드로 안전 전환한다
    steps:
      - PC 첫 화면에서 '딥 모드 사용하기'를 누른다
      - PC 연결 화면에서 '테스트 도구'를 누른다
      - 테스트 도구에서 '[테스트용] 측면 데이터 주입'을 눌러 휴대폰 연결 요청과 유효 측면 입력을 시뮬레이션한다
      - PC 연결 화면에서 '연결 승인'을 누른다
      - PC에서 '카메라 켜기'를 누른다
      - PC에서 '기준 자세 등록'을 누른다
      - 양쪽 기준 등록 완료 후 PC에서 '딥 모드 탐지 시작'을 누른다
      - 딥 유효 입력 1초 이상을 확인한 뒤 '[테스트용] 측면 연결 끊기'를 눌러 측면 입력 중단·연결 끊김·종료 무응답을 주입한다
      - 복구 대기 표시 후 PC에서 '기본 모드로 계속'을 누른다
      - 기본 모드 유효 정면 입력 1초 이상을 확인한 뒤 PC에서 '세션 종료'를 누른다
      - PC 종료 화면에서 '리포트 보기'를 누른다
    expected: 실제 QR·휴대폰 없이 측면 주입→PC 승인→딥 연결 후 연결 끊기 버튼으로 즉시 판정·유효 시간 보류와 타이머 초기화를 확인한다. 연결 끊김 확인 후 복구 대기이며 자동 전환하지 않는다. '기본 모드로 계속'을 눌러 유효 정면 기준·입력 확인 뒤 같은 세션의 기본 모드로 전환한다. 종료 리포트에 테스트 표시·딥/기본 구간·장애/모드 변경 사유를 남긴다. 이탈·최초 경고·재경고·정상 복귀 각 0회, D=0초, 각 모드 V>=1초·비율 0%이다. PC 카메라 꺼짐·저장 완료, 측면 종료 요청·확인 안 됨을 표시한다. 자동 리포트는 0개이다.
  - id: S7
    title: 대학생이 직접 만든 로컬 세션을 조회하고 삭제한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 기준 범위의 자세를 연속 유효 5초 동안 유지한다
      - 감지 화면에서 '세션 종료'를 누른다
      - 저장 완료 후 종료 화면에서 '내 기록'을 누른다
      - 기록 목록에서 방금 종료한 세션을 선택한다
      - 세션 상세에서 '기록 삭제'를 누른다
      - 삭제 확인 화면에서 '삭제 확인'을 누른다
    expected: 이 흐름에서 만든 종료 세션·종료 리포트가 각각 1개 조회된다. V는 실제 유효 시간으로 최소 5초이며 D=0초·이탈 비율 0%, 이탈·경고·복귀는 각각 0회이다. 삭제 후 세션·리포트·원장·파생 집계가 제거되고 '저장된 기록이 없어요'를 표시한다. 현재 등록 기준은 유지된다. 다른 시나리오의 기록이나 로그인은 요구하지 않는다.
  - id: S8
    title: 대학생이 잘못된 경고 시간을 거부받고 기준을 재등록해 탐지를 재개한다
    steps:
      - 첫 화면에서 '자세 등록하고 시작'을 누른다
      - 카메라 설정 화면에서 '카메라 켜기'를 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 기준 등록 완료 후 '탐지 시작'을 누른다
      - 감지 화면에서 '설정'을 누른다
      - 경고 시간 입력란에 0을 입력한다
      - 설정 화면에서 '적용'을 누른다
      - 경고 시간 입력란에 10을 입력한다
      - 설정 화면에서 '적용'을 누른다
      - 감지 화면에서 '기준 다시 등록'을 누른다
      - 안정된 자세에서 '기준 자세 등록'을 누른다
      - 새 기준 등록 완료 후 '탐지 재개'를 누른다
    expected: 0초는 '양의 정수를 입력해 주세요'로 거부하며 기존 경고 10초·재경고 60초·설정 버전·측정 구간을 유지한다. 10초 적용 뒤 오류가 해제되고 유효 설정 버전이 남는다. 재등록 중 판정·유효 시간은 보류, 연속 안정 5초 뒤 새 기준 ID를 저장하되 자동 재개하지 않는다. 탐지 재개 후 같은 세션의 새 기준 구간에서 진행한다. 이전 기록을 새 기준으로 덮어쓰거나 서로 다른 기준·설정의 이탈 비율을 개선 효과로 비교하지 않는다. 이탈·경고·복귀는 각각 0회이다.
