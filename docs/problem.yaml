# FIRST-PENGUIN 팀 문제정의 (docs/problem.yaml)
# 서비스: 카드 지갑 코치 — 이미 가진 카드들을 "언제 어떤 카드로 낼지" 알려 주는 웹 서비스
# 한 줄 차별점: 뱅크샐러드 같은 금융 앱은 "어떤 카드를 새로 만들지"를 추천한다. 우리는 "이미 가진 카드를 어떻게 나눠 쓸지"를 알려 준다.
# 상태(2026-10-29 저녁): statement·canvas는 팀 캔버스 답. 해법·기능은 멘토 피드백(차별점·"하나 더")을 반영해 다시 씀.
#   - null 칸과 "?"가 붙은 원인은 팀 측정·확인 대기. 지어내서 채우지 않아요.
# 대시보드가 main 브랜치에 push된 이 파일을 직접 읽어요.

statement: |-
  여러 장의 신용카드·체크카드를 쓰는 사람은 편의점·카페·영화관·쇼핑처럼 카드로 결제하는 순간마다
  카드사·카드 종류별 혜택 구조와 전월 실적 조건, 가맹점 분류가 복잡하게 파편화되어 있어 최적의 카드를 즉시 판단하기 어렵기 때문에
  챙길 수 있었던 혜택을 놓치고, 혜택을 비교하는 피로감과 맞는 카드를 골랐는지에 대한 불확실성을 겪는다.
  지금은 자주 쓰는 금융사 앱을 하나씩 열어 확인하거나 늘 쓰던 카드 한 장으로 버티지만
  실시간 전월 실적 충족 여부까지 종합적으로 고려해 최적의 카드를 자동으로 안내해 주지는 못한다는 단점이 남는다.

canvas:
  context: |- # 왼쪽 위: 문제가 발생하는 상황
    편의점, 카페, 영화관, 쇼핑에서 카드를 쓰는 매 순간.
    결제하는 순간(점원: "카드 앞에 꽂아 주세요~") 어떤 카드를 낼지 몇 초 안에 정해야 한다.
    그리고 매달 초, 지난달 실적을 채운 카드만 이번 달 혜택이 살아 있다.
  customer: |- # 왼쪽 아래
    여러 장의 신용카드 및 체크카드를 사용하는 사람.
    그중 가장 아픈 사람: 한 달 지출이 많지 않아 전월 실적(보통 30만 원 안팎) 채우기가 빠듯한 20대 대학생·사회초년생.
    지출이 적은데 카드를 여러 장 나눠 쓰면 어느 카드도 실적을 못 채워 혜택이 0원이 되기 쉽다.
  root_problem: |- # 가운데 위
    카드사별·카드 종류별 혜택 구조와 전월 실적 조건, 가맹점 분류가 너무 다양하고 복잡하게 파편화되어 있어
    결제 순간에 최적의 카드를 즉시 판단하기 어렵다.
    기존 금융 앱은 "새로 만들 카드"를 추천하는 데 초점이 있고, 이미 가진 카드들 사이에서 결제와 실적을 나눠 주는 곳은 없다?
  impact:
    feeling: |- # 가운데 아래: 감정적 영향
      챙길 수 있었던 혜택을 받지 못하는 찝찝함.
      복잡한 카드 혜택을 비교하면서 느끼는 피로감.
      자신에게 적합한 카드를 선택했는지에 대한 불확실성.
    measurable: null # 팀 측정 대기: 팀원 지난달 결제 10건씩, "실제 낸 카드 혜택" vs "가진 카드 중 최적 카드 혜택" 차이(원)
  alternatives:
    - how_used: 자주 쓰는 금융사 앱을 열어 카드 혜택과 실적을 하나씩 확인한다
      shortcoming: 번거롭고, 결제 몇 초 안에 여러 앱을 열 수 없으며, 실시간 전월 실적 충족 여부까지 종합해 최적 카드를 자동으로 안내해 주지 못한다
      why_ours: 가진 카드를 한 번 등록해 두면 결제할 가게와 금액만 넣어 3초 안에 "이 카드로 내면 ○○원 할인"을 보여 준다
    - how_used: 고민하지 않고 늘 쓰던 카드 한 장으로 다 결제한다 # 팀 확인: 팀원 중 실제로 이렇게 하는 사람 수
      shortcoming: 다른 카드의 혜택을 통째로 놓치고, 실적이 한 카드에 몰려 나머지 카드는 실적 미달로 혜택이 0원이 된다
      why_ours: 한 달 지출을 분야별로 넣으면 "어느 분야는 어느 카드로" 나눠 쓰는 플랜과 지금 방식 대비 더 받는 금액을 보여 준다
    - how_used: 뱅크샐러드 같은 자산관리 앱에서 내 소비를 보고 카드를 추천받는다 # 팀이 앱에서 직접 확인 후 단점 확정
      shortcoming: 새로 만들 카드를 추천하는 데 초점이 있고, 이미 가진 카드들 사이에서 결제 순간 어떤 카드를 낼지·실적을 어떻게 나눌지는 알려 주지 않는다?
      why_ours: 카드를 새로 만들게 하지 않고 지금 지갑 안의 카드로 혜택을 최대로 만든다. 금융 계정 연동 없이 카드 이름만 고르면 바로 쓸 수 있다

personas: []
# 팀원 실제 정보로 채워요(이름 대신 역할). 예시 형식:
# - id: P1
#   description: 카드 몇 장, 어떤 카드들, 한 달 지출, 주로 결제하는 곳
#   source: 팀원 본인

experiences: []
# 팀원이 직접 겪은 일을 언제·어떤 장면·어떻게 대응했는지까지 적어요. (팀 답 대기)
# 팀원에게 물어볼 질문:
#   1. 카드 몇 장 갖고 다녀? 마지막으로 계산대에서 어떤 카드 낼지 망설인 게 언제·어디였어?
#   2. 그때 어떻게 정했어? (늘 쓰던 카드 / 앱 열어 봄 / 감으로) 뭐라고 말했어?
#   3. 나중에 "다른 카드로 낼걸" 싶었던 적 있어? 얼마쯤 놓쳤어? 전월 실적 못 채워서 혜택 날린 적은?
# - id: E1
#   when: null
#   what_happened: null
#   workaround: null
#   feeling: null
#   quote: null
#   source: null

sources: []
# 외부 자료는 로그인 없이 열리는 URL을 https://부터 그대로 적고, 원문이 직접 말하는 내용만 claim에 써요.
# 후보: 여신금융협회 카드 비교공시, 카드 부가서비스·전월실적 관련 기사 — 실제로 열어 보고 넣기

five_whys:
  symptom: 결제하는 순간 갖고 있는 카드 중 어떤 카드를 내야 가장 이득인지 모른다
  whys:
    - 카드마다 혜택 분야·할인율·월 한도가 달라서 같은 결제라도 카드별 혜택이 다르다
    - 같은 가게라도 카드사마다 가맹점 분류(편의점·카페·쇼핑 등)가 달라 이 결제가 어느 혜택에 해당하는지 헷갈린다?
    - 혜택은 지난달 실적을 채워야 받을 수 있는데, 카드별로 실적이 얼마나 찼는지 결제 순간에는 모른다?
    - 이 정보가 카드사 앱마다 따로 있어서 결제 몇 초 안에 종합할 수 없고, 기존 앱은 새 카드 추천에 머문다?

solution_paths:
  - path: 내 지갑(가진 카드 최대 5장과 카드별 실적)을 등록하고, 결제할 분야·금액을 넣으면 실적·월 한도를 반영해 지금 낼 카드를 순위로 알려 주는 결제 코치
    status: chosen
    reason: 문제가 "결제 순간 즉시 판단"이라 그 순간에 답을 주는 것이 가장 직접적이다. 기존 앱이 다루지 않는 "가진 카드 사이의 선택"이다
  - path: 한 달 예상 지출을 넣으면 지갑 안 카드들의 실적·한도를 동시에 맞추는 분야별 카드 배분 플랜과 "지금처럼 쓸 때 대비 더 받는 금액"
    status: chosen
    reason: 멘토 피드백 "추천에서 끝나지 않고 하나 더". 결제 한 번이 아니라 한 달 단위로 실적을 나눠야 혜택이 살아나는 구조를 보여 주는 우리만의 기능이다
  - path: 결제를 기록하면 카드별 이번 달 실적·남은 혜택 한도가 쌓여 다음 추천에 반영
    status: chosen
    reason: 금융 계정 연동 없이 "실시간 실적"을 대신하는 방법이다
  - path: 가게 이름을 쓰면 AI가 가맹점 분야로 분류
    status: chosen
    reason: WHY 2 — 가게가 어느 분야인지 헷갈리는 것을 줄인다. 실패하면 사용자가 분야를 직접 고른다
  - path: 마이데이터·카드 사용내역 자동 연동
    status: deferred
    reason: 금융 인증·사업자 자격이 필요해 대회 기간에 만들 수 없다. 결제 기록 버튼으로 대신한다
  - path: 새로 만들 카드 추천(카드 비교)
    status: rejected
    reason: 기존 금융 앱·비교 사이트가 이미 하는 일이라 차별점이 없다
  - path: 카드사 사이트 실시간 크롤링
    status: rejected
    reason: 사이트 구조가 바뀌면 바로 깨지고 느리다. 대회 기간에 공개 상품 페이지에서 모아 출처·확인일과 함께 시드한다

insight:
  claim: null # 팀 측정 후 작성. 확인할 가설: "지출이 적은 사람일수록 카드를 나눠 쓰면 어느 카드도 실적을 못 채워, 가진 혜택을 거의 못 받는다"
  evidence: null # experiences id(E1…)와 측정 결과를 함께 적기
  design_decision: |-
    만든다: 이미 가진 카드 기준의 결제 순간 추천, 한 달 배분 플랜, 결제 기록으로 쌓는 실적.
    추천·플랜은 AI가 아니라 규칙으로 계산해 같은 입력이면 항상 같은 결과와 계산 근거(할인액·실적 상태)를 보여 준다. AI는 가게 이름 → 분야 분류에만 쓴다.
    안 만든다: 로그인, 금융 계정 연동, 새 카드 추천, 실시간 크롤링. 내 지갑 정보는 서버에 보내지 않고 이 브라우저에만 저장한다.

# ──────────────────────────────────────────────
# 기능 명세. 여기 없는 기능은 구현하지 않아요(임의 구현 감점). 새 기능은 먼저 여기에 추가.
#
# 공통 규칙
# - 로그인 없음. 카드 데이터만 서버 DB에 있고, 내 지갑·결제 기록은 브라우저 localStorage("wallet-v1")에 저장(서버로 보내지 않음).
# - 화면: / (첫 화면), /wallet (내 지갑), /pay (지금 결제), /plan (한 달 플랜), /cards/[id] (카드 상세). /wallet·/pay·/plan은 아래 탭 "지갑·결제·플랜"으로 오간다.
# - 결제 분야(고정 9개): 편의점, 카페, 음식점·배달, 대중교통, 온라인쇼핑, 영화·문화, 구독(OTT·음원), 통신비, 기타
# - 금액은 모두 원 단위 정수, 화면에는 "6,000원"처럼 천 단위 쉼표.
# - 카드 혜택 단순화: 혜택은 [분야, 할인율(%), 그 혜택의 월 할인 한도(원)] 목록 + 카드 전체 월 할인 한도(원, 없으면 제한 없음).
#   전월실적 구간이 여러 개인 카드는 가장 낮은 구간 하나만 쓴다. "혜택 받은 금액은 실적 제외" 같은 세부 조건은 반영하지 않고 카드 상세에 "단순화 계산" 안내를 둔다.
# - 용어: "지난달 실적 충족" = 지난달 사용액 ≥ 전월실적 조건 → 이번 달 혜택이 살아 있음. "이번 달 실적" = 이번 달 사용액(다음 달 혜택 조건).
# ──────────────────────────────────────────────
features:
  - id: F1
    name: 카드 데이터 시드
    input: data/cards.json (카드사 공개 상품 페이지에서 대회 기간에 모은 카드 정보)
    output: |-
      앱이 처음 뜰 때 DB에 카드가 저장된다. 카드마다 id·이름·카드사·종류(신용/체크)·연회비(원)·전월실적 조건(원)·
      혜택 목록(분야, 할인율, 월 한도)·카드 전체 월 한도·출처 URL·정보 확인일을 가진다.
      예시 지갑(F2)에 쓰는 카드 3장은 data/example-wallet.json에 카드 id와 사용액으로 정해 둔다.
    done: |-
      빈 DB에서 docker compose up 후 카드 검색에 시드 카드가 모두 나온다(최소 20장, 카드사 5곳 이상, 체크카드 5장 이상).
      출처 URL이나 확인일이 없는 카드는 시드에 넣지 않는다. 같은 시드를 두 번 넣어도 카드가 중복되지 않는다.

  - id: F2
    name: 내 지갑
    input: 카드 이름 검색어, 카드별 "지난달 사용액"·"이번 달 사용액"(원), "주로 쓰는 카드" 표시
    output: |-
      /wallet에서 "카드 추가"를 누르고 이름 일부(예 "체크")를 치면 맞는 시드 카드가 목록으로 나온다.
      카드를 고르면 지난달 사용액·이번 달 사용액·"주로 쓰는 카드" 칸이 나오고, "지갑에 담기"를 누르면 지갑에 들어간다.
      지갑의 카드마다 이름·카드사, 지난달 실적 충족 여부("이번 달 혜택 ON/OFF"), 이번 달 실적 게이지("다음 달 혜택까지 ○○원 남음" 또는 "다음 달 혜택 확보")가 보인다.
      첫 화면의 "예시 지갑으로 체험하기"를 누르면 example-wallet.json의 카드 3장과 사용액이 지갑에 들어가고 /pay로 간다.
      첫 화면의 "내 지갑 만들기"는 빈 지갑으로 /wallet에 간다.
      예시 지갑: 카드 A(주로 쓰는 카드, 카페·편의점 혜택 없음, 지난달·이번 달 실적 모두 충족), 카드 B(카페 혜택 있음, 지난달 충족, 이번 달 미충족),
      카드 C(편의점 혜택 있음, 지난달 미충족, 이번 달 사용액 = 전월실적 조건 − 5,000원).
      새로고침해도 지갑이 그대로 남는다. "삭제"로 카드를 뺄 수 있다.
    done: |-
      지갑에는 최대 5장. 6번째를 추가하면 "카드는 5장까지 담을 수 있어요"를 보여 주고 추가하지 않는다. 같은 카드는 두 번 담기지 않는다.
      검색 결과가 없으면 "찾는 카드가 없어요"를 보여 준다. 사용액 칸은 비우면 0원, 음수는 입력되지 않는다.
      지갑이 비어 있으면 /pay와 /plan에서 "먼저 내 지갑에 카드를 담아 주세요"와 "내 지갑으로" 버튼만 보인다.

  - id: F3
    name: 지금 결제 — 결제 순간 카드 추천
    input: 결제 분야(9개 중 하나) 또는 F4로 찾은 분야, 결제 금액(원)
    output: |-
      "어떤 카드로 낼까?"를 누르면 지갑의 모든 카드를 순위로 보여 준다. 카드마다 다음을 계산한다.
      1) 이번 할인액: 지난달 실적 미충족이면 0원("이번 달 혜택 OFF").
         충족이면 min(금액 × 그 분야 할인율, 그 혜택의 남은 월 한도, 카드 전체의 남은 월 한도). 남은 한도 = 한도 − 이번 달 이미 받은 할인(F5 기록 합).
      2) 실적 효과: 이번 달 사용액 < 전월실적 조건 ≤ 이번 달 사용액 + 금액 이면 "이 결제로 다음 달 혜택 확보" 표시.
      순위: ① 이번 할인액 큰 순 ② 같으면 "다음 달 혜택 확보" 카드 먼저 ③ 같으면 이번 달 실적이 아직 미달인 카드 중 남은 금액이 적은 카드 먼저 ④ 그래도 같으면 지갑에 담은 순서.
      1위 카드는 크게 "○○카드로 내세요 · 1,200원 할인"으로, 이유를 한 줄로 보여 준다(예 "카페 20% 할인, 이번 달 남은 한도 3,800원").
      모든 카드의 할인이 0원이면 1위 카드에 "할인되는 카드가 없어요. 실적이 가장 급한 카드를 골랐어요"를 보여 준다.
    done: |-
      같은 지갑·입력이면 항상 같은 순위. 금액이 비었거나 0이면 "결제 금액을 입력해 주세요"를 보여 주고 결과를 내지 않는다.
      분야를 고르지 않으면 "어디서 결제하나요?"를 보여 준다.
      예시 지갑으로 "카페" 6000원을 넣으면 1위는 카드 B이고 할인액이 0원보다 크다.
      예시 지갑으로 "편의점" 10000원을 넣으면 카드 C에 "이 결제로 다음 달 혜택 확보"가 보인다.

  - id: F4
    name: 가게 이름으로 분야 찾기 (AI)
    input: 가게 이름 문장 (예 "메가커피 강남역점", "CGV 용산", "GS25")
    output: |-
      /pay의 "가게 이름으로 찾기" 칸에 쓰고 "분야 찾기"를 누르면 서버가 AI Gateway로 9개 분야 중 하나를 받아 분야 선택을 그 분야로 바꾼다.
      AI 응답이 9개 분야 이름이 아니면 실패로 본다. API 키는 서버에서만 쓴다.
    done: |-
      응답을 기다리는 동안 "찾는 중…"이 보이고, 끝나면 분야 선택이 바뀌어 있다(예 "메가커피 강남역점" → 카페).
      칸이 비어 있으면 호출하지 않고 "가게 이름을 적어 주세요"를 보여 준다.
      실패하거나 15초 안에 응답이 없으면 "분야를 찾지 못했어요. 직접 골라 주세요"를 보여 주고 기존 선택은 그대로 둔다.

  - id: F5
    name: 결제 기록과 실적 게이지
    input: F3 결과의 카드별 "이 카드로 결제했어요" 버튼
    output: |-
      누르면 그 카드의 이번 달 사용액에 결제 금액이 더해지고, 받은 할인액이 그 분야 혜택의 이번 달 사용 한도에 더해진다(localStorage에 저장).
      "기록했어요" 안내와 함께 그 카드의 실적 게이지가 바로 갱신된다. /wallet의 "이번 달 기록"에 날짜·분야·금액·카드·할인액이 최신순으로 쌓인다.
      기록마다 "취소"를 누르면 더했던 사용액과 할인액이 되돌아간다.
    done: |-
      같은 결과 화면에서 버튼을 두 번 눌러도 한 번만 기록된다(누른 뒤 버튼이 "기록됨"으로 바뀌고 눌리지 않음).
      월 할인 한도를 다 쓴 혜택은 다음 추천에서 할인액 0원으로 계산되고 이유에 "이번 달 한도 소진"이 보인다.

  - id: F6
    name: 한 달 카드 플랜 (우리만의 기능)
    input: 9개 분야별 한 달 예상 지출(원). "예시 지출 넣기" 버튼으로 미리 정한 값을 채울 수 있다
    output: |-
      "플랜 만들기"를 누르면 각 분야를 지갑 카드 중 한 장에 배정하는 모든 조합(최대 5장^9분야)을 계산해 월 혜택이 가장 큰 배정을 고른다.
      한 조합의 월 혜택 = 카드마다 [배정된 지출 합 ≥ 전월실적 조건이면] Σ min(분야 지출 × 할인율, 혜택 월 한도)를 카드 전체 월 한도로 자른 값, 아니면 0원.
      (매달 같은 패턴으로 쓴다고 보고, 배정된 지출로 그 카드의 실적을 채운다고 계산한다.)
      비교 기준 "지금처럼 쓸 때" = 모든 지출을 "주로 쓰는 카드" 한 장으로 낼 때의 월 혜택(주로 쓰는 카드가 없으면 지갑 첫 카드).
      결과: "플랜대로 쓰면 월 ○○원 · 지금보다 월 ○○원(연 ○○원) 더", 분야별 "카페 → B카드" 표, 카드별 "배정 지출 / 전월실적 조건" 게이지.
      실적을 못 채우는 카드는 "이 카드는 이번 플랜에서 쉬어요"로 표시한다.
    done: |-
      같은 지갑·지출이면 항상 같은 플랜(혜택이 같은 조합이 여럿이면 지갑 순서가 앞선 카드에 먼저 배정).
      플랜의 월 혜택은 항상 "지금처럼 쓸 때" 이상이다. 지출이 모두 0이면 "한 달 지출을 하나 이상 입력해 주세요"를 보여 준다.
      5장·9분야 모두 채워도 3초 안에 결과가 나온다.

  - id: F7
    name: 카드 상세
    input: 지갑·결제 결과·플랜에서 카드 이름 선택
    output: 카드의 혜택 목록(분야·할인율·월 한도), 카드 전체 월 한도, 전월실적 조건, 연회비, "출처" 링크, "YYYY-MM-DD 기준", 단순화 계산 안내를 보여 준다
    done: 출처 링크는 새 탭으로 열린다. 없는 카드 주소는 404 화면을 보여 준다
