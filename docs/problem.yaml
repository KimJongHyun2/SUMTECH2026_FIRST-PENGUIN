#   source: null

experiences: []
# 팀원이 직접 겪은 일을 언제·어떤 장면·어떻게 대응했는지까지 적어요. (학생 답 대기)
# 팀원에게 물어볼 질문:
#   1. 마지막으로 카드를 만든 게 언제고, 어떻게 골랐어?
#   2. 고르다가 포기하거나 헷갈렸던 순간이 있었어? 그때 뭐라고 말했어?
#   3. 나중에 "다른 카드였으면 더 받았겠다" 싶었던 적 있어? 얼마쯤?
# - id: E1
#   when: null
#   what_happened: null
#   workaround: null
#   feeling: null
#   quote: null
#   source: null

sources: []
# 외부 자료는 로그인 없이 열리는 URL을 https://부터 그대로 적고, 원문이 직접 말하는 내용만 claim에 써요.
# 후보: 카드 비교공시(여신금융협회), 카드 부가서비스 변경·축소 관련 기사 등 — 실제로 열어 보고 넣기

five_whys:
  symptom: 카드를 새로 만들 때 어떤 카드가 나한테 맞는지 고르기 어렵다
  whys:
    # 초안: 팀이 실제 경험에 맞는지 확인하고 확인 못 한 원인은 끝에 "?"를 붙여요
    - 카드마다 혜택 분야·할인율·대상(학생·군인 등)이 달라서 한 기준으로 비교가 안 된다
    - 혜택이 "OO 10% 할인, 전월실적 30만 원 이상, 월 최대 1만 원"처럼 조건으로만 적혀 있어서 내 지출을 직접 대입해야 한다
    - 내 한 달 지출이 분야별로 얼마인지 정리해 둔 적이 없어서 대입할 숫자부터 없다?
    - 카드사 정보가 카드사별 페이지에 흩어져 있고 형식도 달라서 여러 카드를 같은 표로 모으기 어렵다
    - 그래서 계산을 포기하고 지인 추천이나 순위 글에 기대 고른다

solution_paths:
  - path: 내 신분·지출을 입력하면 규칙에 따라 카드별 예상 혜택 금액을 계산해 순위를 보여 주는 웹 서비스
    status: chosen
    reason: 비교의 핵심 어려움이 "조건을 내 지출에 대입하는 계산"이라 계산을 대신해 주는 것이 가장 직접적인 해결이다
  - path: 지출을 분야별 금액으로 정리하기 어려운 사람을 위해 평소 소비를 문장으로 쓰면 AI가 분야별 금액으로 바꿔 주는 기능
    status: chosen
    reason: 내 지출 숫자가 없으면 계산 자체를 시작할 수 없어서 입력 부담을 줄여야 한다
  - path: 카드 정보를 서비스가 실행될 때마다 카드사 사이트에서 실시간으로 크롤링
    status: rejected
    reason: 사이트 구조가 바뀌면 바로 깨지고 응답이 느려진다. 대회 기간에 카드 정보를 모아 출처·확인일과 함께 시드 데이터로 넣는다
  - path: 카드 신청 페이지 연결·제휴 수수료 모델
    status: deferred
    reason: 대회 범위를 넘고 추천의 공정성 설명이 필요해 이후에 검토한다
  - path: 마이데이터·카드 사용내역 자동 연동으로 지출 자동 수집
    status: deferred
    reason: 금융 인증·사업자 자격이 필요해 대회 기간에 만들 수 없다

insight:
  claim: null # 관찰에서 도출한 주장 — 팀원 경험이 들어온 뒤 작성
  evidence: null # experiences id·sources id를 함께 적기
  design_decision: |- # 초안
    추천 순위는 AI가 정하지 않고 "예상 월 혜택 × 12 − 연회비" 규칙으로 계산해, 같은 입력이면 항상 같은 결과와 계산 근거를 보여 준다.
    AI는 소비를 문장으로 쓴 것을 분야별 금액으로 바꾸는 데에만 쓴다.

# ──────────────────────────────────────────────
# 기능 명세. 여기 없는 기능은 구현하지 않아요(임의 구현 감점). 새 기능은 먼저 여기에 추가.
# 로그인: 없음(내 정보는 서버에 저장하지 않고 화면 안에서만 사용)
# 지출 분야(고정 7개): 식비·카페, 대중교통, 편의점, 온라인쇼핑, 통신비, 구독서비스(OTT·음원), 기타
# 신분(고정 4개): 대학생, 군인, 직장인, 기타
# ──────────────────────────────────────────────
features:
  - id: F1
    name: 카드 데이터 시드
    input: data/cards.json (카드사 공개 상품 페이지에서 대회 기간에 모은 카드 정보)
    output: |-
      앱이 처음 뜰 때 DB에 카드가 저장된다. 카드마다 이름·카드사·종류(신용/체크)·연회비(원)·가입 대상(전체/대학생/군인 등)·
      최소 나이·전월실적 조건(원)·혜택 목록(지출 분야, 할인율(%), 월 할인 한도(원))·출처 URL·정보 확인일을 가진다.
    done: |-
      빈 DB에서 docker compose up 후 카드 목록에 시드 카드가 모두 보인다(최소 20장, 대학생 전용·군인 전용 카드 각 1장 이상 포함).
      출처 URL이나 확인일이 없는 카드는 시드에 넣지 않는다.

  - id: F2
    name: 내 정보·지출 입력
    input: 신분, 나이, 원하는 카드 종류(신용/체크/상관없음), 연회비 상한(원), 지출 분야별 한 달 금액(원)
    output: |-
      입력값이 검사를 통과하면 추천 결과 화면으로 넘어간다.
      카드 종류는 기본값 "상관없음", 연회비 상한을 비워 두면 제한 없음으로 본다. 비워 둔 지출 칸은 0원으로 본다.
    done: |-
      모든 지출 금액이 0이거나 비어 있으면 "지출 금액을 하나 이상 입력해 주세요"를 보여 주고 넘어가지 않는다.
      나이가 비었거나 0 이하이면 "나이를 입력해 주세요"를 보여 준다. 음수 금액은 입력되지 않는다.

  - id: F3
    name: 문장으로 지출 입력 (AI)
    input: 평소 소비를 적은 문장 (예 "배달음식에 한 달 20만 원, 지하철 6만 원, 넷플릭스 구독")
    output: AI가 문장을 7개 지출 분야의 금액으로 바꿔 F2의 지출 칸에 채운다. 사용자는 채워진 금액을 고칠 수 있다
    done: |-
      "AI로 채우기"를 누르면 응답을 기다리는 동안 "분석 중" 표시가 보이고, 끝나면 문장에 나온 분야의 칸에 0보다 큰 금액이 채워진다.
      문장이 비어 있으면 호출하지 않고 "소비 내용을 적어 주세요"를 보여 준다.
      AI 호출이 실패하거나 20초 안에 응답이 없으면 "자동 채우기에 실패했어요. 직접 입력해 주세요"를 보여 주고 기존 입력은 그대로 둔다.

  - id: F4
    name: 카드 추천 결과
    input: F2의 입력값
    output: |-
      다음 규칙으로 계산한 상위 3장을 순위대로 보여 준다.
      1) 거르기: 가입 대상이 내 신분과 맞지 않거나, 최소 나이 미만이거나, 카드 종류가 다르거나, 연회비가 상한을 넘는 카드는 뺀다.
      2) 전월실적: 지출 합계가 카드의 전월실적 조건보다 적으면 예상 혜택은 0원이고 "실적 미달"로 표시한다.
      3) 예상 월 혜택 = 혜택마다 min(그 분야 지출 × 할인율, 월 할인 한도)의 합.
      4) 연간 순혜택 = 예상 월 혜택 × 12 − 연회비. 이 값이 큰 순서로 정렬한다. 같으면 연회비가 낮은 카드가 먼저.
      카드마다 이름·카드사·예상 월 혜택·연간 순혜택·연회비와 "식비·카페에서 월 8,000원"처럼 혜택이 생긴 분야별 금액을 보여 준다.
    done: |-
      같은 입력이면 항상 같은 순위가 나온다. 신분을 "직장인"으로 넣으면 대학생 전용·군인 전용 카드가 결과에 없다.
      조건에 맞는 카드가 없으면 "조건에 맞는 카드가 없어요. 연회비 상한이나 카드 종류를 바꿔 보세요"를 보여 준다.
      "다시 입력하기"를 누르면 입력값이 남아 있는 입력 화면으로 돌아간다.

  - id: F5
    name: 카드 상세
    input: 추천 결과나 카드 목록에서 카드 이름 선택
    output: 카드의 전체 혜택 목록(분야·할인율·월 한도), 전월실적 조건, 연회비, 가입 대상, 출처 링크, 정보 확인일을 보여 준다
    done: 출처 링크가 새 탭으로 열리고, 정보 확인일이 "YYYY-MM-DD 기준"으로 보인다. 없는 카드 주소는 404 화면을 보여 준다

  - id: F6
    name: 카드 비교
    input: 추천 결과에서 "비교 담기"로 고른 카드 2~3장
    output: 고른 카드를 나란히 놓고 연회비·전월실적·예상 월 혜택·연간 순혜택·분야별 혜택 금액을 표로 보여 준다
    done: |-
      1장만 담으면 "비교하기"가 눌리지 않는다. 3장을 담은 상태에서 4번째를 담으면 "최대 3장까지 비교할 수 있어요"를 보여 준다.

  - id: F7
    name: 전체 카드 목록
    input: 첫 화면의 "전체 카드 보기", 카드 종류·가입 대상 필터
    output: 시드된 카드를 카드사·이름·연회비·가입 대상과 함께 목록으로 보여 준다
    done: 필터에서 "군인"을 고르면 가입 대상이 군인인 카드만 보인다
