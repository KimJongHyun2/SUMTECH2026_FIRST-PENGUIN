# 패스트거북이 문제정의·기능 계약 — 2026-10-30 통합본
# 사실·자기보고·가설·파일럿 설계값·실행 결과를 구분한다. F11 랭킹은 후속 경로이다.
statement: 자세를 관리하려는 대학생은 노트북 과제·공부에 몰입할 때 자세 변화를 제때 알아차리기 어렵고, 고쳐 앉아도 다시 작업에 집중하면 같은 자세로 돌아오는 어려움을 겪는다(E2의 자기보고). 이러한 사용자에게 지속 변화 알림이 도움이 되는지와 작업을 방해하는지를 함께 검증한다.
canvas:
  context: 노트북으로 과제·공부하는 상황이다. E2의 당사자는 최근 일주일에도 고개가 앞으로 나오는 일이 자주 있었다고 회상했으나 횟수·시간은 모른다. 도서관·스터디 카페·집과 온라인 강의는 검증할 사용 장면이며 해당 장소에서 실제 관찰했다고 쓰지 않는다. E1은 학교 프로젝트 중 친구의 자세를 보고 알려준 별도 관찰 기록이다.
  customer: 초기 고객 조건은 자세를 관리하려는 의지가 있지만 노트북 작업에 몰입하면 확인을 놓치는 대학생이다. 현재 직접 자기보고가 있는 대상은 P1이다. 관리 도구 사용 경험과 추가 서비스 사용 의향은 아직 확인하지 않았으며, 기존 방법으로 충분한 사용자에게 추가 필요성을 가정하지 않는다.
  root_problem: 잠정 근본 문제는 작업 중 자세 확인과 작업 수행에 주의를 함께 써야 한다는 점이다. E2는 자세를 고쳐도 다시 집중하면 돌아오는 경험을 뒷받침한다. 인지 부족·화면 높이·글씨 크기·자세 유지의 불편 중 주원인은 미확인이다. 지속 알림이 충분한 해법이라는 결론은 아직 내리지 않는다.
  impact:
    feeling: E2에서 오래 앉아 있을 때 목·어깨가 뻐근한 경우가 있었다는 자기보고를 확보했다. 답답함·확인 부담은 추가로 확인할 감정 가설이다. E1의 친구가 느낀 감정이나 당시 발화는 전달되지 않았다.
    measurable: E2의 최근 일주일 반복 빈도는 "자주"라는 정성적 회상이며 횟수·지속 시간·작업 중단·효율 영향은 미측정이다. 목·어깨 불편과 특정 자세의 인과는 확인하지 않았다. 관찰 시 작업 종류·기기 배치·자세 변화·인지/조정 시점·작업 중단·알림 방해를 기록하고, 무알림/시간 기반/변화 기반 조건을 비교한다. R1~R4의 집단 연구 결과를 개인의 측정값으로 바꾸지 않는다.
  alternatives:
    - how_used: 생각나거나 주변 사람이 알려줄 때 자세를 고쳐 앉는다(E2에서 확인).
      shortcoming: E2에서는 다시 작업에 집중하면 같은 자세로 돌아왔다. 원인은 미확인이다.
      why_ours: 주변 사람이 없는 동안에도 지속 변화를 확인할 계기를 제공하려 한다. 반복 알림이 실제 조정에 도움이 되는지와 부담을 함께 검증한다.
    - how_used: 정해진 시간에 자세 확인·휴식을 알리는 타이머. 팀원의 실제 사용 여부는 미확인이다.
      shortcoming: 실제 자세 변화와 알림 시점이 맞지 않을 수 있다는 가설이다. 사용 만족도는 아직 모른다.
      why_ours: 유효한 변화가 지속될 때 알리는 방식이 불필요한 경고를 줄이는지 시간 기반 조건과 비교한다. 우월성을 미리 확정하지 않는다.
    - how_used: 받침대·외부 입력장치 등으로 작업 환경을 조정한다. 실제 사용 경험은 미확인이다.
      shortcoming: 환경 조정 후에도 확인의 어려움이 남는지는 미확인이다. 이것만으로 충분하면 추가 서비스 필요성이 낮다.
      why_ours: 환경 개선을 대체하지 않고, 개선 뒤에도 변화를 놓치는 사용자에게 확인 계기를 보완하는 가설이다.
    - how_used: 기준 등록·웹캠 분석·자세 알림을 제공하는 유사 접근(R5). 팀원의 사용 경험은 미확인이다.
      shortcoming: 기존 서비스의 정확도·사용 부담·중단 이유를 직접 비교하지 않았다. 기존 서비스에 결함이 있다고 단정하지 않는다.
      why_ours: 기능 자체의 새로움 대신 학습 중 오경고·방해·반복 사용 가능성, 유형별 기록과 주기 리포트의 유용성을 비교 검증한다. 측면 추가의 정확도 향상도 별도 실험 대상이다.
personas:
  - id: P1
    description: 노트북으로 과제·공부하는 대학생 팀원. 자세를 고쳐도 다시 집중하면 돌아오고 오래 앉으면 목·어깨가 뻐근한 경우가 있다고 설명했다. 관리 도구 사용·추가 서비스 수용성은 미확인이다.
    source: 이 채팅의 2026-10-30 직접 답변(E2). 인구집단 전체의 대표 표본은 아니다.
experiences:
  - id: E1
    when: 학교에서 프로젝트를 하던 중이다. 구체적인 날짜·작업 시간은 미확인이다.
    what_happened: 사용자가 학교 프로젝트 중 친구의 굽은 자세를 보고 친구에게 알려줬다. 목·허리 뻐근함도 처음 설명에 포함됐지만 그 당사자는 아직 확인하지 않았다.
    workaround: 사용자가 친구에게 자세를 알려줬다. 친구가 실제로 조정했는지와 조정 후 변화는 미확인이다.
    feeling: 관찰자인 사용자와 친구의 당시 감정은 확인되지 않았다. 목·허리 뻐근함의 당사자도 미확인이다.
    quote: 당시 직접 발화는 제공되지 않았다. 경험을 설명한 문장을 당시 대화로 재구성하지 않는다.
    source: "2026-10-30 제공 보완팩 §12의 후속 정정: 사용자가 친구를 보고 알려준 관찰. 이전 E1의 관찰 주체·날짜·인용 서술을 대체한다."
  - id: E2
    when: 최근 일주일 (2026-10-30 회상, 정확한 발생 일시·횟수는 기억하지 못함)
    what_happened: |-
      노트북으로 과제하거나 공부에 집중할 때 고개가 앞으로 나오는 경우가 자주 있었다.
      친구가 거북목처럼 자세가 굽어 있다고 지적해 그제야 고쳐 앉은 적이 있다.
      오래 앉아 있으면 목과 어깨가 뻐근한 경우도 있었으나, 실제 작업 효율에 얼마나 영향을 미쳤는지는 모른다.
    workaround: 자세를 고쳐 앉았지만 작업에 다시 집중하면 무의식적으로 같은 자세로 돌아왔다.
    feeling: 목·어깨의 뻐근함을 보고했다. 이 반복 상황에 대한 감정은 별도로 확인하지 않았다.
    quote: 자세를 고쳐도 작업에 다시 집중하면 무의식적으로 같은 자세로 돌아간다는 점입니다.
    source: 이 채팅에서 사용자가 2026-10-30 직접 제공한 최근 일주일의 자기보고. E1과 동일 사건으로 합치거나 독립된 두 사용자 표본으로 세지 않는다.
