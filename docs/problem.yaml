# FIRST-PENGUIN 팀 문제정의 (docs/problem.yaml)
# 주제: 내 정보와 소비를 넣으면 나에게 맞는 카드를 추천하는 서비스
# 상태: 2-A 문제 다지기 진행 중.
#   - "초안" 표시가 붙은 칸은 팀이 말한 아이디어를 바탕으로 정리한 문장이에요. 팀원이 확인하고 자기 말로 고쳐요.
#   - null / [] 칸은 아직 팀 답이 없는 곳이에요. 지어내서 채우지 않아요.
# 대시보드가 main 브랜치에 push된 이 파일을 직접 읽어요.

# 초안: 팀 확인 필요
statement: |-
  카드를 새로 만들거나 바꾸려는 대학생·군인·사회초년생은 카드를 고를 때
  카드마다 혜택·가입 자격·전월실적·월 할인 한도가 제각각이라 내 소비에 대입해 비교하기 어렵기 때문에
  실제로 받을 수 있는 혜택보다 적은 카드를 고르거나 고르는 데 오래 걸린다.
  지금은 지인 추천·블로그 후기·카드 비교 사이트로 버티지만
  내 지출 금액과 실적 조건을 넣어 "나는 한 달에 얼마를 돌려받는지"까지 계산해 주지는 않는다는 단점이 남는다.

canvas:
  context: |- # 왼쪽 위: 문제가 발생하는 상황
    카드사마다 카드 종류가 많고 카드마다 혜택이 다 다르다.
    어떤 카드는 학생, 어떤 카드는 군인처럼 대상이 정해져 있고, 혜택 분야(식비·교통·쇼핑 등)도 카드마다 다르다.
    그래서 카드를 새로 만들 때 어떤 카드가 나한테 맞는지 고르기 어렵다.
    # 초안: 언제(첫 카드 발급, 입대, 취업 등)·얼마나 자주 겪는지 팀원 답으로 보완
  customer: |- # 왼쪽 아래 (초안: 팀 확인 필요)
    카드를 처음 만들거나 바꾸려는 대학생·군인·사회초년생.
    신분에 따라 가입할 수 있는 카드가 다르고, 한 달 지출이 많지 않아 전월실적 조건에 민감하다.
  root_problem: |- # 가운데 위 (초안: 5 Whys 결과로 다시 다듬기)
    카드 혜택 정보가 카드사별 상품 페이지에 "할인율·조건·한도" 형태로만 흩어져 있어서,
    소비자가 자기 지출 금액을 직접 대입해 실제 혜택 금액으로 바꿔 계산해야 한다.
    카드가 많을수록 이 계산을 끝까지 하는 사람이 거의 없다.
  impact:
    feeling: null # 가운데 아래: 감정적 영향 — 팀원 경험에서 "그때 한 말" 받기
    measurable: null # 놓친 혜택 금액·고르는 데 쓴 시간 등 — 팀원 경험이나 출처로만 채움
  alternatives:
    # 초안: 팀원이 실제로 쓴 방법인지 확인하고 단점을 자기 말로 고치기
    - how_used: 친구·가족이 쓰는 카드나 은행 창구에서 권해 주는 카드를 그대로 만든다
      shortcoming: 추천한 사람의 소비 기준이라 내 지출 패턴과 맞는지 확인하지 않는다
      why_ours: 내 지출 금액을 넣으면 카드마다 내가 받을 예상 혜택 금액을 같은 기준으로 계산해 보여 준다
    - how_used: 블로그·유튜브의 "학생 추천 카드 TOP" 글을 보고 고른다
      shortcoming: 글쓴이 기준의 순위라 내 신분(학생·군인 등)·연회비 한도·실적 조건을 반영하지 않고, 단종·혜택 변경 여부를 알기 어렵다
      why_ours: 내 신분으로 가입할 수 있는 카드만 남기고, 카드마다 출처 링크와 정보 확인일을 함께 보여 준다
    - how_used: 카드 비교 사이트나 카드사 홈페이지에서 카드를 하나씩 열어 혜택을 읽는다
      shortcoming: 할인율·전월실적·월 한도를 내 지출에 직접 대입해 계산해야 해서 여러 카드를 끝까지 비교하기 어렵다
      why_ours: 전월실적 충족 여부와 월 한도를 반영한 예상 월 혜택과 연회비를 뺀 연간 순혜택으로 순위를 매긴다

personas: []
# 실제 기록이 있을 때만 채워요.
