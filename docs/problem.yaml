# 패스트거북이 — 주최측 problem.example.yaml 구조의 최종 기획 명세이다.
# 현재 정책은 planning-policy.yaml, 미채택 제안·과거 원문은 archive/planning-history/를 따른다.
# 기능 완료 조건은 목표 계약이며 구현·효과·기기 검증 결과가 아니다.
statement: 노트북으로 과제·공부하는 대학생은 몰입 중 자세 변화를 제때 알아차리기 어렵고, 고쳐 앉아도 다시 작업에 집중하면 같은 자세로 돌아오는 어려움을 겪는다.
canvas:
  context: |-
    E2에 기록된 장면은 최근 일주일 동안 노트북으로 과제·공부하다 고개가 앞으로 나오고,
    친구의 지적 뒤 고쳐 앉았지만 다시 집중하면 같은 자세로 돌아온 경험이다.
    정확한 장소·일시·횟수·지속 시간은 미확인이다. 도서관·스터디 카페·집은 향후 확인할 장면이다.
    E1의 학교 프로젝트 관찰은 별도 기록이며 E2의 발생 장소나 동일 사건으로 합치지 않는다.
  customer: |-
    초기 대상은 자세를 관리하려 하지만 노트북 과제·공부 중 스스로 확인을 놓치는 대학생이다.
    직접 자기보고가 기록된 대상은 P1이다. 전체 대학생을 대표하는 표본으로 해석하지 않는다.
    관리 도구 사용 경험·추가 서비스 사용 의향은 미확인이다.
  root_problem: |-
    자세를 고치려는 의지만으로는 작업 중 변화 인지와 조정의 지속을 유지하기 어렵다는 문제 가설이다.
    E2는 고쳐 앉아도 돌아오는 경험을 뒷받침하지만 몰입이 유일한 원인임을 입증하지 않는다.
    주의 부담·화면 배치·글씨 크기·유지 불편 중 주원인은 미확인이다.
    서비스 목적은 지속적인 개인 기준 이탈의 감지·알림과 기록·리포트로 자기 조정을 돕고 거북목 예방을 지원하는 것이다.
    위험 감지는 이 지속 이탈의 감지를 뜻하며 발병 가능성이나 의학적 위험도 계산이 아니다. 예방 효과는 검증 대상이다.
  impact:
    feeling: E2에서 오래 앉아 있을 때 목·어깨가 뻐근한 경우가 있었다는 자기보고가 있다. 답답함·불안 같은 감정은 직접 확인하지 않았다. E1의 친구 감정도 미확인이다.
    measurable: |-
      E2의 반복 빈도는 최근 일주일에 "자주"라는 회상까지 확인됐으며 횟수·시간·작업 효율 손실은 미측정이다.
      특정 자세와 뻐근함의 인과, 서비스의 예방 효과는 확인되지 않았다.
      후속 검증에서는 동일 작업에서 변화·인지·조정 시점, 반복 횟수와 알림으로 인한 작업 중단을 기록한다.
      문헌의 집단 수치를 P1의 손실이나 제품 성과로 바꾸지 않는다.
  alternatives:
    - how_used: 생각나거나 주변 사람이 알려주면 고쳐 앉는다. E2에서 사용이 확인된 방법이다.
      shortcoming: E2에서는 고쳐 앉아도 다시 작업에 집중하면 같은 자세로 돌아왔다. 조정이 유지되지 않은 원인은 미확인이다.
      why_ours: 주변 사람이 없는 동안에도 기준 이탈이 지속될 때 확인 계기를 제공하려 한다. 반복 알림이 조정에 도움이 되는지와 작업 방해를 함께 검증한다.
    - how_used: 정해진 시간에 자세 확인·휴식을 알리는 타이머이다. 팀원의 실제 사용 여부는 미확인이다.
      shortcoming: 실제 자세 변화와 알림 시점이 맞지 않을 수 있다는 가설이다. 사용 만족도·실제 실패 사례는 미확인이다.
      why_ours: 변화 기반 알림이 불필요한 경고를 줄이는지 같은 작업의 시간 기반 알림과 비교한다. 우월성을 미리 확정하지 않는다.
    - how_used: 받침대·외부 입력장치 등으로 화면 높이와 작업 환경을 조정한다. 실제 사용 경험은 미확인이다.
      shortcoming: 환경 조정 후에도 자세 확인의 어려움이 남는지는 미확인이다. 이것만으로 충분하면 추가 서비스 필요성이 낮다.
      why_ours: 환경 개선 뒤에도 작업 중 변화를 놓치는 경우에 확인을 보완하려 한다. 환경 조정을 대체하거나 치료 효과를 비교하지 않는다.
    - how_used: 개인 기준·웹캠 분석·자세 알림을 제공하는 유사 접근(R5)이다. 팀원의 사용 경험은 미확인이다.
      shortcoming: 기존 서비스의 정확도·방해·중단 이유는 직접 비교하지 않았다. 기존 서비스에 결함이 있다고 단정하지 않는다.
      why_ours: 학습 중 오경고·작업 방해·반복 사용 가능성, 기록·자동 리포트의 유용성을 같은 조건에서 비교 검증한다. 기능 자체의 새로움과 측면 추가의 정확도 향상을 입증된 차별점으로 쓰지 않는다.
personas:
  - id: P1
    description: 노트북으로 과제·공부하는 대학생 팀원이다. 고쳐 앉아도 다시 집중하면 돌아오고 오래 앉으면 목·어깨가 뻐근한 경우가 있다고 설명했다. 관리 도구 사용·서비스 수용성은 미확인이다.
    source: 기존 통합 문서에 기록된 2026-10-30 자기보고(E2)이다. 이번 작업에서 새 인터뷰·대표 표본 검증을 수행하지 않았다.
experiences:
  - id: E1
    when: 학교에서 프로젝트를 하던 중이다. 구체적인 날짜·작업 시간은 미확인이다.
    what_happened: 사용자가 학교 프로젝트 중 친구의 굽은 자세를 보고 친구에게 알려줬다. 목·허리 뻐근함도 처음 설명에 포함됐지만 그 당사자는 아직 확인하지 않았다.
    workaround: 사용자가 친구에게 자세를 알려줬다. 친구가 실제로 조정했는지와 조정 후 변화는 미확인이다.
    feeling: 관찰자인 사용자와 친구의 당시 감정은 확인되지 않았다. 목·허리 뻐근함의 당사자도 미확인이다.
    quote: 당시 직접 발화는 제공되지 않았다. 경험을 설명한 문장을 당시 대화로 재구성하지 않는다.
    source: '2026-10-30 제공 보완팩 §12의 후속 정정: 사용자가 친구를 보고 알려준 관찰. 이전 E1의 관찰 주체·날짜·인용 서술을 대체한다.'
  - id: E2
    when: 최근 일주일 (2026-10-30 회상, 정확한 발생 일시·횟수는 기억하지 못함)
    what_happened: |-
      노트북으로 과제하거나 공부에 집중할 때 고개가 앞으로 나오는 경우가 자주 있었다.
      친구가 거북목처럼 자세가 굽어 있다고 지적해 그제야 고쳐 앉은 적이 있다.
      오래 앉아 있으면 목과 어깨가 뻐근한 경우도 있었으나, 실제 작업 효율에 얼마나 영향을 미쳤는지는 모른다.
    workaround: 자세를 고쳐 앉았지만 작업에 다시 집중하면 무의식적으로 같은 자세로 돌아왔다.
    feeling: 목·어깨의 뻐근함을 보고했다. 이 반복 상황에 대한 감정은 별도로 확인하지 않았다.
    quote: 자세를 고쳐도 작업에 다시 집중하면 무의식적으로 같은 자세로 돌아간다는 점입니다.
    source: 기존 통합 문서에 기록된 2026-10-30 사용자의 최근 일주일 자기보고. 이번 정합성 작업에서 새로 인터뷰하거나 측정한 내용은 아니다. E1과 동일 사건으로 합치거나 독립된 두 사용자 표본으로 세지 않는다.
sources:
  - id: R1
    url: https://db.koreascholar.com/Article/Detail/418785
    title: 디지털기기의 사용이 대학생의 눈과 근육뼈대계에 미치는 영향, 2022
    claim: |
      [제공 자료의 확인 기록; 이번 통합에서 원문 재검증하지 않음] 대학생 156명의 설문에서 디지털기기 전체 사용 시간과 몸통·전체 근육뼈대계 통증의 관련성을 보고했다.
      몰입으로 인한 자세 확인 누락이나 자동 경고 필요성을 직접 조사한 결과는 아니다.
  - id: R2
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2521871/
    title: Using Real-Time Visual Feedback to Improve Posture at Computer Workstations, 2008
    claim: |
      [제공 자료의 확인 기록; 이번 통합에서 원문 재검증하지 않음] 8명의 실험에서 교육·실시간 영상 피드백·자기 점검의 복합 개입으로 일부 자세 행동이 개선됐고 생산성 감소도 보고했다.
      자동 경고만의 효과는 아니다.
  - id: R3
    url: https://link.springer.com/article/10.1007/s00426-021-01622-2
    title: Posture biofeedback increases cognitive load, 2022
    claim: |
      [제공 자료의 확인 기록; 이번 통합에서 원문 재검증하지 않음] 컴퓨터 게임 중 자세 피드백을 제공한 조건에서 목 자세 지표가 개선됐지만 게임 수행 점수는 낮아졌다.
      대학생의 실제 과제 상황이나 몰입 중 자세 확인 누락을 직접 입증하지 않는다.
  - id: R4
    url: https://pubmed.ncbi.nlm.nih.gov/37883913/
    title: Can biofeedback training in combination with ergonomic information reduce pain among young adult computer users with neck and upper extremity symptoms?, 2024
    claim: |
      [제공 자료의 확인 기록; 이번 통합에서 원문 재검증하지 않음] 젊은 컴퓨터 사용자 39명의 연구에서 바이오피드백 훈련과 인체공학 상담의 자세·통증 개선은 대조군 대비 유의하지 않았다.
  - id: R5
    url: https://github.com/LinklyAI/upright
    title: Upright 공식 저장소
    claim: |
      [제공 자료의 확인 기록; 이번 통합에서 원문 재검증하지 않음] 개인 기준 등록과 기기 내 웹캠 분석, 자세 알림 기능을 설명하는 공개 프로젝트이다.
      정확도·건강 효과를 독립 검증한 자료는 아니다.
  - id: R6
    url: https://oshri.kosha.or.kr/kosha/info/koshaGuideData.do?articleNo=453895&attachNo=261182&mode=download
    title: KOSHA GUIDE E-G-3-2025 영상표시단말기를 사용하는 사무환경 관리에 관한 기술지원규정
    claim: |
      [제공 자료의 확인 기록; 이번 통합에서 원문 재검증하지 않음] 머리 중립·어깨 이완·화면 및 입력장치 배치·등과 발 지지의 작업 자세 권고를 제공한다.
      정면 웹캠의 거북목 진단 임계값은 아니다.
  - id: R7
    url: https://koreascience.kr/article/JAKO202106763002134.pdf
    title: 웹캠 기반 거북목 판별 알고리즘을 활용한 자세 교정 반응형 헬스케어 시스템, 2021
    claim: |
      [제공 자료의 확인 기록; 이번 통합에서 원문 재검증하지 않음] 정면의 양광대·턱과 어깨선 사이 거리의 얼굴 너비 대비 비율을 자세 분류 특징으로 사용했다.
      소규모이며 테스트 자료를 튜닝에도 사용해 일반 사용자 최종 성능으로 확대할 수 없다.
  - id: R8
    url: https://kci.go.kr/kciportal/landing/article.kci?arti_id=ART003378990
    title: 인공지능 기반 자세 추정 모델을 활용한 실시간 거북목 증후군 검출 시스템, 2026
    claim: |
      [제공 자료의 확인 기록; 이번 통합에서 원문 재검증하지 않음] 얼굴 삼각형 면적 변화와 어깨 변위, 개인 기준 보정을 조합한 정면 웹캠 자세 분류 방법을 제안했다.
      설정값은 휴리스틱이며 임상 교차 검증은 향후 과제이다.
  - id: R9
    url: https://www.jstage.jst.go.jp/article/mta/12/4/12_203/_pdf
    title: Measurement of Viewing Distance and Posture Using the Front Cameras of Digital Devices to Support Children’s Health, 2024
    claim: |
      [제공 자료의 확인 기록; 이번 통합에서 원문 재검증하지 않음] 코와 목 기준점의 거리 대비 양안 거리 비율을 정면 자세 구분에 사용했다.
      자세 실험은 성인 5명의 파일럿이며 제안값을 보편 정상선으로 적용할 수 없다.
five_whys:
  symptom: E2에서 고쳐 앉아도 작업에 다시 집중하면 같은 자세로 돌아왔다.
  whys:
    - 작업 중 변화를 스스로 알아차리기 어렵고 주변의 지적을 계기로 고쳐 앉은 경험이 있다(E2).
    - 작업과 자세 확인 사이 주의 부담이 있을 수 있다. R2·R3는 피드백 부담의 간접 근거이며 P1의 원인으로 확정하지 않는다.
    - 환경·글씨 크기·작업 습관·유지 불편 중 주원인은 미확인이다. 확인되지 않은 원인을 만들어 다섯 단계를 채우지 않는다.
solution_paths:
  - path: 안내·개인 기준 등록 → 지속 기준 이탈 경고 → 정상 복귀·중단 기록 → 자동/종료 리포트 → 사용자 확인·조정
    status: chosen
    reason: 사용자 채택 기본 경로이다. 안정 등록 5초·최초 경고 10초·복귀 확인 3초·재경고 60초·자동 리포트 유효 30분을 적용한다. S2는 경고·복귀·종료 결과, S3는 자동 리포트와 같은 세션 계속을 확인한다.
  - path: 선택형 딥 모드에서 QR 승인·측면 기준 등록 → 정면·측면 통합 경고 → 복귀·종료 결과 확인
    status: chosen
    reason: 사용자 채택 선택 경로를 유지한다. S5는 자체 연결부터 종료 결과, S6은 장애 후 기본 전환을 확인한다. 정확도 향상·동기화·공식 다중 기기 재현은 검증 전이다.
  - path: 고정 시간 자세 확인 알림
    status: deferred
    reason: 변화 기반 경고의 추가 가치를 비교할 실험 조건이다. 현재 제품 기능으로 추가하지 않는다.
  - path: 로그인·클라우드 동기화·랭킹
    status: deferred
    reason: 현재는 로그인 없는 같은 PC 사이트·브라우저 프로필의 로컬 저장이다. 랭킹 F11은 후속 번호로 보존하고 현재 기능·시나리오에서 제외한다.
insight:
  claim: 주변 안내가 자세를 확인하는 계기는 되지만 조정의 지속은 별개이다. 제품 가치는 경고 수가 아니라 확인·조정에 주는 도움과 작업 방해를 함께 평가해야 한다는 가설이다.
  evidence: E1은 친구에게 알려준 관찰이며 반응은 미확인이다. E2는 본인의 반복·뻐근함 자기보고이며 횟수·인과는 미확인이다. R1은 집단 관련성, R2~R4는 피드백의 도움·부담·한계, R5는 유사 접근, R6~R9는 안내·기술 참고이다.
  design_decision: 개인 기준·지속 경고·로컬 기록·자동/종료 리포트와 선택형 딥 모드를 유지한다. 자리 비움·인식 불가는 판정 보류와 연속 타이머 초기화이며 정상 복귀로 세지 않는다. 검증 전에는 공통 확인 문구를 사용하고 진단·치료·장기 예방 효과를 주장하지 않는다.
features:
  - id: F1
    name: 개인 기준 등록·재등록
    input: 카메라 권한, 자세·배치 안내 확인, 안정된 유효 입력, 기준 자세 등록 버튼
    output: 기준 ID·특징·장치·촬영 조건·모델 버전과 등록 상태
    done: |-
      필수 입력이 연속 안정 5초이면 '기준 자세가 등록됐어요'를 표시하고 탐지 시작을 허용한다.
      자리 비움·인식 불가·불안정 입력이면 등록 타이머를 0으로 초기화하고 새 연속 5초를 요구한다.
      재등록 진입 시 판정을 보류하고 기존 이탈을 기준 변경으로 닫는다. 새 기준 ID를 저장하며 '탐지 재개' 전에는 자동 재개하지 않는다.
      개인 기준을 의학적 정상 인증으로 표시하지 않는다.
  - id: F2
    name: 지속 기준 이탈 경고·정상 복귀
    input: 등록 기준, 유효 영상 특징, 적용 설정 버전
    output: 이탈 후보·확정 이탈, 실제 최초 경고·재경고, 정상 복귀·중단 기록
    done: |-
      기본 연속 유효 이탈 10초에 '기준 자세에서 벗어난 상태가 지속되고 있습니다. 자세를 확인해 주세요.'를 표시한다.
      기준 범위의 연속 유효 복귀 3초에 경고를 해제하고 정상 복귀 1회를 남긴다. 10초 전에 기준 범위로 돌아온 후보는 확정 이탈·경고로 집계하지 않는다.
      같은 확정 이탈은 최초 경고 뒤 연속 유효 60초마다 재경고하며 유형 중첩·재경고로 이탈 ID를 늘리지 않는다.
      자리 비움·인식 불가·정지·기준/설정/모드 변경은 중단으로 닫고 이탈·복귀·재경고 연속 타이머를 초기화한다. 전후 시간을 합치지 않는다.
      경고 10초·재경고 60초는 기본값이며 유효 사용자 적용값은 별도 설정 버전으로 구분한다.
  - id: F3
    name: 세션 시작·일시 정지·재개·종료
    input: 탐지 시작, 일시 정지, 재개, 세션 종료 버튼
    output: 세션·카메라·저장 상태, 누적 유효 감지 시간
    done: |-
      등록 완료와 유효 입력을 확인한 뒤 탐지 시작에서 세션을 시작한다.
      일시 정지는 촬영·추론·경고·유효 시간 누적을 멈추고 연속 타이머를 초기화한다. 재개는 장치·기준·배치 확인 후 같은 세션의 새 연속 구간을 시작한다.
      세션 누적 유효 시간과 이전 기록은 유지한다. 종료 시 카메라 종료 상태와 '저장 완료'/'저장 실패'를 별도로 표시한다.
      새로고침 후에는 마지막 저장 구간만 중단 세션으로 복원하고 카메라·탐지를 자동 시작하지 않는다.
  - id: F4
    name: 권한·자리 비움·인식 불가 처리
    input: 카메라 권한, 연결·영상 갱신, 필수 지점 품질
    output: 권한 안내, 유효/자리 비움/인식 불가 상태, 판정 보류 구간·사유
    done: |-
      권한 거부 시 '카메라를 쓸 수 없어요'와 재시도 안내를 표시하고 등록·시작을 막는다.
      자리 비움은 '자리 비움 · 판정 보류'로 표시하고 경고·유효 시간 누적을 멈춘다. 후보는 폐기하고 확정 이탈은 자리 비움 사유로 닫으며 정상 복귀 수를 늘리지 않는다.
      인식 불가·영상 갱신 중단도 같은 중단 원칙으로 처리한다. 이탈·복귀·재경고 타이머를 모두 초기화하고 확정 이탈 유무와 별개로 보류 구간·사유를 남긴다.
      기준·배치가 유효한 입력이 돌아오면 새 연속 구간을 시작한다. 이탈 6초→자리 비움→이탈 4초의 경고는 0회이다.
      사용자 정지나 복구 대기가 필요한 상태에서는 입력만 돌아왔다고 자동 재개하지 않는다. 자리 비움 자체는 촬영 종료가 아니다.
  - id: F5
    name: 설정 입력 검증·적용·버전 기록
    input: 민감도, 경고 시간·재경고 간격·소리, 적용 버튼
    output: 유효 설정·적용 시각·설정 버전, 잘못된 입력 안내
    done: |-
      처음에는 기본 경고 10초·재경고 60초를 표시한다. 0·소수·음수는 '양의 정수를 입력해 주세요'로 거부하고 기존 저장값·설정 버전·측정 구간을 유지한다.
      유효한 값의 적용은 설정 화면을 닫고 적용 시각·불변 버전을 저장한다. 진행 이탈은 설정 변경으로 닫고 새 연속 구간으로 판정한다.
      같은 브라우저에서 재접속하면 적용값이 보인다. 기준 등록 5초·복귀 3초·자동 리포트 유효 30분은 이 화면에서 변경하지 않는다.
      시간 입력 상한·민감도별 판정 경계는 미확정이며 과거 제안값을 현재 기본값으로 사용하지 않는다.
  - id: F6
    name: 자동 리포트·종료 리포트
    input: 유효 구간, 확정 이탈, 실제 경고, 정상 복귀·중단 원장
    output: 유효 시간·합집합 이탈 시간/비율, 이탈·경고·복귀·중단 내역
    done: |-
      유효 감지 누적 1800초(30분)마다 '리포트가 준비됐어요'를 표시하고 자동 리포트 1개를 생성한다. 탐지와 세션은 계속한다.
      종료 시 마지막 자동 경계 이후 남은 유효 구간만 종료 리포트로 만든다. 정확한 경계 종료는 빈 리포트를 만들지 않는다.
      유효 시간 0은 '분석 가능한 기록이 없습니다'로 표시하고 비율을 계산하지 않는다.
      같은 이탈의 유형 중첩은 시간을 합집합하고 경계를 넘으면 ID를 유지한다. 신규 횟수는 onset 구간, 경고는 실제 표시 구간에 귀속하며 늦은 확정은 같은 리포트 ID를 개정한다.
      등록·자리 비움·인식 불가·정지·복구 대기·재등록 준비 시간은 유효 시간과 이탈 시간에서 제외한다.
  - id: F7
    name: 로컬 기록 조회·조건부 비교·삭제
    input: 내 기록, 세션 선택, 이전 기록과 비교, 기록 삭제·삭제 확인
    output: 같은 PC 브라우저의 저장 기록, 비교 가능 여부·삭제 결과
    done: |-
      로그인 없이 같은 PC 사이트·브라우저 프로필에 실제 저장된 기록만 표시한다.
      모드·지표·기준·설정·배치 유효성이 같을 때만 정량 비교한다. 조건 차이는 '조건이 달라 비교할 수 없어요', 자료 부족은 '비교할 기록이 부족해요'를 표시한다.
      종료 세션 삭제는 원장·리포트·파생 집계에 함께 반영하고 현재 등록 기준과 다른 세션이 참조하는 기준을 보존한다.
      전체 삭제의 기준·설정 포함 여부는 확인 화면에서 구분한다. 기록이 없으면 '저장된 기록이 없어요'를 표시한다.
      보관 기간·자동 만료 시점은 미확정이다. 브라우저 정리·사이트 데이터 삭제로 소실될 수 있으며 영구 보관을 보장하지 않는다.
  - id: F8
    name: QR 휴대폰 승인 연결
    input: PC 딥 모드 사용하기, 휴대폰 연결 요청, PC 연결 승인
    output: 해당 PC 세션에 승인된 휴대폰 연결 상태
    done: |-
      QR 생성만으로 촬영하지 않는다. 휴대폰 '연결 요청' 뒤 PC '연결 승인'을 거쳐야 연결한다.
      만료·사용·재발급으로 무효가 된 QR 요청은 거부하고 이유를 표시한다. 새 휴대폰으로 자동 교체하지 않는다.
      연결 상태·종료 요청·종료 확인을 구분한다. QR 만료 시간과 연결 감시 주기는 미확정이며 과거 제안값을 확정 조건으로 사용하지 않는다.
  - id: F9
    name: 측면 배치·개인 기준 등록
    input: 휴대폰 카메라 권한, 측면 배치 가이드, 기준 자세 등록
    output: 정면·측면 기준 ID와 측면 배치 품질
    done: |-
      정면·측면 필수 입력이 함께 연속 안정 5초를 충족해야 '기준 자세가 등록됐어요'를 표시한다.
      한쪽이라도 자리 비움·인식 불가이면 등록 타이머를 초기화하고 딥 모드 탐지 시작을 막는다.
      지원 방향·거리·촬영 범위는 실측 대상이다. C7을 측정하지 않는 지표를 임상 CVA로 표시하지 않는다.
  - id: F10
    name: 통합 탐지·연결 장애 복구
    input: 정면·측면 특징·품질·측정 시각, 연결 상태, 기본 모드로 계속
    output: 딥 모드 판정, 복구 대기, 같은 세션의 기본 모드 구간
    done: |-
      유효하고 동기화된 두 입력만 결합한다. 한쪽이 무효이면 전체 판정·유효 시간 누적을 보류하고 연속 타이머를 초기화한다.
      연결 끊김이 확인되면 연결 권한을 무효화하고 '복구 대기'를 표시한다. 정면 기준·입력이 유효할 때만 '기본 모드로 계속'을 허용한다.
      같은 세션에서 딥·기본 구간을 분리하고 장애·모드 변경을 정상 복귀로 집계하지 않는다.
      휴대폰 종료 요청과 실제 확인은 구분한다. 장애 판정 시간·휴대폰 자체 중단 시간은 미확정이며 실제 기기 검증이 필요하다.
  - id: F12
    name: 로그인 없는 로컬 저장·처리 범위 안내
    input: 시작·카메라·저장·삭제 요청
    output: 로컬 저장 범위·개인정보 한계·실패 안내
    done: |-
      첫 화면에 '로그인 없이 이 PC 브라우저에 기록을 저장해요'를 표시한다. 기록·리포트·기준·설정은 같은 PC 사이트·브라우저 프로필의 로컬 저장이다.
      IndexedDB/localStorage는 구현 수단이며 같은 저장 범위·삭제·실패 계약을 따른다. 계정·클라우드 동기화·다른 브라우저 복원·공유 PC 타인 접근 보호를 제공한다고 쓰지 않는다.
      원본 영상·연속 원시 좌표는 저장·전송하지 않는 구조가 목표이다. 딥 모드의 최소 특징·품질·시각은 승인된 보안 연결로 PC에 전달하되 휴대폰·중계에 개인 기록 이력을 보관하지 않는다.
      저장 실패를 완료로 표시하지 않는다. 실제 저장·네트워크·카메라 종료 검증은 별도 상태이다.
