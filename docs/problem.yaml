# FIRST-PENGUIN 팀 문제정의 (docs/problem.yaml)
# 팀명: 패스트거북이 · 종이 캔버스 초안(2026.10.29)과 채팅 보충 설명을 옮김
# null / [] 칸은 아직 팀 답이 없는 곳이에요. 지어내서 채우지 않아요.
# 대시보드가 main 브랜치에 push된 이 파일을 직접 읽어요.

# 긴 문장은 | 또는 |-로 줄바꿈을 보존하세요.

statement: |-
  노트북으로 오래 일하는 개발자·직장인은 업무에 집중하는 동안 자세가 구부정해지고 목이 앞으로 나와도
  스스로는 알아차리지 못해서, 다른 사람이 "목이 휘었다, 거북이 같다"고 말해 줄 때에야 거북목이 된 걸 알고
  기분이 상하고 건강을 잃는다. 지금은 교정 의자·베개를 쓰거나 아플 때 턱 당기기·스트레칭으로 버티지만
  완치는 안 되고, 모르는 사이에 다시 거북목 자세가 되어 계속 악화된다.
canvas:
  context: |-
    장소·시간을 가리지 않고, 업무에 집중할 때면 허리가 구부정해지고 목이 앞으로 나온 자세가 된다.
    본인은 집중하고 있어서 자세가 무너진 것을 알아차리지 못한다.
  customer: |-
    노트북으로 공부·작업하며 오래 앉아 있는 대학생(우리 팀), 그리고 같은 상황의 개발자·회사에서 컴퓨터로 업무를 하는 사람
  root_problem: |-
    구부정한 자세를 오래 유지해서 거북목이 되는데, 정작 본인은 지금 자기 자세가 어떤지 볼 수 없어 모른다.
    거북목은 보통 친구 같은 다른 사람이 보고 알려 줘서야 알게 된다.
    알게 된 뒤에도 확실한 해결 방법이 없어서, 고치려 애쓰는 사이에도 무의식적으로 다시 나쁜 자세가 되어 악화된다.
  impact:
    feeling: |-
      "너 목이 좀 휘었어. 거북이 같아."라는 말을 들으면 기분이 나쁘고 스트레스를 받는다.
    measurable: null # 학생 답 대기 — 출처 있는 수치나 팀이 직접 잰 기록이 아직 없음
  alternatives:
    - how_used: 자세 교정 의자·베개를 쓴다
      shortcoming: 완치가 안 된다. 의자에 앉아 있어도 집중하면 다시 목이 앞으로 나온다
      why_ours: |-
        의자·베개는 자세가 무너져도 알려 주지 않는다. 우리는 무너지는 순간을 잡아내 알려 준다.
    - how_used: 아플 때 턱 당기기·스트레칭을 한다
      shortcoming: |-
        거북목의 확실한 해결 방법이 없어서 턱 당기기·스트레칭 정도가 전부인데, 완치가 안 된다.
        그리고 아플 때만 하기 때문에, 그 사이에 내가 모르는 채로 거북목 자세가 유지되어 계속 악화된다.
      why_ours: |-
        스트레칭은 이미 아픈 뒤에 하는 사후 대응이다. 우리는 아프기 전에, 나쁜 자세가 이어지는 바로 그때 알려 준다.
personas: []
# 학생 답 대기 — 실제 대상 1명(누구이며 어떤 처지인지)
experiences: []
# 학생 답 대기 — "친구가 거북목이라고 알려 준" 실제 장면(언제·무슨 일·어떻게 넘겼나·그때 한 말)
sources: []
five_whys:
  symptom: 거북목이 된다 (허리는 구부정하고 목은 앞으로 나온 자세)
  whys:
    - 잘못된, 구부정한 자세를 오래 유지한다
    - 업무에 집중하면 자세가 자연스럽게 무너진다
    - 지금 자기 자세가 어떤지 본인은 모른다 — 다른 사람이 봐야 알 수 있다
    - 알고 나서 스트레칭을 해도, 다시 무너지는 순간은 여전히 아무도 알려 주지 않는다
solution_paths:
  - path: |-
      정면 웹캠으로 사용자의 바른 자세를 기준으로 저장하고, 그 기준을 벗어난 자세가 일정 시간(약 5분, 미정) 이어지면
      "거북이가 되었습니다" 알림을 보내는 웹사이트
    status: chosen
    reason: |-
      거북목은 본인은 모르고 다른 사람이 봤을 때 알 수 있다. 친구 대신 카메라가 보고 알려 준다.
      사람마다 바른 자세가 다르니 정해진 기준이 아니라 본인의 바른 자세를 기준으로 삼고, 나쁜 자세의 기준치도 그 기준 자세에서 정한다.
  - path: 딥 모드 — 휴대폰을 QR로 연결해 측면 카메라를 추가하고 정면·측면을 통합 판정한다
    status: deferred
    reason: 정면 기준 판정이 먼저 동작해야 한다. 휴대폰 연결·배치 검증은 서버 세션이 필요하고 측면 배치 허용 범위도 아직 검증 전이다.
  - path: 로그인 뒤 아는 사람들끼리 커뮤니티를 만들고 "최악의 거북이" 랭킹을 보여 준다
    status: deferred
    reason: 혼자 쓰는 알림이 먼저 동작해야 한다. 거북목을 서로 알려 주던 친구 관계를 서비스 안으로 가져오는 다음 단계로 둔다.
insight:
  claim: 거북목인 사람은 본인이 거북목인지 모르고, 친구 같은 다른 사람이 알려 줘서 알게 된다.
  evidence: null # 학생 답 대기 — 팀 진술은 있으나 experiences·sources에 기록된 근거가 아직 없음
  design_decision: |-
    정면 웹캠으로 사용자의 바른 자세를 먼저 저장하고, 그 기준에서 벗어난 자세가 일정 시간 이어지면 "거북이가 되었습니다"라고 알려 준다.
    거북목을 진단하거나 치료하지 않는다. 친구가 해 주던 "너 지금 거북이야"를 대신하는 데서 멈춘다.
features:
  - id: F1
    name: 바른 자세 기준 저장
    input: 카메라 사용 허락, 정면 웹캠 앞에서 바른 자세로 앉은 사용자의 영상
    output: 사용자 본인의 바른 자세가 기준으로 저장되고, 이 기준에서 나쁜 자세로 볼 기준치가 함께 정해진다
    done: |-
      카메라를 허락하고 바른 자세로 앉아 기준 저장을 누르면 "기준 자세가 저장됐어요"가 보이고, 다시 접속해도 기준이 남아 있다.
      카메라를 거부하거나 얼굴·어깨가 화면에 보이지 않으면 저장되지 않고 이유를 보여 준다.
  - id: F2
    name: 실시간 자세 변화 감지와 상태 표시
    input: 기준 등록 뒤 정면 웹캠 영상
    output: |-
      기준 대비 머리–어깨 간격 비율·얼굴 면적·어깨 변위의 변화로 "바른 자세 / 주의"를 표시하고 이탈 시간을 센다.
      상태는 준비 중 / 감지 중 / 일시 정지 / 자리 비움 / 인식 불가 / 종료로 표시된다.
    done: |-
      기준 자세면 "바른 자세", 목을 내밀거나 화면 쪽으로 숙이면 "주의"로 바뀌고 이탈 시간이 올라간다. 필기·물 마시기 같은 짧은 움직임은 경고로 이어지지 않는다.
      얼굴·어깨가 안 보이면 "자리 비움" 또는 "인식 불가"로 바뀌고 판정·경고·유효 감지 시간이 멈춘다(정상 자세로 치지 않음). 돌아오면 감지가 재개된다.
      임계값은 실험으로 정한다(출발값: 얼굴 면적 +10%, 머리–어깨 간격 −10%).
  - id: F3
    name: 거북이 경고
    input: F2의 "주의"가 설정한 경고 시간(기본 30초, 설정 가능) 이어짐
    output: 화면 배너 + 브라우저 알림 + 소리(켜져 있으면)로 "거북이가 되었습니다" 경고가 간다
    done: |-
      주의가 경고 시간 넘게 이어지면 경고가 1건 오고(여러 지표가 동시에 이탈해도 1건), 이탈이 계속되면 재경고 간격(기본 60초)마다 다시 온다.
      기준 범위로 돌아와 복귀 확인 시간(기본 5초) 유지되면 경고가 해제되고 이탈 시간이 0으로 돌아간다. 다른 창에서 일하고 있어도 브라우저 알림이 보인다.
  - id: F4
    name: 경고 설정
    input: 민감도(낮음·보통·높음), 경고 시간, 재경고 간격, 소리 사용 여부
    output: 설정이 저장되고 변경 시점·값이 기록된다
    done: 경고 시간을 바꾸면 다음 경고가 그 시간에 오고, 다시 접속해도 설정이 남아 있다.
  - id: F5
    name: 세션 시작·일시 정지·재개·종료
    input: 세션 시작 / 일시 정지 / 재개 / 세션 종료 버튼
    output: 탐지와 기록이 시작·중단·재개·종료된다. 일시 정지 중에는 판정·경고·유효 감지 시간 누적이 멈춘다
    done: 일시 정지를 누르면 상태가 "일시 정지"로 표시되고 거북이 자세를 해도 경고가 오지 않는다. 재개하면 "감지 중"으로 바뀌고, 세션 종료를 누르면 리포트 화면이 보인다.
  - id: F6
    name: 세션 리포트
    input: 세션 종료
    output: 전체 세션 시간, 유효 감지 시간, 이탈 횟수·누적 시간·비율·최장 연속, 경고 횟수(최초·재경고)와 시점이 표시된다
    done: 세션 중 경고를 1번 받았으면 리포트에 경고 1회와 그 시점이 보인다. 유효 감지 시간이 0이면 이탈 비율은 표시하지 않는다.
