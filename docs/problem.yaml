# ════════════════════════════════════════════════════════════════
# FIRST-PENGUIN · 내 카드 찾기 — 문제정의·기능 명세 (docs/problem.yaml)
# ════════════════════════════════════════════════════════════════
# 한 줄 소개: 신분과 한 달 지출을 넣으면 카드마다 "내가 실제로 받을 혜택 금액"을 계산해 맞는 카드를 추천하고,
#            지금 쓰는 카드와 비교해 "바꾸면 1년에 얼마 더 받는지"까지 보여 주는 웹 서비스.
#
# 문서 구성 (대시보드는 이 파일과 scenarios.yaml만 읽어요. 두 파일이 기준이고, 나머지는 이 파일을 풀어 쓴 보조 문서예요)
#   docs/problem.yaml   ← 기준. 문제정의 + 기능 명세(F1~F8). 여기 없는 기능은 만들지 않는다.
#   docs/scenarios.yaml ← 기준. 사용자 핵심 흐름(S1~S8) = E2E 테스트 대본.
#   docs/intent.md      ← 왜 이렇게 만들었나(의도·차별점·안 만드는 것). 발표 대본의 뼈대.
#   docs/spec.md        ← 화면·데이터 타입·계산식·문구를 구현 수준으로 풀어 쓴 것. problem.yaml과 다르면 problem.yaml이 맞다.
#   docs/plan.md        ← 구현 순서와 검증 방법, 현재 진행 상태.
#
# 칸 표시 규칙: null / [] = 팀의 실제 경험·측정이 아직 없는 칸(지어내지 않음). 원인 끝의 "?" = 아직 확인 못 한 원인.
# ════════════════════════════════════════════════════════════════

statement: |-
  카드를 새로 만들거나 바꾸려는 대학생·군인·사회초년생은 카드를 고를 때
  카드마다 혜택·가입 자격·전월실적·월 할인 한도가 제각각이라 내 소비에 대입해 비교하기 어렵기 때문에
  실제로 받을 수 있는 혜택보다 적은 카드를 고르거나 고르는 데 오래 걸린다.
  지금은 지인 추천·블로그 순위 글·금융사 앱·카드 비교 사이트로 버티지만
  내 지출 금액과 실적 조건을 넣어 "나는 한 달에 얼마를 돌려받는지", "지금 카드보다 얼마나 더 받는지"까지 계산해 주지는 않는다는 단점이 남는다.

canvas:
  # ① 상황 — 언제, 어디서, 얼마나 자주
  context: |-
    첫 카드를 만들 때(성인이 되거나 입학할 때), 입대할 때, 첫 월급을 받을 때, 쓰던 카드 혜택이 줄었을 때 카드를 새로 고른다.
    카드사마다 카드 종류가 많고 카드마다 혜택 분야(식비·교통·쇼핑 등)와 가입 대상(학생·군인 등)이 다르다.
    한 번 고르면 몇 년씩 쓰기 때문에, 잘못 고른 비용이 매달 쌓인다.

  # ② 고객 — 이 상황을 제일 자주 겪는 사람
  customer: |-
    카드를 처음 만들거나 바꾸려는 대학생·군인·사회초년생.
    신분에 따라 가입할 수 있는 카드가 다르고, 한 달 지출이 많지 않아 전월실적 조건에 민감하다.
    이미 카드를 쓰고 있지만 지금 카드가 나에게 맞는지, 바꾸면 얼마나 나아지는지 모르는 사람도 포함한다.

  # ③ 근본 문제 — 왜 생기고, 왜 아직 아무도 못 고쳤나
  root_problem: |-
    카드 혜택 정보가 카드사별 상품 페이지에 "할인율·전월실적·월 한도" 같은 조건 형태로만 흩어져 있어서,
    소비자가 자기 지출 금액을 직접 대입해 실제 혜택 금액으로 바꿔 계산해야 한다.
    카드가 많을수록 이 계산을 끝까지 하는 사람이 거의 없고, 기존 서비스도 "내 지출 기준 금액"과 "지금 카드 대비 차이"까지는 계산해 주지 않는다?

  # ④ 영향 — 그때 기분, 잃는 것 (feeling은 팀 캔버스 답)
  impact:
    feeling: |-
      챙길 수 있었던 혜택을 받지 못하는 찝찝함.
      복잡한 카드 혜택을 비교하면서 느끼는 피로감.
      자신에게 적합한 카드를 선택했는지에 대한 불확실성.
    measurable: null # 팀 측정 대기 — 팀원 각자 "지금 카드 연간 순혜택" vs "1위 추천 카드 연간 순혜택" 차이(원)를 이 서비스 계산식으로 구해 적는다

  # ⑤ 현재 대안 → ⑥ 대안의 단점 → 우리가 다른 점
  alternatives:
    - how_used: 친구·가족이 쓰는 카드나 은행 창구에서 권해 주는 카드를 그대로 만든다
      shortcoming: 추천한 사람의 소비 기준이라 내 지출 패턴과 맞는지 확인하지 않는다
      why_ours: 내 지출 금액을 넣으면 카드마다 내가 받을 예상 혜택 금액을 같은 기준으로 계산해 보여 준다
    - how_used: 블로그·유튜브의 "학생 추천 카드 TOP" 글을 보고 고른다
      shortcoming: 글쓴이 기준의 순위라 내 신분·연회비 한도·실적 조건을 반영하지 않고, 단종·혜택 변경 여부를 알기 어렵다
      why_ours: 내 신분·나이로 가입할 수 있는 카드만 남기고, 카드마다 출처 링크와 정보 확인일을 함께 보여 준다
    - how_used: 자주 쓰는 금융사 앱이나 카드 비교 사이트에서 카드를 하나씩 열어 혜택을 읽는다 # 팀 캔버스 답 포함
      shortcoming: 번거롭고, 할인율·전월실적·월 한도를 내 지출에 직접 대입해야 해서 여러 카드를 끝까지 비교하기 어렵다
      why_ours: 전월실적 충족 여부와 월 한도를 반영한 예상 월 혜택, 연회비를 뺀 연간 순혜택으로 한 번에 순위를 매긴다
    - how_used: 뱅크샐러드 같은 자산관리 앱에서 소비 내역을 연동해 카드를 추천받는다 # 팀이 앱에서 직접 확인 후 단점 확정
      shortcoming: 금융 계정 연동이 필요하고, 지금 쓰는 카드와 추천 카드를 같은 계산으로 놓고 "바꾸면 연 얼마 더"인지는 보여 주지 않는다?
      why_ours: 연동·로그인 없이 바로 쓰고, 지금 카드와 추천 카드를 같은 규칙으로 계산해 "바꾸면 연 ○○원 더"와 그 근거를 보여 준다

