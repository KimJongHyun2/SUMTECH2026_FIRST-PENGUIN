five_whys:
  symptom: E2에서 고쳐 앉아도 작업에 다시 집중하면 같은 자세로 돌아왔다.
  whys:
    - 작업 중 자세 변화를 스스로 알아차리기 어렵다는 자기보고가 있다(E2).
    - 작업과 자세 관리 사이 주의 부담이 있을 수 있다(R2·R3의 간접 근거). 몰입이 원인이라고 직접 증명하지 않는다.
    - 환경·글씨 크기·작업 습관·유지 불편 중 주원인은 미확인이다. 추가 원인을 만들어 다섯 단계를 채우지 않는다.
solution_paths:
  - path: 안내·개인 기준 등록 → 지속 변화 감지·유형별 확인 경고 → 경고·복귀 기록 → 주기/종료 리포트 → 사용자 조정
    status: chosen
    reason: 사용자가 전달한 최신 보완 방향. 자세 관리와 예방을 돕는 것이 목적이며 효과 입증과 구분한다. 도움과 작업 방해를 함께 평가한다.
  - path: "선택형 딥 모드: QR 승인으로 휴대폰 측면을 연결하고 정면·측면의 유효 특징을 결합"
    status: chosen
    reason: 최신 보완자료의 선택 경로로 설계에 포함한다. 지원 환경·동기화·주최 측 재현은 미검증이며 미해결 항목을 숨기지 않는다.
  - path: 고정 시간 자세 확인 알림
    status: deferred
    reason: 변화 기반 경고의 추가 가치를 비교할 실험 조건이자 향후 대체 경로. 현재 제품 기능으로 추가하지 않는다.
  - path: 로그인·클라우드 동기화·랭킹
    status: deferred
    reason: 로그인 없는 PC 로컬 기록을 먼저 제공한다. 랭킹 산식·공개·동의·공정성 정책은 후속이며 더미 순위를 구현하지 않는다.
insight:
  claim: 주변의 안내는 자세 확인 계기가 될 수 있지만, 작업 중 조정의 지속성과 경고 부담을 함께 봐야 한다. 제품의 가치는 알림 개수보다 유용한 조정과 작업 방해의 균형으로 평가한다.
  evidence: E1은 친구의 자세를 보고 알려준 관찰이며 친구의 반응은 미확인이다. E2는 본인의 반복·불편 자기보고이며 수치와 인과는 미확인이다. R1은 집단 관련성, R2~R4는 피드백의 도움과 한계, R5는 유사 접근, R6~R9는 안내·기술 참고다. 문헌을 실제 개인 경험으로 기록하지 않는다.
  design_decision: 개인 기준·지속 경고·유형별 기록·주기 리포트·선택형 측면 모드를 설계한다. 기준은 정상 인증이 아니며 진단·치료·장기 예방 효과를 주장하지 않는다. 검증 전에는 공통 확인 문구를 사용하고 검증된 유형만 구체 안내한다. 영상은 각 기기에서 처리하고 로컬 기록을 사용하도록 설계하며 구현 후 확인한다.
features:
  - id: F1
    name: 개인 기준 등록·재등록
    input: 카메라 권한, 안내 확인, 안정된 유효 영상, 기준 자세 등록 버튼
    output: 불변 기준 ID·특징·장치·촬영 조건·모델 버전과 등록 상태
    done: 연속 안정 입력 5초 후 "기준 자세가 등록됐어요"를 표시한다. 인식 중단 시 수집을 다시 시작하며 완료 전 탐지 시작을 막는다. 재등록은 기존 이탈을 기준 변경으로 닫고 새 기준을 만든다. "탐지 재개"를 눌러야 재개한다. 정상 자세로 인증하지 않는다.
  - id: F2
    name: 지속 변화 감지·유형별 경고
    input: 등록 기준, 유효 영상 특징, 설정 버전
    output: 후보/확정 이탈, 실제 경고·복귀·중단 이벤트
    done: 검증 대상 이탈이 유효 입력에서 연속 10초 지속되면 공통 경고를 표시하고 연속 복귀 3초 후 해제한다. 재경고는 최초 경고 이후 60초마다 같은 이벤트에 기록한다. 여러 유형 동시 발생은 한 번의 경고에 묶고 원장에는 실제 표시한 경고만 남긴다. 가림·정지·설정 변경은 정상 복귀가 아니다. 숫자는 파일럿 설정이며 판정 임계값은 실측 대상이다.
  - id: F3
    name: 세션 시작·일시 정지·재개·종료
    input: 탐지 시작, 일시 정지, 재개, 세션 종료 버튼
    output: 세션 상태·카메라 상태·저장 상태
    done: 일시 정지에서 촬영·추론·경고·유효 시간 누적을 중단한다. 재개는 장치와 기준 확인 후 시작한다. 종료는 카메라 중단과 기록 저장 상태를 구분해 표시한다. 새로고침 시 카메라를 자동으로 켜지 않고 저장된 구간만 중단된 세션으로 복원한다.
  - id: F4
    name: 권한·인식 실패와 복구
    input: 카메라 권한·연결·영상 갱신·필수 지점 품질
    output: 준비/진행/사용자 정지/복구 대기/종료 및 유효/자리 비움/인식 불가
    done: 권한 거부 시 "카메라를 쓸 수 없어요"와 재시도 안내를 표시하고 등록을 막는다. 자리 비움·인식 불가·입력 갱신 중단에서는 경고와 유효 시간 누적을 멈추며 정상으로 집계하지 않는다. 지원 브라우저의 다른 탭·앱 작업 중 동작은 실제 시험 후 지원 범위를 표시한다.
  - id: F5
    name: 설정 적용·버전 기록
    input: 민감도 낮음/보통/높음, 경고 시간·재경고 간격·소리, 적용 버튼
    output: 적용 시각이 있는 불변 설정 버전
    done: 경고 시간은 정수 1~300초, 재경고 간격은 정수 10~600초 범위의 설계값으로 입력 검증한다. 범위 밖이면 저장하지 않고 이유를 표시한다. 적용 시 기존 이탈을 설정 변경으로 닫고 새 구간을 시작한다. 새로고침 후 같은 설정이 표시된다. 민감도별 판정 경계는 실측으로 정한다.
  - id: F6
    name: 주기·종료 리포트
    input: 유효 구간, 유형별 이탈, 실제 경고와 복귀/중단 원장
    output: 전체/유효 시간, 합집합 이탈 시간·비율, 신규/이어진 이탈, 경고·복귀 내역
    done: 유효 감지 1800초마다 리포트를 만들되 탐지는 계속한다. 종료 시 남은 유효 구간만 부분 리포트로 만든다. 유효 시간 0은 "분석 가능한 기록이 없습니다"로 표시한다. 경계 횡단은 이벤트 ID를 유지하고 신규 횟수는 onset 구간에 한 번 귀속한다. 늦은 확정은 같은 리포트 ID의 revision을 올린다. 정확한 경계 종료는 빈 리포트를 만들지 않는다.
  - id: F7
    name: 로컬 기록 조회·조건부 비교·삭제
    input: 내 기록, 세션 선택, 이전 기록과 비교, 기록 삭제/삭제 확인
    output: 같은 PC 브라우저의 기록과 비교/삭제 결과
    done: 같은 브라우저에 실제 저장된 기록만 보인다. 모드·지표·기준·설정·배치가 같은 경우에만 정량 비교하고 아니면 "조건이 달라 비교할 수 없어요"를 표시한다. 삭제는 종료된 세션의 원장·리포트·파생 집계에 함께 반영하고 다른 세션의 기준을 훼손하지 않는다. 30일 보관 상한은 접속·조회 시 정리하는 제안값이며 영구 보관을 보장하지 않는다.
  - id: F8
    name: QR 휴대폰 승인 연결
    input: PC 딥 모드 사용하기, 휴대폰 연결 요청, PC 연결 승인
    output: 한 PC 세션에 승인된 휴대폰 연결
    done: PC 첫 화면 QR은 120초·1회용으로 표시하되 카메라를 켜지 않는다. 승인/재발급/만료 후 이전 QR 요청을 거부하고 만료 안내를 표시한다. 새 휴대폰을 자동 교체하지 않는다. 연결 상태와 종료 요청·종료 확인을 구분해 표시한다.
  - id: F9
    name: 측면 배치·개인 기준
    input: 휴대폰 카메라 권한, 측면 가이드, 기준 자세 등록
    output: 측면 배치 품질과 정면·측면 기준
    done: 요구 지점 가시성과 안정 입력 5초가 충족될 때만 등록 완료를 표시한다. 지원 방향·거리·촬영 허용 범위는 실측으로 정하며 조건 미충족 시 딥 모드 시작을 막는다. C7을 측정하지 않은 지표를 CVA로 표시하지 않는다.
  - id: F10
    name: 통합 탐지·연결 장애 복구
    input: 정면·측면 특징·품질·측정 시각, 연결 신호
    output: 딥 모드 판정, 복구 대기, 기본 전환
    done: 유효하고 동기화된 두 입력만 결합한다. 2초 연결 신호가 6초간 없으면 권한을 무효화하고 전체 판정·유효 시간을 멈춘다. "기본 모드로 계속"은 정면 기준이 유효할 때만 가능하며 휴대폰 종료 요청과 확인을 구분한다. 10초 자체 중단은 실기기 검증 대상이다. 모드 변경은 기존 이탈을 닫고 새 구간을 시작한다.
  - id: F12
    name: 개인정보·저장 한계 안내
    input: 시작·카메라·저장·삭제 요청
    output: 기기별 처리·저장 범위와 실패 안내
    done: 로그인 없는 같은 브라우저 기록이며 공유 PC의 다른 이용자에게서 보호되지 않음을 표시한다. 원본 영상·연속 원시 좌표는 저장하지 않는 구조로 구현한다. 딥 모드 최소 특징은 보안 연결로 전달하고 중계 이력은 저장하지 않는다. 저장 실패를 완료로 표시하지 않으며 실제 네트워크·저장·카메라 종료 검사 전 미전송·종료 성공을 단정하지 않는다.
