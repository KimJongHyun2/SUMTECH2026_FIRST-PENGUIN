five_whys:
  symptom: 카드를 새로 만들 때 어떤 카드가 나한테 맞는지 고르기 어렵다
  whys:
    - 카드마다 혜택 분야·할인율·가입 대상(학생·군인 등)이 달라서 한 기준으로 비교가 안 된다
    - 혜택이 "OO 10% 할인, 전월실적 30만 원 이상, 월 최대 1만 원"처럼 조건으로만 적혀 있어서 내 지출을 직접 대입해야 한다
    - 내 한 달 지출이 분야별로 얼마인지 정리해 둔 적이 없어서 대입할 숫자부터 없다?
    - 카드 정보가 카드사별 페이지에 흩어져 있고 형식도 달라서 여러 카드를 같은 표로 모으기 어렵다

solution_paths:
  - path: 신분·나이·지출을 입력하면 규칙에 따라 카드별 예상 혜택 금액을 계산해 순위를 보여 주는 웹 서비스
    status: chosen
    reason: 비교의 핵심 어려움이 "조건을 내 지출에 대입하는 계산"이라 계산을 대신해 주는 것이 가장 직접적인 해결이다
  - path: 평소 소비를 문장으로 쓰면 AI가 분야별 금액으로 바꿔 지출 칸을 채워 주는 기능
    status: chosen
    reason: WHY 3 — 내 지출 숫자가 없으면 계산을 시작할 수 없어서 입력 부담을 줄여야 한다
  - path: 지금 쓰는 카드를 고르면 추천 카드와 같은 규칙으로 계산해 "바꾸면 연 ○○원 더"를 보여 주는 기능
    status: chosen
    reason: 멘토 피드백("추천에서 끝나지 않고 하나 더", 기존 금융 앱과의 차이). 카드를 바꿀지 말지는 지금 카드와의 차이 금액이 있어야 결정할 수 있다
  - path: 카드 정보를 서비스가 실행될 때마다 카드사 사이트에서 실시간 크롤링
    status: rejected
    reason: 사이트 구조가 바뀌면 바로 깨지고 느리다. 대회 기간에 공개 상품 페이지에서 모아 출처·확인일과 함께 data/cards.json으로 넣는다
  - path: 마이데이터·카드 사용내역 자동 연동으로 지출 자동 수집
    status: deferred
    reason: 금융 인증·사업자 자격이 필요해 대회 기간에 만들 수 없다. 문장 입력(F3)으로 입력 부담을 대신 줄인다
  - path: 카드 신청 페이지 연결·제휴 수수료 모델
    status: deferred
    reason: 대회 범위를 넘고, 추천이 제휴 때문에 기울지 않는다는 설명이 먼저 필요하다

insight:
  claim: null # 팀 측정 후 작성. 확인할 가설: "사람들은 혜택 목록을 보고 카드를 고르지만, 실제 받는 금액은 전월실적·월 한도에서 갈린다"
  evidence: null # experiences id(E1…)와 측정 결과를 함께 적는다
  design_decision: |-
    추천 순위는 AI가 정하지 않고 "예상 월 혜택 × 12 − 연회비" 규칙으로 계산해, 같은 입력이면 항상 같은 결과와 분야별 계산 근거를 보여 준다.
    지금 카드도 같은 규칙으로 계산해 차이 금액으로 "바꿀지 말지"를 판단하게 한다.
    AI는 소비 문장을 분야별 금액으로 바꾸는 데에만 쓴다. 로그인·금융 연동 없이 쓰고, 입력값은 서버에 저장하지 않는다.

# ════════════════════════════════════════════════════════════════
# 기능 명세 F1~F8 — 여기 없는 기능은 구현하지 않는다(임의 구현 감점). 새 기능은 먼저 여기에 추가한다.
# ════════════════════════════════════════════════════════════════
# 공통 규칙
#   · 로그인 없음. 입력값은 서버에 저장하지 않고 브라우저 sessionStorage("card-finder-form")에만 둔다(새로고침해도 유지, 탭을 닫으면 사라짐).
#   · 화면 주소: /(첫 화면) · /find(입력) · /result(추천 결과) · /compare(비교) · /cards(전체 카드) · /cards/[id](카드 상세). 그 밖의 주소는 404 화면.
#   · 지출 분야(고정 7개): 식비·카페, 대중교통, 편의점, 온라인쇼핑, 통신비, 구독서비스, 기타
#   · 신분(고정 4개): 대학생, 군인, 직장인, 기타    · 카드 가입 대상: 전체, 대학생, 군인
#   · 금액은 원 단위 정수. 화면에는 "10,600원"처럼 천 단위 쉼표를 찍는다.
#   · 계산 단순화: 전월실적 구간이 여러 개인 카드는 가장 낮은 구간 하나만 쓴다. "할인받은 금액은 실적 제외" 같은 세부 조건은 반영하지 않고, 카드 상세에 "단순화한 계산" 안내를 둔다.
# ════════════════════════════════════════════════════════════════
features:
  - id: F1
    name: 카드 데이터
    input: data/cards.json (카드사 공개 상품 페이지에서 대회 기간에 모은 카드 정보)
    output: |-
      서버가 data/cards.json을 읽어 모든 화면에 쓴다(카드 정보는 읽기 전용이라 DB 없이 파일로 관리한다).
      카드마다 id, 이름, 카드사, 종류(신용/체크), 연회비(원), 가입 대상(전체/대학생/군인), 최소 나이,
      전월실적 조건(원), 혜택 목록[분야, 할인율(%), 월 할인 한도(원)], 출처 URL, 정보 확인일(YYYY-MM-DD)을 가진다.
    done: |-
      카드가 20장 이상이고, 가입 대상이 대학생인 카드와 군인인 카드가 각각 1장 이상 있다.
      모든 카드에 출처 URL과 확인일이 있다. 혜택 분야는 7개 지출 분야 중 하나다. (빌드 전에 검사 스크립트로 확인)

  - id: F2
    name: 내 정보·지출 입력
    input: 신분, 나이, 카드 종류(상관없음/신용카드/체크카드), 연회비 상한(원), 7개 분야별 한 달 지출(원), 지금 쓰는 카드(선택, F8)
    output: |-
      "추천 받기"를 누르면 입력을 검사하고, 통과하면 /result로 간다.
      카드 종류 기본값은 "상관없음". 연회비 상한을 비우면 제한 없음. 비운 지출 칸은 0원.
    done: |-
      신분을 고르지 않으면 "신분을 골라 주세요", 나이가 비었거나 0 이하이면 "나이를 입력해 주세요",
      지출이 모두 0이면 "지출 금액을 하나 이상 입력해 주세요"를 보여 주고 넘어가지 않는다(위에서부터 첫 오류 하나만).
      금액 칸에는 음수를 넣을 수 없다. /result에서 "다시 입력하기"로 돌아오면 입력값이 그대로 남아 있다.

  - id: F3
    name: 문장으로 지출 입력 (AI)
    input: 평소 소비를 적은 문장 (예 "배달음식에 한 달 20만 원, 지하철 6만 원 써요")
    output: |-
      "AI로 채우기"를 누르면 서버(/api/parse-spending)가 AI Gateway에 문장을 보내 7개 분야별 금액(JSON)을 받고,
      0보다 큰 분야만 지출 칸에 채운다(나머지 칸은 그대로). 사용자는 채워진 금액을 고칠 수 있다.
      API 키(AI_GATEWAY_API_KEY)는 서버에서만 읽는다. 키가 없는 로컬 개발 환경에서는 분야 키워드 + 금액 패턴 규칙으로 대신 추출한다.
    done: |-
      응답을 기다리는 동안 버튼이 "분석 중…"으로 바뀌고 눌리지 않는다. 끝나면 문장에 나온 분야 칸에 0보다 큰 금액이 채워진다.
      문장이 비어 있으면 호출하지 않고 "소비 내용을 적어 주세요"를 보여 준다.
      호출 실패·형식 오류·20초 초과·채울 금액이 하나도 없으면 "자동 채우기에 실패했어요. 직접 입력해 주세요"를 보여 주고 기존 입력은 그대로 둔다.

  - id: F4
    name: 카드 추천 결과
    input: F2의 입력값
    output: |-
      다음 규칙으로 계산한 상위 3장을 순위대로 보여 준다.
      1) 거르기: 가입 대상이 "전체"도 내 신분도 아니거나, 최소 나이 미만이거나, 카드 종류가 다르거나, 연회비가 상한을 넘는 카드는 뺀다.
      2) 전월실적: 지출 합계 < 전월실적 조건이면 예상 월 혜택은 0원이고 "실적 미달"로 표시한다.
      3) 예상 월 혜택 = 혜택마다 min(그 분야 지출 × 할인율 ÷ 100 (원 미만 버림), 월 할인 한도)의 합.
      4) 연간 순혜택 = 예상 월 혜택 × 12 − 연회비. 큰 순서로 정렬하고, 같으면 연회비가 낮은 카드, 그래도 같으면 이름 가나다순.
      카드마다 순위, 이름, 카드사, 종류, 예상 월 혜택, 연간 순혜택, 연회비, 그리고 "식비·카페 월 5,000원"처럼 혜택이 생긴 분야별 금액을 보여 준다.
    done: |-
      같은 입력이면 항상 같은 순위가 나온다. 신분이 "직장인"이면 대학생·군인 전용 카드가 결과에 없다.
      조건에 맞는 카드가 없으면 "조건에 맞는 카드가 없어요. 연회비 상한이나 카드 종류를 바꿔 보세요"를 보여 준다.
      입력 없이 /result를 열면 "먼저 내 정보를 입력해 주세요"와 "입력하러 가기" 버튼을 보여 준다.

  - id: F5
    name: 카드 상세
    input: 추천 결과·비교·전체 카드 목록에서 카드 이름 선택 (/cards/[id])
    output: 카드의 혜택 목록(분야·할인율·월 한도), 전월실적 조건, 연회비, 가입 대상, 최소 나이, "출처" 링크, "YYYY-MM-DD 기준", 단순화 계산 안내를 보여 준다
    done: 출처 링크는 새 탭으로 열린다. 없는 카드 id 주소는 404 화면을 보여 준다

  - id: F6
    name: 카드 비교
    input: 추천 결과에서 "비교 담기"로 고른 카드 2~3장
    output: /compare에서 고른 카드를 나란히 놓고 연회비·전월실적·예상 월 혜택·연간 순혜택·7개 분야별 혜택 금액을 표로 보여 준다
    done: |-
      담은 카드가 2장 미만이면 "비교하기"가 눌리지 않는다. 3장을 담은 상태에서 4번째를 담으면 "최대 3장까지 비교할 수 있어요"를 보여 준다.
      담은 카드의 버튼은 "담김"으로 바뀌고, 다시 누르면 담기가 취소된다.

  - id: F7
    name: 전체 카드 목록
    input: 첫 화면의 "전체 카드 보기", 카드 종류·가입 대상 필터
    output: /cards에서 모든 카드를 이름·카드사·종류·연회비·가입 대상과 함께 목록으로 보여 준다. 필터 기본값은 "전체"
    done: 가입 대상 필터에서 "군인"을 고르면 가입 대상이 군인인 카드만 보이고, 카드 종류 필터와 함께 쓰면 두 조건을 모두 만족하는 카드만 보인다

  - id: F8
    name: 지금 카드와 비교 (하나 더)
    input: F2 입력 화면의 "지금 쓰는 카드" 칸에서 카드 이름 일부를 검색해 고른 카드 1장(선택)
    output: |-
      지금 카드도 F4와 같은 규칙(전월실적·월 한도·연회비)으로 예상 월 혜택과 연간 순혜택을 계산한다. 거르기(신분·종류·연회비 상한)는 지금 카드에 적용하지 않는다.
      추천 결과 맨 위에 "지금 카드: (이름) · 연간 순혜택 ○○원"과 "1위 카드로 바꾸면 연 ○○원 더"를 보여 주고,
      추천 카드마다 "지금보다 연 +○○원"(적으면 "−○○원")을 보여 준다. 지금 카드가 추천 3장에 있으면 "지금 쓰는 카드" 표시를 하고 차이는 0원.
    done: |-
      지금 카드의 연간 순혜택이 1위 카드 이상이면 "지금 카드가 가장 잘 맞아요. 바꾸지 않아도 돼요"를 보여 준다.
      지금 카드를 고르지 않으면 비교 문구 없이 F4 결과만 보인다. 검색 결과가 없으면 "찾는 카드가 없어요"를 보여 준다.
      고른 카드는 "빼기"로 지울 수 있다.
