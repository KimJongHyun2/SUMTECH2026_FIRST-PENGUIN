# 현재 기획의 정책·용어 기준이다. 과거 원문·미채택 제안값은 archive/planning-history/에 보존한다.
version: 2026-10-30-v5
status: 사용자 지정 정책을 반영한 기획 확정본; 구현·기기·사용성 검증 전
source: 2026-10-30 최신 사용자 요청의 시간값·인식 중단·로그인 없는 PC 브라우저 로컬 저장 원칙
serviceName: 패스트거북이
servicePurpose: 지속적인 자세 이탈을 감지하고 알려줘 사용자가 스스로 자세를 관리하고 거북목을 예방하도록 돕는다. 예방 효과는 검증 대상이다.
riskDetectionScope: 개인 기준 대비 자세 변화가 지속되는 상황을 감지한다. 거북목 발병 가능성·의학적 위험도 계산·진단·치료를 뜻하지 않는다.
planningScore:
  maximum: 30
  current: 14.6
  targetMinimum: 20
  status: 현재값은 사용자 전달; 목표 달성·재채점 미확인
policyPriority: 최신 사용자 지시 > 이 파일의 공통 정책 > problem.yaml·scenarios.yaml·prd.md > 과거 검토·참고 원문
# 사용자가 이번 정합성 작업에서 지정한 기본값이다. 의학적 기준·최적값 검증과는 구분한다.
defaultsStatus: 현재 기획의 기본값으로 확정; 건강 효과·감지 성능·사용성은 미검증
baselineStableSeconds: 5
deviationSeconds: 10
recoverySeconds: 3
rewarningSeconds: 60
reportValidSeconds: 1800
settings:
  currentRule: 경고 시간·재경고 간격은 사용자 적용값과 기본값을 구분하고 적용 시각·설정 버전을 남긴다.
  validationRule: 0·소수·음수는 저장하지 않고 기존 설정을 유지한다. 이전 문서의 입력 허용 상한은 미채택 제안이며 확정 규칙으로 사용하지 않는다.
  overrideRule: 유효한 사용자 변경값은 적용 이후 구간에만 사용한다. 기준 등록 5초·복귀 3초·자동 리포트 30분은 이 설정으로 바꾸지 않는다.
  scenarioRule: 모든 시나리오는 기본 경고 10초·재경고 60초로 시작한다. S8의 0초는 거부할 오류 입력이다.
pendingDecisions:
  retention: 보관 기간·만료 정리 시점은 미확정이다. 자동 만료와 영구 보관을 확정 기능으로 약속하지 않는다.
  connection: QR 만료 시간·연결 신호 주기·장애 판정/휴대폰 자체 중단 시간은 미확정이다. 기존 제안값은 아카이브에 보존한다.
  settingLimits: 사용자 시간 설정의 입력 상한은 미확정이다. 기본값과 유효한 양의 정수 검증은 유지한다.
continuity:
  validTime: 세션 진행 중 필수 입력이 유효할 때만 누적한다. 기준 등록·자리 비움·인식 불가·사용자 정지·복구 대기·재등록 준비는 제외한다.
  away: 자리 비움은 판정 보류이다. 진행 중 후보는 폐기하고 확정 이탈은 자리 비움 사유로 중단하며 정상 복귀로 집계하지 않는다.
  reset: 자리 비움·인식 불가·입력 갱신 중단·사용자 정지·복구 대기·기준/설정/모드 변경에서 이탈·복귀·재경고 연속 타이머를 모두 초기화한다. 등록 중에는 안정 등록 타이머도 초기화한다.
  return: 같은 배치·기준이 유효하고 사용자가 정지하지 않은 세션에서 입력이 돌아오면 새 연속 구간을 시작한다. 전후 이탈 시간을 이어 붙이거나 보류 중 경고를 나중에 몰아서 표시하지 않는다.
  sessionTime: 입력 중단 전의 누적 유효 시간과 저장 기록은 유지한다. 연속 타이머 초기화와 세션 전체 기록 삭제를 구분한다.
  rewarning: 같은 확정 이탈의 최초 경고 뒤 유효 입력 연속 60초마다 재경고한다. 새 이탈은 새 10초 조건으로 시작하며 이전 재경고 시점을 물려받지 않는다.
login: false
storage: 로그인 없이 PC의 같은 사이트·브라우저 프로필에 로컬 저장
storageMechanism: IndexedDB 또는 localStorage는 구현 수단이다. 어느 수단이든 같은 저장 범위·삭제·실패 계약을 따르며 현재 문서에서 구현 완료를 주장하지 않는다.
storageScope: 계정·로그인·클라우드 동기화·휴대폰 기록 보관 없이 PC 로컬 기록만 제공한다. 다른 브라우저·기기로 자동 공유하지 않는다.
ranking: 후속; 현재 features와 시나리오에서 제외
deepMode: 선택 경로로 기획에 포함; 다중 기기·동기화·주최 측 재현 검증 대기
quantitativeComparison: 모드·지표·기준·설정·배치 유효성이 같을 때만 제공; 조건 차이·자료 부족은 비교 불가
threshold: 실측으로 정할 항목. 10%·15도 등을 보편 정상선이나 확정 감지값으로 사용하지 않는다.
warningText: 기준 자세에서 벗어난 상태가 지속되고 있습니다. 자세를 확인해 주세요.
glossary:
  서비스명: 패스트거북이이다. 과거 명칭은 현재 문서·시나리오의 서비스명으로 사용하지 않는다.
  기준 자세: 사용자가 안내에 따라 연속 안정 입력 5초로 등록한 개인 비교 기준이다. 의학적 정상 인증이 아니다.
  기준 이탈: 개인 기준의 판정 범위를 벗어난 유효 입력이다. 임상 진단을 뜻하지 않는다.
  이탈 후보: 기준 이탈의 연속 시간이 최초 경고 조건에 도달하기 전 상태이다. 확정 이탈 횟수에 넣지 않는다.
  확정 이탈: 기본 연속 10초 조건을 충족한 한 에피소드이다. 유형 중첩·재경고로 개수를 늘리지 않는다.
  최초 경고: 확정 이탈에 처음 실제 표시한 경고이다.
  재경고: 같은 확정 이탈이 계속될 때 최초 경고 뒤 기본 60초마다 실제 표시한 추가 경고이다.
  정상 복귀: 유효 입력이 기준 범위 안에서 연속 3초 유지되어 확정 이탈이 끝난 상태이다.
  자리 비움: 사용자가 촬영 범위를 벗어나 필수 입력이 없는 인식 상태이다. 정상 자세나 사용자 일시 정지가 아니다.
  인식 불가: 가림·낮은 품질·영상 갱신 중단으로 필수 입력을 신뢰할 수 없는 상태이다. 인식 실패는 원인 설명이며 별도의 정상/이탈 상태가 아니다.
  판정 보류: 입력 부족 등으로 정상·이탈·복귀를 결정하지 않고 경고와 유효 시간 누적을 멈추는 처리이다.
  유효 감지 시간: 진행 중 유효 입력이 있었던 구간만 합한 시간이다. 자동 리포트 주기의 기준이다.
  기본 모드: PC 정면 카메라로 개인 기준 대비 변화를 판정하는 경로이다.
  딥 모드: 승인된 휴대폰 측면 특징과 PC 정면 특징을 결합하는 선택 경로이다. 정확도 향상은 검증 대상이다.
  자동 리포트: 누적 유효 감지 1800초마다 생성하는 구간 결과이다. 생성 후에도 세션을 계속한다.
  종료 리포트: 마지막 자동 리포트 뒤 남은 유효 구간이 있을 때 생성하는 부분 결과이다.
validationStatus: 문서 형식·참조·가상 집계 산술 검사 대상; 앱·카메라·E2E·건강 효과 검증과 구분한다.
