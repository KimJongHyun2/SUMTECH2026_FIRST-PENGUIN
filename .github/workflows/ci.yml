# 빌드·단위 테스트·문서 검사. 흐름 E2E는 scenarios.yml이 맡는다.
name: ci

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # build에 TypeScript 검사와 모델·WASM 준비가 포함된다.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- tests/ui/app.spec.ts --forbid-only
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-test-results
          path: frontend/test-results

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: posture-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/posture-experiments
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn matplotlib pytest
      - run: python -m pytest analysis -q

  planning-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: tools
      - run: node tools/check-problem.mjs
      - run: node tools/check-planning.mjs

  # docs/scenarios.yaml의 흐름마다 e2e/scenarios/<id>.spec.ts·test 하나가 있는지, 금지된 우회가 없는지 본다.
  # spec이 없는 흐름이 있으면 실패한다. 실제 통과 여부는 scenarios workflow가 확인한다.
  scenario-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: tools
      - run: node --test tools/check-scenario-specs.test.mjs
      - run: node tools/check-scenario-specs.mjs
