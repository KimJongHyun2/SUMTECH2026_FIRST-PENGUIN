# 현재 기획의 정책·용어 기준이다. 과거 원문·미채택 제안값은 archive/planning-history/에 보존한다.
version: 2026-10-30-v8
status: 사용자 지정 정책을 반영한 기획 확정본; 구현·기기·사용성 검증 전
source: 팀 제공 인터뷰 E1~E3·five_whys·why_ours와 기존 시간·중단·로컬 저장·테스트 예외 정책
serviceName: 패스트거북이
purpose: 작업 중 지속적인 자세 변화를 알려 사용자의 인지와 자기 조정을 돕는다. 의학적 치료나 검증된 예방 효과를 제공한다고 주장하지 않는다.
corePainPoint: 작업 몰입 시 발생하는 자세 인지 불능(Unawareness)이다. 작업 중 자세 변화를 제때 알아차리지 못하는 상황을 뜻하며 의학적 인지 장애를 뜻하지 않는다.
feedbackGoal: 기본 연속 유효 이탈 10초에 확인 계기를 제공해 자세 변화 인지까지 걸리는 시간을 줄이는 것이다. 경고 발생은 인지 성공과 구분한다.
riskDetectionScope: 개인 기준에서 벗어난 자세의 지속을 감지한다. 발병 확률이나 의학적 위험도를 계산하지 않는다.
successMetric:
  name: 자세 이탈 비율
  formula: R = D / V * 100
  unit: '%'
  validSeconds: V는 세션 진행 중 필수 입력이 유효했던 구간의 합집합 시간이다.
  deviationSeconds: D는 확정 이탈의 시작부터 복귀 확인 또는 중단까지를 유효 구간과 교집합한 합집합 시간이다. 최초 확정 전의 시작 구간과 복귀 확인 3초를 포함한다. 지속 조건을 충족하기 전의 이탈 후보는 제외한다.
  excludedTime: 준비·등록·자리 비움·인식 불가·사용자 정지·복구 대기·재등록 준비는 V와 D에서 제외한다.
  zeroValidTime: V가 0이면 비율은 null이며 분석 가능한 기록이 없습니다로 표시한다. 0%로 표시하지 않는다.
  aggregation: 세션·여러 리포트의 비율은 D 합계 / V 합계 * 100이다. 구간별 백분율을 단순 평균하지 않는다.
  comparison: 동일 사용자·작업 조건·모드·지표·기준·설정·배치에서 알림 조건의 R과 비교 조건의 R 차이를 퍼센트포인트로 기록한다. 유효 시간과 보류 시간도 함께 확인한다.
  successDirection: 변화 기반 알림 조건에서 R이 비교 조건보다 낮아지는지 검증한다. 목표 감소폭·표본 수·작업 방해 허용치는 사전 확정 전이며 달성 결과를 만들지 않는다.
  interpretation: R은 측정된 확정 기준 이탈의 시간 비율이다. 전체 부적절 자세 시간·의학적 위험·인지 속도·예방 효과와 동일하지 않다.
awarenessValidation: 별도 동의받은 관찰 실험에서 이탈 시작·알림 표시·사용자의 인지 보고·복귀 확인 시각을 구분한다. 인지 보고가 없으면 해당 관측값을 비워 두고 분석에서 구분한다. 제품에 인지 확인 기능을 추가하는 결정은 아니다.
statusText:
  headForward: 머리가 기준보다 앞으로 나왔어요
  meaning: 개인 기준 대비 변화를 설명하는 화면 상태 문구이다. 개인 기준 대비 머리가 앞으로 나온 상태의 안내이며 의학적 진단이 아니다.
planningScore:
  maximum: 30
  current: 14.6
  targetMinimum: 20
  status: 현재값은 사용자 전달이며 목표 달성은 대시보드 재평가로 확인한다.
policyPriority: 최신 사용자 지시 > 이 파일의 공통 정책 > problem.yaml·scenarios.yaml·prd.md > 과거 검토·참고 원문
# 제품 설계의 기본값이며 의학적 기준·최적값과 구분한다.
defaultsStatus: 현재 기획의 기본값으로 확정; 건강 효과·감지 성능·사용성은 미검증
baselineStableSeconds: 5
deviationSeconds: 10
recoverySeconds: 3
rewarningSeconds: 60
reportValidSeconds: 1800
qrTtlSeconds: 120
qrExpiryRule: 발급 시각부터 경과 120초 미만만 유효하다. 120초 도달·승인 소비·재발급 시 무효이며 요청과 PC 승인 시점 모두 확인한다. 연결 후에는 QR 만료만으로 승인된 연결을 끊지 않는다.
testability:
  status: 2026-10-30 사용자 지정 테스트 예외; 문서 계약이며 테스트 도구·E2E 구현 및 주최측 허용 확인 전
  activation: 평가 전용 빌드 설정 EVAL_ENABLED=true 및 최초 진입 URL /?mode=eval을 모두 요구한다. 운영에서 버튼·주입 핸들러를 제공하지 않고 평가 빌드가 아닌 환경에서는 URL·로컬 저장만으로 활성화하지 않는다. 평가 모드는 같은 context의 화면 이동·새로고침 동안 유지하며 종료 시 폐기한다.
  camera:
    normal: 일반 모드의 권한 거부·장치 없음은 등록·시작 차단과 재시도 안내이다. 녹화 영상으로 자동 우회하지 않는다.
    evaluation: 평가 전용 빌드 설정 EVAL_ENABLED=true와 최초 진입 URL /?mode=eval이 모두 있으면 카메라 켜기에서 getUserMedia 대신 저장소의 e2e/fixtures/test-pose.mp4를 재생한다. 실제 권한을 요구하지 않는다.
    pipeline: 녹화 프레임은 운영과 같은 추론·기준 등록·판정·집계·저장 경로를 지난다. 최종 상태·좌표·리포트를 미리 채우지 않는다.
    failure: 파일 누락·디코딩 실패·필수 구간 미검증이면 평가 입력 실패를 표시하고 등록·시작을 막는다. 실제 카메라나 가짜 정상 입력으로 대체하지 않는다.
    timing: S2의 이탈 10초→복귀 3초와 S4의 이탈 6초→자리 비움 5초→새 이탈 10초→복귀 3초를 클릭 한 번의 연속 영상 재생으로 공급한다. 영상 시각 기준으로 검증하며 명목 시간의 수용 오차는 해당 영상 한 프레임 간격 이내이다.
    fixtureStatus: test-pose.mp4 및 구간 명세는 현재 저장소에 없으며 촬영·추론 검증·커밋 전이다. 평가 입력 구현과 실제 E2E 통과를 주장하지 않는다.
  report:
    scenario: S3
    firstReportValidSeconds: 3
    method: 테스트용 시계·주기를 리포트 스케줄러에 주입해 첫 자동 주기만 1800초에서 유효 3초로 대체한다. 전역 시계·등록·경고·복귀·재경고 시간은 바꾸지 않는다.
    result: 가속된 3초 후 자동 리포트가 정상 팝업되며 실제 V=3초·D=0초·비율 0%와 테스트 표시를 남긴다. 1800초 관찰로 환산하지 않는다.
    reset: 첫 생성 후 가속을 해제하고 마지막 경계부터 다음 주기를 1800초로 복원한다. 종료·새 context에서 초기화하며 다른 시나리오는 1800초이다.
  multiDevice:
    scenarios: [S5, S6]
    entry: 테스트 환경에서 '테스트 도구'를 펼쳐 '[테스트용] 측면 데이터 주입'을 누른다. 실제 QR 스캔·휴대폰 요청만 대체한다.
    inputs: 흐름 전용 휴대폰 연결 요청·측면 특징·품질·시각과 모의 종료 응답을 주입한다. F4의 정면 녹화 프레임의 추론 결과·영상 시각과 동기화하며 PC 승인·안정 등록·판정·집계·저장은 공통 경로이다.
    failure: '[테스트용] 측면 연결 끊기로 입력 중단·연결 끊김·종료 무응답을 주입한다. 즉시 판정 보류·연속 타이머 초기화, 연결 끊김 확인 후 복구 대기, 사용자 선택과 유효 정면 기준·입력 후 같은 세션의 기본 모드로 전환한다.'
  isolation: 테스트 입력·적용 주기를 기록에 표시하고 운영 기록·건강 효과 검증과 분리한다. 최종 상태·리포트·PC 승인 성공을 직접 주입하지 않는다. 측면 모의 종료 응답은 연결 입력 대체에 한해 허용하며 실제 휴대폰 종료 증거로 사용하지 않는다.
  realDeviceValidation: 운영 1800초 경계·실제 QR·휴대폰 통신·추론·카메라 종료와 주최측 mock 제한 수용 여부는 별도 확인한다.
settings:
  currentRule: 경고 시간·재경고 간격은 사용자 적용값과 기본값을 구분하고 적용 시각·설정 버전을 남긴다.
  validationRule: 기존과 같은 유효 값 재적용은 오류만 해제하고 버전·측정 구간·연속 타이머를 유지한다. 0·소수·음수는 저장하지 않고 기존 설정을 유지한다. 이전 문서의 입력 허용 상한은 미채택 제안이며 확정 규칙으로 사용하지 않는다.
  overrideRule: 유효한 사용자 변경값은 적용 이후 구간에만 사용한다. 기준 등록 5초·복귀 3초·자동 리포트 30분은 이 설정으로 바꾸지 않는다.
  scenarioRule: 모든 시나리오는 기본 경고 10초·재경고 60초로 시작한다. S8의 0초는 거부할 오류 입력이다.
pendingDecisions:
  retention: 보관 기간·만료 정리 시점은 구현 전 확정한다. 자동 만료와 영구 보관을 확정 기능으로 약속하지 않는다.
  connection: 연결 신호 주기·장애 판정/휴대폰 자체 중단 시간은 실제 기기 시험 후 확정한다. QR 만료는 발급 후 120초로 확정한다.
  settingLimits: 사용자 시간 설정의 입력 상한은 구현 전 확정한다. 기본값과 유효한 양의 정수 검증은 유지한다.
continuity:
  validTime: 세션 진행 중 필수 입력이 유효할 때만 누적한다. 기준 등록·자리 비움·인식 불가·사용자 정지·복구 대기·재등록 준비는 제외한다.
  away: 자리 비움은 판정 보류이다. 진행 중 후보는 폐기하고 확정 이탈은 자리 비움 사유로 중단하며 정상 복귀로 집계하지 않는다.
  reset: 자리 비움·인식 불가·입력 갱신 중단·사용자 정지·복구 대기·기준/설정/모드 변경에서 이탈·복귀·재경고 연속 타이머를 모두 초기화한다. 등록 중에는 안정 등록 타이머도 초기화한다.
  return: 같은 배치·기준이 유효하고 사용자가 정지하지 않은 세션에서 입력이 돌아오면 새 연속 구간을 시작한다. 전후 이탈 시간을 이어 붙이거나 보류 중 경고를 나중에 몰아서 표시하지 않는다.
  sessionTime: 입력 중단 전의 누적 유효 시간과 저장 기록은 유지한다. 연속 타이머 초기화와 세션 전체 기록 삭제를 구분한다.
  rewarning: 같은 확정 이탈의 최초 경고 뒤 유효 입력 연속 60초마다 재경고한다. 새 이탈은 새 10초 조건으로 시작하며 이전 재경고 시점을 물려받지 않는다.
login: false
storage: 로그인 없이 PC의 같은 사이트·브라우저 프로필에 로컬 저장
storageMechanism: IndexedDB 또는 localStorage는 구현 수단이다. 어느 수단이든 같은 저장 범위·삭제·실패 계약을 따르며 현재 문서에서 구현 완료를 주장하지 않는다.
storageScope: 계정·로그인·클라우드 동기화·휴대폰 기록 보관 없이 PC 로컬 기록만 제공한다. 다른 브라우저·기기로 자동 공유하지 않는다.
ranking: 후속; 현재 features와 시나리오에서 제외
deepMode: 선택 경로로 기획에 포함; 단일 PC E2E는 테스트 측면 주입으로 설계하며 실제 다중 기기·동기화·주최측 수용 검증은 별도
quantitativeComparison: 모드·지표·기준·설정·배치 유효성이 같을 때만 제공; 조건 차이·자료 부족은 비교 불가
threshold: 실측으로 정할 항목. 10%·15도 등을 보편 정상선이나 확정 감지값으로 사용하지 않는다.
warningText: 기준 자세에서 벗어난 상태가 지속되고 있습니다. 자세를 확인해 주세요.
glossary:
  서비스명: 패스트거북이이다. 과거 명칭은 현재 문서·시나리오의 서비스명으로 사용하지 않는다.
  자세 인지 불능: 작업에 몰입해 자세 변화를 제때 알아차리지 못하는 상황이다. 의학적 인지 장애를 뜻하지 않는다.
  자세 이탈 비율: 확정 이탈 합집합 시간 D를 전체 세션 유효 시간 V로 나눈 백분율이다.
  기준 자세: 사용자가 안내에 따라 연속 안정 입력 5초로 등록한 개인 비교 기준이다. 의학적 정상 인증이 아니다.
  기준 이탈: 개인 기준의 판정 범위를 벗어난 유효 입력이다. 임상 진단을 뜻하지 않는다.
  이탈 후보: 기준 이탈의 연속 시간이 최초 경고 조건에 도달하기 전 상태이다. 확정 이탈 횟수에 넣지 않는다.
  확정 이탈: 기본 연속 10초 조건을 충족한 한 에피소드이다. 유형 중첩·재경고로 개수를 늘리지 않는다.
  최초 경고: 확정 이탈에 처음 실제 표시한 경고이다.
  재경고: 같은 확정 이탈이 계속될 때 최초 경고 뒤 기본 60초마다 실제 표시한 추가 경고이다.
  정상 복귀: 유효 입력이 기준 범위 안에서 연속 3초 유지되어 확정 이탈이 끝난 상태이다.
  자리 비움: 사용자가 촬영 범위를 벗어나 필수 입력이 없는 인식 상태이다. 정상 자세나 사용자 일시 정지가 아니다.
  인식 불가: 가림·낮은 품질·영상 갱신 중단으로 필수 입력을 신뢰할 수 없는 상태이다. 인식 실패는 원인 설명이며 별도의 정상/이탈 상태가 아니다.
  판정 보류: 입력 부족 등으로 정상·이탈·복귀를 결정하지 않고 경고와 유효 시간 누적을 멈추는 처리이다.
  유효 감지 시간: 진행 중 유효 입력이 있었던 구간만 합한 시간이다. 자동 리포트 주기의 기준이다.
  기본 모드: PC 정면 카메라로 개인 기준 대비 변화를 판정하는 경로이다.
  딥 모드: 승인된 휴대폰 측면 특징과 PC 정면 특징을 결합하는 선택 경로이다. 정확도 향상은 검증 대상이다.
  자동 리포트: 누적 유효 감지 1800초마다 생성하는 구간 결과이다. 생성 후에도 세션을 계속한다.
  종료 리포트: 마지막 자동 리포트 뒤 남은 유효 구간이 있을 때 생성하는 부분 결과이다.
validationStatus: 문서 형식·참조·가상 집계 산술 검사 대상; 앱·카메라·E2E·건강 효과 검증과 구분한다.
