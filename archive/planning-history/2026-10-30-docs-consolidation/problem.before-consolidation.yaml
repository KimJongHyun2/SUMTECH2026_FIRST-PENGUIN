# 패스트거북이 — 문제 정의와 핵심 기능이다. 상세 계약·정책 수치는 prd.md를 따른다.
statement: 노트북으로 과제·공부하는 대학생은 작업에 몰입하면 자세 변화를 제때 알아차리지 못해 스스로 조정할 시점을 놓치고, 고쳐 앉아도 같은 자세를 반복하는 어려움을 겪는다.
canvas:
  context: >-
    E1은 어제 새벽 2시 캡스톤 회의실 코딩 중, E2는 며칠 전 기숙사에서 밤샘 알고리즘 과제 후, E3는 도서관에서 3시간 연속 인강을 본 뒤의 경험이다. 작업 중에는 자신의 자세나 불편을
    알아차리지 못하고, 타인의 지적이나 작업 중단 뒤에야 몸 상태를 인지했다.
  customer: 노트북으로 과제·공부하는 대학생 중 자세 관리 의향이 있지만 몰입 중 자기 자세 확인을 놓치는 사용자를 초기 고객으로 삼는다.
  root_problem: |-
    핵심 문제는 작업 몰입 중 자세 변화를 제때 알아차리지 못하는 자세 미인지(Unawareness)이다.
    자세 관리 의향이 있어도 조정 시점을 놓치며, 한 번 고쳐 앉는 행동만으로는 다음 이탈에 대응하지 못한다.
    팀은 지속적인 자세 변화에 맞춰 인지와 자기 조정의 계기를 제공하는 데 집중한다.
  impact:
    feeling: >-
      E1의 팀장은 자세를 지적받고 크게 놀랐다. E2의 당사자는 작업 중 자세를 알려줄 사람이 필요하다는 생각이 절실했다. E3의 당사자는 장시간 움직이지 않았다는 사실을 깨닫고 충격을
      받았다.
    measurable: >-
      R1의 2022년 대학생 156명 조사에서 하루 평균 디지털기기 사용 시간은 7.97±3.46시간이며 온라인 수업 기기는 노트북이 47.4%로 가장 많았다.

      R10은 고개를 숙인 채 스마트폰·컴퓨터를 오래 사용하는 상황과 목·어깨 통증을 설명한다.

      R11의 2019년 보도는 건강보험심사평가원 자료를 인용해 2013년 182만 명, 2018년 211만 명과 당시 20대 25만 명을 제시한다. 이는 과거 보도 수치이며 대학생 유병률이나
      현재 시장 규모가 아니다.

      제품의 주 성공 지표는 자세 이탈 비율이며, 동일 조건에서 인지까지 걸린 시간·오경고·작업 방해와 함께 평가한다. 계산과 비교 규칙은 prd.md 4절을 따른다.
  alternatives:
    - how_used: 주변 사람이 자세를 지적하거나 과제·인강을 마친 뒤 몸 상태를 확인한다. E1~E3에서 나타난 대응이다.
      shortcoming: E1은 타인의 지적 전까지, E2·E3는 작업을 멈추고 일어날 때까지 자세나 불편을 알아차리지 못했다.
      why_ours: >-
        우리는 매일 밤 캡스톤 디자인과 해커톤 프로젝트를 위해 노트북 앞에서 뼈를 깎는 IT융합학과 4학년 당사자들입니다. 거북목과 허리 통증은 남의 이야기가 아니라 현재 우리가 겪는 가장
        큰 고통이며, 대학생들의 작업 환경을 누구보다 잘 이해하고 있어 가장 실용적인 해결책을 만들 수 있습니다.
    - how_used: 정해진 시간에 자세 확인·휴식을 알리는 타이머를 대안으로 비교한다.
      shortcoming: 시간 간격을 기준으로 알리므로 실제 자세 이탈 시점과 알림 시점이 분리된다.
      why_ours: 실제 자세 변화의 지속을 기준으로 경고하고, 경고 이후 복귀와 이탈 내역을 리포트로 연결한다.
    - how_used: 받침대·외부 입력장치로 화면 높이와 작업 환경을 조정하는 방법을 대안으로 비교한다.
      shortcoming: 작업 환경을 조정하는 수단으로, 작업 중 자세 변화를 감지하고 알려주는 역할은 제공하지 않는다.
      why_ours: 환경 조정과 함께 사용하며 작업 중 발생한 개인 기준 이탈을 알려 자기 조정을 지원한다.
    - how_used: 개인 기준·웹캠 분석·자세 알림을 제공하는 유사 접근 R5를 비교 대상으로 삼는다.
      shortcoming: 유사 기능이 존재하므로 웹캠 알림 자체만으로 선택 이유를 설명할 수 없다.
      why_ours: 대학생의 학습 세션을 기준으로 탐지·경고·복귀 기록·자동 리포트를 연결하고, 같은 조건의 기록 비교로 반복 관리 경로를 제공한다.
personas:
  - id: P1
    description: 노트북으로 캡스톤 디자인·코딩·알고리즘 과제·인강에 몰입하며 목·어깨·허리 불편과 자세 미인지를 겪는 대학생이다. 팀은 IT융합학과 4학년 당사자들이다.
    source: 팀이 제공한 경험 E1~E3와 팀 소개 원문이다.
experiences:
  - id: E1
    when: 어제 새벽 2시, 캡스톤 회의실에서 코딩하던 중이다.
    what_happened: 옆에 있던 팀장이 모니터 쪽으로 목을 빼고 있었다. 어깨가 아픈데도 화면에 집중하느라 자세와 불편을 알아차리지 못했다고 말했다.
    workaround: 옆에 있던 동료가 '야, 너 목 빠지겠다'라고 말하고 쳐서 알려줬다.
    feeling: 팀장은 본인이 전혀 몰랐다는 사실에 크게 놀랐다.
    quote: >-
      어제 새벽 2시에 캡스톤 회의실에서 코딩하는데, 옆에 있던 팀장이 모니터에 빨려 들어갈 것처럼 목을 빼고 있더라고요. '야, 너 목 빠지겠다' 하고 쳤는데, 본인은 전혀 몰랐다며 엄청
      놀랐습니다. 어깨가 아픈데도 화면에 집중하느라 몰랐대요.
    source: 팀이 제공한 실제 사용자 인터뷰 경험1 원문이다.
  - id: E2
    when: 며칠 전, 기숙사에서 밤새 알고리즘 과제를 하고 일어난 때이다. 회상 기록 제공일은 2026-10-30이다.
    what_happened: 집중할 때에는 아픈 줄 몰랐지만 일어난 뒤 뒷목부터 허리까지 뻐근해 고개를 돌리기 힘들었다.
    workaround: 작업을 마치고 일어난 뒤 몸의 불편을 알아차렸다.
    feeling: 자세가 무너지는 순간 누군가 보고 알려주면 좋겠다는 생각이 절실했다.
    quote: >-
      며칠 전 기숙사에서 밤새 알고리즘 과제를 하고 일어났는데, 뒷목부터 허리까지 너무 뻐근해서 고개를 돌리기 힘들었습니다. 집중할 때는 전혀 아픈 줄 몰랐습니다. 내 자세가 망가지는 걸
      그때그때 누가 쳐다보고 알려주면 좋겠다는 생각이 절실했습니다.
    source: 팀이 제공한 실제 사용자 인터뷰 경험2 원문이다.
  - id: E3
    when: 도서관에서 3시간 내내 인강을 본 뒤 화장실에 가려고 일어난 때이다.
    what_happened: 일어나자 눈앞이 핑 돌고 어깨에 담이 왔다. 3시간 동안 한 번도 움직이지 않고 같은 자세를 유지했다는 사실을 깨달았다.
    workaround: 화장실에 가려고 자리에서 일어나면서 몸 상태와 장시간 움직이지 않은 사실을 알아차렸다.
    feeling: 장시간 같은 자세로 있었다는 사실에 충격을 받았다.
    quote: >-
      도서관에서 3시간 내내 인강을 보다가 화장실 가려고 일어났는데 눈앞이 핑 돌고 어깨에 담이 왔습니다. 내가 3시간 동안 한 번도 안 움직이고 거북이처럼 이러고 있었다는 걸 깨닫고 진짜
      충격받았습니다.
    source: 팀이 제공한 실제 사용자 인터뷰 경험3 원문이다.
sources:
  - id: R1
    url: https://db.koreascholar.com/Article/Detail/418785
    title: 디지털기기의 사용이 대학생의 눈과 근육뼈대계에 미치는 영향, 2022
    claim: >-
      대학생 156명의 온라인 설문에서 하루 평균 디지털기기 사용은 7.97±3.46시간, 온라인 수업 기기 중 노트북 비중은 47.4%였다. 사용 시간과 몸통·전체 근육뼈대계 통증의 관련성을
      보고했다.
  - id: R2
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2521871/
    title: Using Real-Time Visual Feedback to Improve Posture at Computer Workstations, 2008
    claim: 참가자 8명에게 자세 구분 교육·실시간 영상 피드백·자기 점검을 함께 제공해 대부분의 목표 자세 행동이 개선됐다. 복합 개입과 함께 평균 생산성 11% 감소도 보고했다.
  - id: R5
    url: https://github.com/LinklyAI/upright
    title: Upright 공식 저장소
    claim: 브라우저에서 웹캠과 개인 기준 보정을 사용해 자세를 감지하고 화면 색·소리로 알리는 공개 프로젝트이다. README는 영상이 기기를 떠나지 않는다고 설명한다.
  - id: R6
    url: https://oshri.kosha.or.kr/kosha/info/koshaGuideData.do?articleNo=453895&attachNo=261182&mode=download
    title: KOSHA GUIDE E-G-3-2025 영상표시단말기를 사용하는 사무환경 관리에 관한 기술지원규정
    claim: 영상표시단말기 작업을 위한 작업 자세·화면·입력장치·의자·작업대 등 사무환경 관리 권고를 제공한다. 작업 환경 안내에 활용한다.
  - id: R7
    url: >-
      https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART002686853
    title: 웹캠 기반 거북목 판별 알고리즘을 활용한 자세 교정 반응형 헬스케어 시스템, 2021
    claim: 자세에 따라 달라지는 턱선과 어깨의 거리 관계를 이용한 웹캠 기반 SVM 분류 알고리즘과 높이 조절 받침대를 결합한 시스템을 제안했다.
  - id: R8
    url: https://kci.go.kr/kciportal/landing/article.kci?arti_id=ART003378990
    title: 인공지능 기반 자세 추정 모델을 활용한 실시간 거북목 증후군 검출 시스템, 2026
    claim: 얼굴 삼각형 면적 변화·어깨 좌표의 기하학적 변위와 개인 기준 보정을 결합한 단일 웹캠 검출 방법을 제안했다. 초록은 26명·1776프레임의 검증 데이터를 이용한 평가를 보고한다.
  - id: R9
    url: https://www.jstage.jst.go.jp/article/mta/12/4/12_203/_pdf
    title: >-
      Measurement of Viewing Distance and Posture Using the Front Cameras of Digital Devices to Support
      Children’s Health, 2024
    claim: 코와 목 사이의 영상상 거리를 양안 거리로 나눈 비율을 정면 자세 구분에 사용했다. 자세 실험은 성인 5명의 영상으로 수행했다.
  - id: R10
    url: >-
      https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5972
    title: 일자목(거북목)증후군 — 질병관리청 국가건강정보포털, 2026-05-20 업데이트
    claim: 스마트폰·컴퓨터 사용 등으로 고개를 숙인 자세가 지속되는 상황과 목·어깨 통증을 설명한다. 예방을 위해 사용 시간 조절·올바른 자세 유지·중간 스트레칭을 안내한다.
  - id: R11
    url: https://v.daum.net/v/alpzXmTbB9
    title: 휴대폰 보다가 목 빠집니다.. 211만명이 '거북목' — 조선일보, 2019-06-18
    claim: >-
      건강보험심사평가원 자료를 인용한 보도로, 기사상 거북목 증후군 환자는 2013년 182만 명에서 2018년 211만 명으로 늘었으며 2018년 10대 11만 명·20대 25만 명이다.
      과거 문제 규모를 보여주는 2차 자료로 사용한다.
five_whys:
  symptom: 거북목 자세로 장시간 작업하고도 작업 중 자신의 자세와 불편을 알아차리지 못한다.
  whys:
    - 왜 거북목 자세로 장시간 작업하는가? → 화면의 코드에 집중하다 보니 고개가 앞으로 빠져서.
    - 왜 자세가 빠진 것을 스스로 고치지 않는가? → 코딩에 과몰입(Hyper-focus)해 있어서 몸의 통증을 뇌가 무시하기 때문에.
    - 왜 통증이 오기 전에는 모르는가? → 시각적 피드백(모니터)에 주의력이 쏠려 신체 상태를 모니터링할 여력이 없어서.
    - 왜 기존의 시간 알람은 효과가 없는가? → 현재 자세가 나쁘다는 걸 알려주는 게 아니라 기계적으로 울리기 때문에 무시함.
    - "결론: 작업 몰입 시 발생하는 '자세 인지 불능(Unawareness) 상태'를 즉각적으로 깨워줄 맞춤형 외부 개입이 부재하기 때문."
solution_paths:
  - path: 개인 기준 등록 → 자세 탐지 → 지속 이탈 경고 → 자기 조정 → 자동·종료 리포트
    status: chosen
    reason: 자세 미인지 문제에 직접 대응하고 탐지부터 자기 조정 결과 확인까지 하나의 학습 세션으로 연결한다.
  - path: 선택형 딥 모드 연결·양쪽 기준 등록 → 통합 탐지·경고 → 복귀·종료 리포트
    status: chosen
    reason: 정면·측면 입력을 결합하는 선택 경로이다. 기본 경로와 같은 경고·기록 원칙을 적용하며 상세 연결·장애·테스트 계약은 prd.md를 따른다.
  - path: 고정 시간 자세 확인 알림
    status: deferred
    reason: 변화 기반 경고의 가치를 비교하는 실험 조건으로 사용한다.
  - path: 로그인·클라우드 동기화·랭킹
    status: deferred
    reason: 현재 범위는 로그인 없는 PC 브라우저 로컬 기록이다. 랭킹 F11은 후속 범위이다.
insight:
  claim: E1~E3에서 작업 중 몸 상태의 인지는 타인의 지적이나 작업 중단 뒤에 발생했다. 팀은 작업 몰입 중 자세 미인지를 핵심 문제로 정의하고 탐지·경고·리포트로 맞춤형 외부 개입을 제공한다.
  evidence: >-
    E1~E3는 몰입 중 자세·불편 미인지 경험, R1·R10·R11은 사용 환경·신체 불편·과거 문제 규모, R2는 피드백 접근, R5는 유사 서비스, R6~R9는 안내·기술 설계의 근거이다.
    효과와 작업 부담은 prd.md의 리스크 및 검증 계획에서 다룬다.
  design_decision: 탐지→경고→리포트를 핵심 경로로 삼고 개인 기준·로컬 기록·선택형 딥 모드를 제공한다. 정책 수치·집계·예외·테스트 계약은 prd.md에 명시한다.
features:
  - id: F1
    name: 개인 기준 등록·재등록
    input: 카메라 입력과 기준 등록 요청
    output: 개인 기준과 등록 상태
    done: 연속 안정 유효 입력 5초로 기준을 저장하고 등록 완료를 표시한다. 재등록 후 사용자가 탐지를 재개한다.
  - id: F2
    name: 지속 이탈 탐지·경고·복귀
    input: 개인 기준과 유효한 자세 입력
    output: 지속 이탈 경고와 복귀 기록
    done: 연속 유효 이탈 10초에 최초 경고를 표시하고 이후 60초마다 재경고한다. 기준 범위 복귀 3초 확인 후 해제하며 결과를 남긴다.
  - id: F3
    name: 탐지 세션 제어
    input: 시작·일시 정지·재개·종료 요청
    output: 세션·카메라·저장 상태
    done: 요청에 따라 탐지를 시작하거나 멈춘다. 종료 후 카메라와 저장 결과를 표시한다.
  - id: F4
    name: 권한·입력 장애 처리
    input: 카메라 권한과 입력 유효성
    output: 권한 안내와 판정 보류 상태
    done: 일반 모드 권한 거부는 등록·시작 차단과 재시도 안내이다. 평가 전용 빌드의 /?mode=eval은 test-pose.mp4를 공통 추론 경로로 재생한다. 자리 비움·인식 불가는 판정 보류·연속 타이머 초기화이며 V·D 누적을 멈춘다.
  - id: F5
    name: 경고 설정
    input: 민감도·경고 시간·재경고 간격·소리
    output: 적용 설정과 입력 오류 안내
    done: 유효한 설정을 저장하고 잘못된 입력은 이유를 표시한다.
  - id: F6
    name: 자동·종료 리포트
    input: 유효 감지 구간과 이탈·경고·복귀 기록
    output: 자세 이탈 비율과 세션 요약
    done: 누적 유효 30분마다 자동 리포트, 종료 시 남은 구간의 리포트를 저장한다. 구간별 D/V와 전체 합산 D/V를 구분하고 V=0은 계산 불가로 표시한다. S3 첫 주기만 테스트에서 유효 3초이다.
  - id: F7
    name: 기록 조회·비교·삭제
    input: 저장 기록 선택·비교·삭제 요청
    output: 리포트 상세와 비교·삭제 결과
    done: 같은 브라우저의 기록을 표시하고 조건이 맞는 기록을 비교하며 삭제 결과를 반영한다.
  - id: F8
    name: 딥 모드 승인 연결
    input: 휴대폰 연결 요청과 PC 승인
    output: 승인된 연결 상태
    done: 발급 후 120초 미만의 유효 QR 요청만 PC 승인 후 연결한다. 요청·승인 시 만료를 검사하고 120초 도달·사용·재발급 시 거부 이유를 표시한다.
  - id: F9
    name: 딥 모드 기준 등록
    input: 정면·측면 카메라 입력과 배치 확인
    output: 양쪽 개인 기준과 등록 상태
    done: 양쪽 입력이 유효할 때 기준을 저장하고 딥 모드 시작 가능 상태를 표시한다.
  - id: F10
    name: 통합 탐지·장애 복구
    input: 정면·측면 입력과 연결 상태
    output: 통합 판정·복구 대기·기본 전환 상태
    done: 입력 장애 시 판정 보류를 표시하고 사용자 선택과 유효 정면 입력을 확인해 같은 세션의 기본 모드로 바뀐다.
  - id: F12
    name: 로컬 저장·처리 범위 안내
    input: 시작·카메라·저장·삭제 요청
    output: 저장 범위와 처리 결과 안내
    done: 로그인 없는 PC 로컬 저장 범위를 표시하고 저장 성공·실패를 구분한다.
