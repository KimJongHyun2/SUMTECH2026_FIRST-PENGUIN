# 제출 형식에 맞춰 옮긴 검토용 초안이다. 정식 제출 완료 파일이 아니다.
# 기반: 사용자 제공 problem-original.md와 이 대화에서 사용자가 제시한 기능 목록이다.
# 실제 경험은 사용자 전달과 확인 범위까지만 기록하며 문헌을 experiences로 바꾸지 않는다.
# 가설·기술 검증·제품 결정 대기를 확정 사실로 취급하지 않는다.
statement: |
  [문제 가설] 자세를 관리하려고 노력하는 대학생은 노트북으로 장시간 과제나 공부에 몰입하는 상황에서
  자세 확인을 잊고 변화를 제때 알아차리기 어려워 불편을 느낀 뒤에야 자세를 조정하거나 작업을 잠시 멈추는 경험을 한다.
  지금은 생각날 때 자세를 고치거나 타이머와 받침대를 활용하지만 실제 자세 변화에 맞춰 확인하고 대응하기 어렵다는 단점이 남는다.
canvas:
  context: |
    도서관·스터디 카페·집에서 노트북으로 과제, 온라인 강의 수강, 시험 공부를 하는 상황이다.
    몰입 중 고개와 상체가 화면 쪽으로 기울어지는 현상은 가설이며 발생 빈도·지속 시간은 직접 확인하지 않았다.
  customer: |
    노트북으로 오래 과제나 공부를 하며, 자세가 신경 쓰여 스스로 고치거나 관리 도구를 사용해 본 대학생이다.
    자세 관리 의지는 있지만 작업 몰입 중 확인을 잊는 사람을 초기 대상으로 삼는다는 팀의 고객 조건이다.
  root_problem: |
    [잠정 가설] 자세를 관리하려는 의지가 있어도 작업 중 자신의 자세 변화를 제때 확인하고 조정하기 어렵다.
    몰입·환경·기존 관리 방법 중 무엇이 주된 원인인지는 아직 직접 확인하지 않았다.
  impact:
    feeling: |
      자세가 다시 흐트러지는 답답함, 신체 불편에 대한 신경 쓰임, 공부 중 자세 확인의 번거로움은 검증할 영향이다.
      실제 고객 발화와 감정 기록은 아직 없다.
    measurable: null
  alternatives:
    - how_used: '[사용 여부 확인 전] 생각날 때마다 고개와 상체의 자세를 조정한다.'
      shortcoming: '[가설] 작업에 몰입하면 확인을 잊는다.'
      why_ours: null
    - how_used: '[사용 여부 확인 전] 타이머를 맞춰 자세를 확인하거나 잠시 쉰다.'
      shortcoming: '[가설] 실제 변화와 알림 시점이 맞지 않아 무시하거나 불필요하게 느낄 수 있다.'
      why_ours: null
    - how_used: '[사용 여부 확인 전] 받침대 등으로 화면 높이와 작업 환경을 조정한다.'
      shortcoming: '조정 후 남는 불편은 아직 확인되지 않았다. 이 방법만으로 충분하면 추가 서비스의 필요성은 낮다.'
      why_ours: null
# 실제 인물 관찰과 출처가 있는 기록을 확보한 뒤 작성한다.
personas: []
experiences:
  - id: E1
    when: '학교에서 프로젝트를 하던 중이다. 구체적인 날짜·작업 시간은 미확인이다.'
    what_happened: '사용자가 학교 프로젝트 중 친구의 굽은 자세를 보고 친구에게 알려줬다. 목·허리 뻐근함도 처음 설명에 포함됐지만 그 당사자는 아직 확인하지 않았다.'
    workaround: '사용자가 친구에게 자세를 알려줬다. 친구가 실제로 조정했는지와 조정 후 변화는 미확인이다.'
    feeling: null
    quote: null
    source: '사용자가 2026.10.30 대화에서 전달한 경험 설명이다. 당시 발화를 직접 인용한 것은 아니다.'
sources:
  - id: R1
    url: https://db.koreascholar.com/Article/Detail/418785
    title: 디지털기기의 사용이 대학생의 눈과 근육뼈대계에 미치는 영향, 2022
    claim: |
      [공개 초록 확인] 대학생 156명의 설문에서 디지털기기 전체 사용 시간과 몸통·전체 근육뼈대계 통증의 관련성을 보고했다.
      몰입으로 인한 자세 확인 누락이나 자동 경고 필요성을 직접 조사한 결과는 아니다.
  - id: R2
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2521871/
    title: Using Real-Time Visual Feedback to Improve Posture at Computer Workstations, 2008
    claim: |
      [원문 확인] 8명의 실험에서 교육·실시간 영상 피드백·자기 점검의 복합 개입으로 일부 자세 행동이 개선됐고 생산성 감소도 보고했다.
      자동 경고만의 효과는 아니다.
  - id: R3
    url: https://link.springer.com/article/10.1007/s00426-021-01622-2
    title: Posture biofeedback increases cognitive load, 2022
    claim: |
      [공개 초록 확인] 컴퓨터 게임 중 자세 피드백을 제공한 조건에서 목 자세 지표가 개선됐지만 게임 수행 점수는 낮아졌다.
      대학생의 실제 과제 상황이나 몰입 중 자세 확인 누락을 직접 입증하지 않는다.
  - id: R4
    url: https://pubmed.ncbi.nlm.nih.gov/37883913/
    title: Can biofeedback training in combination with ergonomic information reduce pain among young adult computer users with neck and upper extremity symptoms?, 2024
    claim: |
      [공개 초록 확인] 젊은 컴퓨터 사용자 39명의 연구에서 바이오피드백 훈련과 인체공학 상담의 자세·통증 개선은 대조군 대비 유의하지 않았다.
  - id: R5
    url: https://github.com/LinklyAI/upright
    title: Upright 공식 저장소
    claim: |
      [공개 README 확인] 개인 기준 등록과 기기 내 웹캠 분석, 자세 알림 기능을 설명하는 공개 프로젝트이다.
      정확도·건강 효과를 독립 검증한 자료는 아니다.
  - id: R6
    url: https://oshri.kosha.or.kr/kosha/info/koshaGuideData.do?articleNo=453895&attachNo=261182&mode=download
    title: KOSHA GUIDE E-G-3-2025 영상표시단말기를 사용하는 사무환경 관리에 관한 기술지원규정
    claim: |
      [공식 PDF 확인] 머리 중립·어깨 이완·화면 및 입력장치 배치·등과 발 지지의 작업 자세 권고를 제공한다.
      정면 웹캠의 거북목 진단 임계값은 아니다.
  - id: R7
    url: https://koreascience.kr/article/JAKO202106763002134.pdf
    title: 웹캠 기반 거북목 판별 알고리즘을 활용한 자세 교정 반응형 헬스케어 시스템, 2021
    claim: |
      [원문 확인] 정면의 양광대·턱과 어깨선 사이 거리의 얼굴 너비 대비 비율을 자세 분류 특징으로 사용했다.
      소규모이며 테스트 자료를 튜닝에도 사용해 일반 사용자 최종 성능으로 확대할 수 없다.
  - id: R8
    url: https://kci.go.kr/kciportal/landing/article.kci?arti_id=ART003378990
    title: 인공지능 기반 자세 추정 모델을 활용한 실시간 거북목 증후군 검출 시스템, 2026
    claim: |
      [KCI와 원문 확인] 얼굴 삼각형 면적 변화와 어깨 변위, 개인 기준 보정을 조합한 정면 웹캠 자세 분류 방법을 제안했다.
      설정값은 휴리스틱이며 임상 교차 검증은 향후 과제이다.
  - id: R9
    url: https://www.jstage.jst.go.jp/article/mta/12/4/12_203/_pdf
    title: Measurement of Viewing Distance and Posture Using the Front Cameras of Digital Devices to Support Children’s Health, 2024
    claim: |
      [원문 확인] 코와 목 기준점의 거리 대비 양안 거리 비율을 정면 자세 구분에 사용했다.
      자세 실험은 성인 5명의 파일럿이며 제안값을 보편 정상선으로 적용할 수 없다.
five_whys:
  symptom: '사용자 원문은 자세 정보를 알아도 실제 작업 중 유지하지 못하는 문헌 현상에서 출발한다. 초기 고객의 실제 경험은 아직 없다.'
  whys:
    - '[해석] 자세 정보를 아는 것과 작업 중 행동으로 유지하는 것은 다를 수 있다.'
    - '[간접 근거] 작업과 자세 관리 사이에 주의 부담이 있을 수 있다. R3은 이를 뒷받침하지만 확인 누락의 직접 증거는 아니다.'
solution_paths:
  - path: 개인 기준 등록 후 지속적인 자세 변화를 감지해 경고한다. 선택형 딥 모드는 QR로 휴대폰 측면 카메라를 추가한다.
    status: chosen
    reason: '사용자가 제시한 해법이다. 변화에 맞춘 경고가 자세 확인과 조정을 돕는지 검증한다.'
  - path: 일정 시간마다 자세 확인 경고를 표시한다.
    status: deferred
    reason: '첨부한 기존 초안의 보류 경로이다. 실제 변화와 무관한 경고의 비교·대체안이다.'
insight:
  claim: '문헌에 자세 피드백의 행동 개선과 작업 부담이 함께 보고돼 도움과 방해를 동시에 평가해야 한다.'
  evidence: 'R1~R4는 문헌 근거이다. E1은 학교 프로젝트 중 사용자가 친구의 굽은 자세를 보고 알려준 관찰 사례이다. 친구의 자가 인식 여부·실제 조정·경고 효과를 입증한 것은 아니다.'
  design_decision: |
    사용자 선택은 기준 대비 지속 변화 경고와 선택형 측면 딥 모드이다.
    예방을 위한 자세 관리가 제품 목적이다. 최초 자세를 의학적으로 정상이라고 인증하지 않고 진단·치료·검증되지 않은 장기 예방 효과를 주장하지 않는다.
features:
  - id: F1
    name: 개인 기준 자세 등록·재등록
    input: 카메라 영상과 사용자의 기준 등록·재등록 요청이다.
    output: 개인 기준 특징과 등록 상태이다.
    done: |
      [완료 조건 초안] 인식 조건 충족 시 기준을 등록하고 재등록하면 이후 비교 기준을 갱신한다.
      인식 조건·등록 시간·기준의 저장 위치는 팀 결정과 기술 검증이 필요하다.
  - id: F2
    name: 자세 변화 감지·지속 경고
    input: 등록 기준, 현재 영상에서 추정한 특징, 경고 설정이다.
    output: 감지 상태와 경고 이벤트이다.
    done: |
      [완료 조건 초안] 검증한 이탈 조건이 설정 시간 지속되면 경고하고 복귀 조건이 충족되면 해제한다.
      같은 연속 이탈과 재경고를 구분한다. 임계값과 지속·복귀 시간은 미정이다.
  - id: F3
    name: 세션 시작·일시 정지·재개·종료
    input: 사용자의 세션 제어 요청이다.
    output: 세션 상태와 시간 기록이다.
    done: |
      [완료 조건 초안] 시작 후 탐지하며 정지 중 판정 시간을 누적하지 않고 재개·종료 상태를 구분한다.
      종료 시 카메라 사용을 종료한다. 정지 중 카메라 정책은 미정이다.
  - id: F4
    name: 감지 상태·카메라 오류 표시
    input: 카메라 권한·연결과 신체 인식 상태이다.
    output: 감지 중·일시 정지·자리 비움·인식 불가 표시와 복구 안내이다.
    done: '[완료 조건 초안] 인식 불가 상태에서 자세 경고를 중단하고 정상 자세로 집계하지 않는다. 권한 거부 시 재시도 방법을 표시한다.'
  - id: F5
    name: 경고 설정
    input: 민감도·재경고 간격·소리 사용 여부이다.
    output: 적용된 경고 설정이다.
    done: '[완료 조건 초안] 설정이 경고 동작에 반영된다. 기본값·허용 범위·보관 방식은 미정이다.'
  - id: F6
    name: 세션별 탐지 리포트
    input: 유효 감지 구간, 이탈 구간, 경고, 모드 기록이다.
    output: 시간·기준 이탈·경고 횟수의 요약이다.
    done: '[완료 조건 초안] 실제 구간으로 집계하고 인식 불가·정지 시간을 분리하며 이탈 발생 횟수와 재경고 포함 경고 횟수를 구분한다.'
  - id: F7
    name: 개인 기록 조회·비교·삭제
    input: 사용자의 기록 조회·기간 선택·삭제 요청이다.
    output: 일별·주별 기록과 비교 결과, 삭제 결과이다.
    done: '[완료 조건 초안] 저장한 기록을 조회하고 선택한 범위의 기록을 삭제한다. 소유권·로그인·보관 위치·기간은 팀 결정 대기이다.'
  - id: F8
    name: 휴대폰 QR 연결
    input: PC 웹 접속, 휴대폰 QR 스캔과 연결 요청이다.
    output: 같은 세션의 PC·휴대폰 연결 상태이다.
    done: '[완료 조건 초안] PC 접속 시 QR을 생성하고 휴대폰으로 접속해 연결한다. 승인·만료·재발급·재연결 규칙은 확정이 필요하다.'
  - id: F9
    name: 딥 모드 측면 배치·기준 등록
    input: 휴대폰 카메라 영상과 측면 배치·등록 요청이다.
    output: 배치 적합성 안내와 측면 기준이다.
    done: '[완료 조건 초안] 서비스가 요구하는 측면 방향과 신체 가시성 조건을 충족할 때 등록한다. 지원 각도·거리·판정값은 기술 검증 대기이다.'
  - id: F10
    name: 정면·측면 통합 탐지
    input: 정면·측면 특징, 각 기준값, 연결 상태·시간 정보이다.
    output: 딥 모드 판정과 PC 경고이다.
    done: '[완료 조건 초안] 두 입력을 실제 판정에 사용하고 같은 이탈에 중복 경고하지 않는다. 통합 규칙과 측면 끊김 처리·처리 위치는 미정이다.'
  - id: F11
    name: 랭킹 시스템
    input: null
    output: null
    done: null
  - id: F12
    name: 카메라·개인정보 안내
    input: PC·휴대폰의 카메라 사용 요청과 데이터 처리 방식이다.
